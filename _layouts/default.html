<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>
    <script>
      // Apply saved theme immediately to prevent flash
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
      }

      // Same for the condensed view, so the long copy never flashes in
      if (localStorage.getItem('condensed') === '1') {
        document.body.classList.add('is-condensed');
      }
    </script>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script>
      var toggle = document.getElementById('theme-toggle');
      var icon = document.getElementById('toggle-icon');

      function updateIcon() {
        if (document.body.classList.contains('light-mode')) {
          icon.innerHTML = '&#9790;';  // moon
        } else {
          icon.innerHTML = '&#9788;';  // sun
        }
      }

      updateIcon();

      toggle.addEventListener('click', function() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme',
          document.body.classList.contains('light-mode') ? 'light' : 'dark'
        );
        updateIcon();
      });

      // --- Condense toggle (pages with `condense: true` in front matter) ---
      var condense = document.getElementById('condense-toggle');

      if (condense) {
        function syncCondense() {
          var on = document.body.classList.contains('is-condensed');
          condense.classList.toggle('is-on', on);
          condense.setAttribute('aria-pressed', on ? 'true' : 'false');
        }

        syncCondense();

        condense.addEventListener('click', function() {
          document.body.classList.toggle('is-condensed');
          localStorage.setItem('condensed',
            document.body.classList.contains('is-condensed') ? '1' : '0'
          );
          syncCondense();
        });
      }

    </script>

  </body>

</html>
