# GitHub Pages runs Jekyll over this repository before serving it. The site is
# plain HTML, so all Jekyll has to do is copy files, and skip these, which are
# not part of the site.
exclude:
  - api-proxy
  - test
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - resumes
  - embedded_resume.pdf
  - .env
