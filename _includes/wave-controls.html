<canvas id="sine-wave-bg"></canvas>

<button class="wave-controls-open{% if include.controls_open %} hidden{% endif %}" id="open-controls" onclick="document.getElementById('wave-controls').classList.remove('hidden'); this.classList.add('hidden');">Controls</button>
<div class="wave-controls{% unless include.controls_open %} hidden{% endunless %}" id="wave-controls">
  <div class="wave-controls-top">
    <button class="hide-waves-toggle" id="hide-text">Hide Text</button>
  </div>
  <div class="wave-slider">
    <button class="wave-enable-btn active" id="enable1">W1</button>
    <label for="freq1">freq</label>
    <input type="range" id="freq1" min="0.1" max="1.0" value="0.3" step="0.01">
    <span class="freq-value" id="freq1-val">0.30 Hz</span>
    <label for="amp1">Amp</label>
    <input type="range" id="amp1" min="0.1" max="2.0" value="1.0" step="0.05">
    <span class="freq-value" id="amp1-val">1.00</span>
    <select id="type1" class="wave-type-select"><option value="sin">sin</option><option value="cos">cos</option><option value="square">square</option><option value="sawtooth">saw</option><option value="triangle">tri</option></select>
    <button class="fft-toggle" id="fft1">Freq.</button>
    <button class="fft-toggle" id="play1">&#9654;</button>
  </div>
  <div class="wave-slider">
    <button class="wave-enable-btn active" id="enable2">W2</button>
    <label for="freq2">freq</label>
    <input type="range" id="freq2" min="0.1" max="1.0" value="0.5" step="0.01">
    <span class="freq-value" id="freq2-val">0.50 Hz</span>
    <label for="amp2">Amp</label>
    <input type="range" id="amp2" min="0.1" max="2.0" value="1.0" step="0.05">
    <span class="freq-value" id="amp2-val">1.00</span>
    <select id="type2" class="wave-type-select"><option value="sin">sin</option><option value="cos">cos</option><option value="square">square</option><option value="sawtooth">saw</option><option value="triangle">tri</option></select>
    <button class="fft-toggle" id="fft2">Freq.</button>
    <button class="fft-toggle" id="play2">&#9654;</button>
  </div>
  <div class="wave-slider">
    <button class="wave-enable-btn active" id="enable3">W3</button>
    <label for="freq3">freq</label>
    <input type="range" id="freq3" min="0.1" max="1.0" value="0.2" step="0.01">
    <span class="freq-value" id="freq3-val">0.20 Hz</span>
    <label for="amp3">Amp</label>
    <input type="range" id="amp3" min="0.1" max="2.0" value="1.0" step="0.05">
    <span class="freq-value" id="amp3-val">1.00</span>
    <select id="type3" class="wave-type-select"><option value="sin">sin</option><option value="cos">cos</option><option value="square">square</option><option value="sawtooth">saw</option><option value="triangle">tri</option></select>
    <button class="fft-toggle" id="fft3">Freq.</button>
    <button class="fft-toggle" id="play3">&#9654;</button>
  </div>
  <div class="wave-combine-section">
    <div class="wave-combine-header">
      <button class="combine-power" id="combine-power">Combine</button>
      <button class="fft-toggle" id="fft-combined">Freq.</button>
      <button class="fft-toggle" id="play-combined">&#9654;</button>
    </div>
    <div class="wave-combine-expr hidden" id="combine-expr">
      <span class="combine-wave-label">W1</span>
      <button class="combine-op-btn" id="op12">+</button>
      <span class="combine-wave-label">W2</span>
      <button class="combine-op-btn" id="op23">+</button>
      <span class="combine-wave-label">W3</span>
    </div>
  </div>
  <div class="wave-controls-footer">
    <button class="hide-waves-toggle" id="hide-waves">Hide Waves</button>
    <button class="close-panel-btn" id="close-controls" onclick="document.getElementById('wave-controls').classList.add('hidden'); document.getElementById('open-controls').classList.remove('hidden');">Close</button>
  </div>
</div>
