<script>
(function() {
  var canvas = document.getElementById('sine-wave-bg');
  var controls = document.getElementById('wave-controls');
  var openBtn = document.getElementById('open-controls');
  var closeBtn = document.getElementById('close-controls');

  document.body.insertBefore(canvas, document.body.firstChild);
  document.body.appendChild(controls);
  document.body.appendChild(openBtn);
  document.body.style.backgroundColor = 'transparent';

  var controlsOpen = {{ include.controls_open | default: false }};

  openBtn.addEventListener('click', function() {
    controls.classList.remove('hidden');
    openBtn.classList.add('hidden');
    controlsOpen = true;
  });

  closeBtn.addEventListener('click', function() {
    controls.classList.add('hidden');
    openBtn.classList.remove('hidden');
    controlsOpen = false;
  });

  var ctx = canvas.getContext('2d');
  var startTime = performance.now();
  var isLight = document.body.classList.contains('light-mode');

  var fftState = [false, false, false];
  var wavesHidden = false;

  var slider1 = document.getElementById('freq1');
  var slider2 = document.getElementById('freq2');
  var slider3 = document.getElementById('freq3');
  var val1 = document.getElementById('freq1-val');
  var val2 = document.getElementById('freq2-val');
  var val3 = document.getElementById('freq3-val');
  var ampSlider1 = document.getElementById('amp1');
  var ampSlider2 = document.getElementById('amp2');
  var ampSlider3 = document.getElementById('amp3');
  var ampVal1 = document.getElementById('amp1-val');
  var ampVal2 = document.getElementById('amp2-val');
  var ampVal3 = document.getElementById('amp3-val');
  var typeSelect1 = document.getElementById('type1');
  var typeSelect2 = document.getElementById('type2');
  var typeSelect3 = document.getElementById('type3');
  var fftBtn1 = document.getElementById('fft1');
  var fftBtn2 = document.getElementById('fft2');
  var fftBtn3 = document.getElementById('fft3');
  var fftBtns = [fftBtn1, fftBtn2, fftBtn3];
  var hideBtn = document.getElementById('hide-waves');
  var combinePowerBtn = document.getElementById('combine-power');
  var combineExpr = document.getElementById('combine-expr');
  var op12Btn = document.getElementById('op12');
  var op23Btn = document.getElementById('op23');
  var fftCombinedBtn = document.getElementById('fft-combined');
  var playCombinedBtn = document.getElementById('play-combined');

  var combineActive = false;
  var combineFft = false;
  var combineSigns = [1, 1, 1]; // sign multipliers for add/sub
  var combineOps = [null, '+', '+']; // ops between waves: index 1 = W1 op W2, index 2 = W2 op W3
  // '+' = add, '−' = subtract, '∗' = convolve
  var combinedPlayOsc = null; // ScriptProcessorNode for combined playback
  var combinedPlayGain = null;

  combinePowerBtn.addEventListener('click', function() {
    combineActive = !combineActive;
    combinePowerBtn.classList.toggle('active', combineActive);
    if (combineActive) {
      combineExpr.classList.remove('hidden');
    } else {
      combineExpr.classList.add('hidden');
      combineFft = false;
      fftCombinedBtn.classList.remove('active');
      fftCombinedBtn.textContent = 'Freq.';
      stopCombinedPlay();
    }
  });

  function cycleOp(btn, opIdx) {
    var ops = ['+', '\u2212', '\u2217'];
    var current = combineOps[opIdx];
    var nextIdx = (ops.indexOf(current) + 1) % ops.length;
    combineOps[opIdx] = ops[nextIdx];
    btn.textContent = ops[nextIdx];
    // Update combineSigns for backward compat with add/sub
    if (ops[nextIdx] === '+') combineSigns[opIdx] = 1;
    else if (ops[nextIdx] === '\u2212') combineSigns[opIdx] = -1;
    else combineSigns[opIdx] = 1; // conv doesn't use sign
    btn.classList.remove('subtract', 'convolve');
    if (ops[nextIdx] === '\u2212') btn.classList.add('subtract');
    if (ops[nextIdx] === '\u2217') btn.classList.add('convolve');
    // Rebuild combined playback if active
    if (combinedPlayOsc) { stopCombinedPlay(); startCombinedPlay(); }
  }

  op12Btn.addEventListener('click', function() { cycleOp(op12Btn, 1); });
  op23Btn.addEventListener('click', function() { cycleOp(op23Btn, 2); });

  fftCombinedBtn.addEventListener('click', function() {
    if (!combineActive) return;
    combineFft = !combineFft;
    fftCombinedBtn.classList.toggle('active', combineFft);
    fftCombinedBtn.textContent = combineFft ? 'Time' : 'Freq.';
  });

  // --- Discrete convolution of two arrays ---
  function discreteConvolve(a, b) {
    var len = a.length + b.length - 1;
    var result = new Float32Array(len);
    for (var i = 0; i < a.length; i++) {
      for (var j = 0; j < b.length; j++) {
        result[i + j] += a[i] * b[j];
      }
    }
    // Normalize to prevent clipping
    var maxVal = 0;
    for (var k = 0; k < len; k++) {
      if (Math.abs(result[k]) > maxVal) maxVal = Math.abs(result[k]);
    }
    if (maxVal > 0) {
      for (var k = 0; k < len; k++) result[k] /= maxVal;
    }
    return result;
  }

  // Generate one cycle of samples for a wave at audio rate
  function generateWaveCycle(idx, sampleRate) {
    var freq = parseFloat(document.getElementById('freq' + (idx + 1)).value);
    var ampMult = parseFloat(document.getElementById('amp' + (idx + 1)).value);
    var waveType = document.getElementById('type' + (idx + 1)).value;
    var cycleSamples = Math.round(sampleRate / freq);
    cycleSamples = Math.min(cycleSamples, sampleRate * 2);
    var samples = new Float32Array(cycleSamples);
    for (var i = 0; i < cycleSamples; i++) {
      var angle = 2 * Math.PI * freq * i / sampleRate;
      samples[i] = waveFnEval(waveType, angle) * ampMult;
    }
    return samples;
  }

  // Compute the combined signal as an audio buffer
  function buildCombinedBuffer() {
    if (!audioCtx) return null;
    var sr = audioCtx.sampleRate;

    // Start with W1 if enabled
    var result = waveEnabled[0] ? generateWaveCycle(0, sr) : new Float32Array(1);

    // Apply op12 with W2
    if (waveEnabled[1]) {
      var w2 = generateWaveCycle(1, sr);
      if (combineOps[1] === '\u2217') {
        result = discreteConvolve(result, w2);
      } else {
        // Add or subtract: match lengths by repeating shorter
        var maxLen = Math.max(result.length, w2.length);
        var combined = new Float32Array(maxLen);
        var sign = combineSigns[1];
        for (var i = 0; i < maxLen; i++) {
          combined[i] = result[i % result.length] + sign * w2[i % w2.length];
        }
        result = combined;
      }
    }

    // Apply op23 with W3
    if (waveEnabled[2]) {
      var w3 = generateWaveCycle(2, sr);
      if (combineOps[2] === '\u2217') {
        result = discreteConvolve(result, w3);
      } else {
        var maxLen = Math.max(result.length, w3.length);
        var combined = new Float32Array(maxLen);
        var sign = combineSigns[2];
        for (var i = 0; i < maxLen; i++) {
          combined[i] = result[i % result.length] + sign * w3[i % w3.length];
        }
        result = combined;
      }
    }

    // Create looping AudioBuffer
    var buf = audioCtx.createBuffer(1, result.length, sr);
    buf.copyToChannel(result, 0);
    return buf;
  }

  function startCombinedPlay() {
    if (combinedPlayOsc) return;
    ensureAudioCtx();
    var buf = buildCombinedBuffer();
    if (!buf) return;

    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    var gain = audioCtx.createGain();
    gain.gain.value = 0.3;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();

    combinedPlayOsc = src;
    combinedPlayGain = gain;
    playCombinedBtn.classList.add('active');
  }

  function stopCombinedPlay() {
    if (combinedPlayOsc) {
      combinedPlayOsc.stop();
      combinedPlayOsc.disconnect();
      combinedPlayOsc = null;
    }
    if (combinedPlayGain) {
      combinedPlayGain.disconnect();
      combinedPlayGain = null;
    }
    playCombinedBtn.classList.remove('active');
  }

  playCombinedBtn.addEventListener('click', function() {
    if (!combineActive) return;
    if (combinedPlayOsc) {
      stopCombinedPlay();
    } else {
      startCombinedPlay();
    }
  });

  function updateLabel(slider, label) {
    label.textContent = parseFloat(slider.value).toFixed(2) + ' Hz';
  }

  function updateAmpLabel(slider, label) {
    label.textContent = parseFloat(slider.value).toFixed(2);
  }

  slider1.addEventListener('input', function() { updateLabel(slider1, val1); });
  slider2.addEventListener('input', function() { updateLabel(slider2, val2); });
  slider3.addEventListener('input', function() { updateLabel(slider3, val3); });
  ampSlider1.addEventListener('input', function() { updateAmpLabel(ampSlider1, ampVal1); });
  ampSlider2.addEventListener('input', function() { updateAmpLabel(ampSlider2, ampVal2); });
  ampSlider3.addEventListener('input', function() { updateAmpLabel(ampSlider3, ampVal3); });

  fftBtn1.addEventListener('click', function() { fftState[0] = !fftState[0]; updateFftButtons(); });
  fftBtn2.addEventListener('click', function() { fftState[1] = !fftState[1]; updateFftButtons(); });
  fftBtn3.addEventListener('click', function() { fftState[2] = !fftState[2]; updateFftButtons(); });

  hideBtn.addEventListener('click', function() {
    wavesHidden = !wavesHidden;
    hideBtn.textContent = wavesHidden ? 'Show Waves' : 'Hide Waves';
    hideBtn.classList.toggle('active', wavesHidden);
  });

  var hideTextBtn = document.getElementById('hide-text');
  var textHidden = false;
  hideTextBtn.addEventListener('click', function() {
    textHidden = !textHidden;
    hideTextBtn.textContent = textHidden ? 'Show Text' : 'Hide Text';
    hideTextBtn.classList.toggle('active', textHidden);
    var pageContent = document.querySelector('.page-content');
    var header = document.querySelector('.site-header');
    var footer = document.querySelector('.site-footer');
    if (pageContent) pageContent.style.display = textHidden ? 'none' : '';
    if (header) header.style.display = textHidden ? 'none' : '';
    if (footer) footer.style.display = textHidden ? 'none' : '';
  });

  var waveEnabled = [true, true, true];
  var enableBtns = [document.getElementById('enable1'), document.getElementById('enable2'), document.getElementById('enable3')];
  for (var ei = 0; ei < 3; ei++) {
    (function(idx) {
      enableBtns[idx].addEventListener('click', function() {
        waveEnabled[idx] = !waveEnabled[idx];
        enableBtns[idx].classList.toggle('active', waveEnabled[idx]);
      });
    })(ei);
  }

  function updateFftButtons() {
    for (var i = 0; i < 3; i++) {
      fftBtns[i].classList.toggle('active', fftState[i]);
      fftBtns[i].textContent = fftState[i] ? 'Time' : 'Freq.';
    }
  }

  updateLabel(slider1, val1);
  updateLabel(slider2, val2);
  updateLabel(slider3, val3);

  var dpr = window.devicePixelRatio || 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  var observer = new MutationObserver(function() {
    isLight = document.body.classList.contains('light-mode');
  });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // Scale spatial frequency so ~3 full cycles always fit on screen
  function getSpatialFreq() {
    return (3 * 2 * Math.PI) / window.innerWidth;
  }

  // Scale amplitude based on screen height
  function getAmplitude() {
    return Math.min(50, window.innerHeight * 0.06);
  }

  // Evaluate wave shape at a given angle
  function waveFnEval(waveType, angle) {
    switch (waveType) {
      case 'cos': return Math.cos(angle);
      case 'square':
        var s = Math.sin(angle);
        return s >= 0 ? 1 : -1;
      case 'sawtooth':
        var p = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        return (p / Math.PI) - 1;
      case 'triangle':
        var p = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        return p < Math.PI ? (2 * p / Math.PI) - 1 : 3 - (2 * p / Math.PI);
      default: return Math.sin(angle);
    }
  }

  // Shared helper: draw a frequency axis with tick marks
  function drawFreqAxis(axisY, w_css, axisColor, textColor, fontSize, label) {
    var isMobile = w_css < 600;
    var margin = isMobile ? 15 : 40;
    var pxPerHz = w_css * (isMobile ? 0.35 : 0.3);
    var center = w_css / 2;

    ctx.strokeStyle = axisColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(margin, axisY);
    ctx.lineTo(w_css - margin, axisY);
    ctx.stroke();

    ctx.fillStyle = textColor;
    ctx.font = fontSize;
    ctx.textAlign = 'center';
    ctx.fillText('0', center, axisY + 14);
    if (!isMobile && label) ctx.fillText(label, w_css - 60, axisY - 8);

    for (var tick = -1.0; tick <= 1.0; tick += 0.25) {
      if (Math.abs(tick) < 0.01) continue;
      var tx = center + tick * pxPerHz;
      ctx.strokeStyle = axisColor;
      ctx.beginPath();
      ctx.moveTo(tx, axisY - 3);
      ctx.lineTo(tx, axisY + 3);
      ctx.stroke();
    }

    return { pxPerHz: pxPerHz, center: center, margin: margin };
  }

  // Draw a single magnitude spike with arrowhead at given x position
  function drawSpike(posX, axisY, height, color, isMobile) {
    var arrowSize = isMobile ? 3 : 4;
    ctx.strokeStyle = color;
    ctx.lineWidth = isMobile ? 2 : 3;
    ctx.beginPath();
    ctx.moveTo(posX, axisY);
    ctx.lineTo(posX, axisY - height);
    ctx.stroke();

    var tipY = axisY - height;
    ctx.beginPath();
    ctx.moveTo(posX, tipY);
    ctx.lineTo(posX - arrowSize, tipY + arrowSize * 2);
    ctx.lineTo(posX + arrowSize, tipY + arrowSize * 2);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Draw phase grid lines and labels
  function drawPhaseGrid(phaseY, phaseHeight, margin, w_css, axisColor, textColor, fontSize) {
    ctx.strokeStyle = axisColor;
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 4]);

    ctx.beginPath();
    ctx.moveTo(margin, phaseY - phaseHeight);
    ctx.lineTo(w_css - margin, phaseY - phaseHeight);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(margin, phaseY + phaseHeight);
    ctx.lineTo(w_css - margin, phaseY + phaseHeight);
    ctx.stroke();

    var halfH = phaseHeight / 2;
    ctx.beginPath();
    ctx.moveTo(margin, phaseY - halfH);
    ctx.lineTo(w_css - margin, phaseY - halfH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(margin, phaseY + halfH);
    ctx.lineTo(w_css - margin, phaseY + halfH);
    ctx.stroke();

    ctx.setLineDash([]);

    ctx.fillStyle = textColor;
    ctx.font = fontSize;
    ctx.textAlign = 'right';
    ctx.fillText('\u03c0', margin - 4, phaseY - phaseHeight + 4);
    ctx.fillText('\u03c0/2', margin - 4, phaseY - halfH + 4);
    ctx.fillText('0', margin - 4, phaseY + 4);
    ctx.fillText('-\u03c0/2', margin - 4, phaseY + halfH + 4);
    ctx.fillText('-\u03c0', margin - 4, phaseY + phaseHeight + 4);
  }

  // Draw a phase stem at given x position
  function drawPhaseDot(posX, axisY, phase, maxPhaseHeight, color, labelFontSize, isMobile) {
    var py = axisY - (phase / Math.PI) * maxPhaseHeight;
    var r = isMobile ? 3.5 : 5;

    ctx.strokeStyle = color;
    ctx.lineWidth = isMobile ? 1.5 : 2;
    ctx.beginPath();
    ctx.moveTo(posX, axisY);
    ctx.lineTo(posX, py);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(posX, py, r, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();

    ctx.font = labelFontSize;
    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    var phaseLabel = formatPhase(phase);
    var labelY = (phase >= 0) ? py - r - 5 : py + r + 13;
    ctx.fillText(phaseLabel, posX, labelY);
  }

  function formatPhase(phase) {
    var normalized = phase;
    while (normalized > Math.PI) normalized -= 2 * Math.PI;
    while (normalized < -Math.PI) normalized += 2 * Math.PI;

    if (Math.abs(normalized) < 0.01) return '0';
    if (Math.abs(normalized - Math.PI) < 0.01 || Math.abs(normalized + Math.PI) < 0.01) return '\u00b1\u03c0';
    if (Math.abs(normalized - Math.PI / 2) < 0.01) return '\u03c0/2';
    if (Math.abs(normalized + Math.PI / 2) < 0.01) return '-\u03c0/2';
    if (Math.abs(normalized - Math.PI / 4) < 0.01) return '\u03c0/4';
    if (Math.abs(normalized + Math.PI / 4) < 0.01) return '-\u03c0/4';
    if (Math.abs(normalized - 3 * Math.PI / 4) < 0.01) return '3\u03c0/4';
    if (Math.abs(normalized + 3 * Math.PI / 4) < 0.01) return '-3\u03c0/4';
    return (normalized / Math.PI).toFixed(2) + '\u03c0';
  }

  function getWavePhase(waveType, sign) {
    var base;
    switch (waveType) {
      case 'cos': base = 0; break;
      case 'square': base = -Math.PI / 2; break;
      case 'sawtooth': base = -Math.PI / 2; break;
      case 'triangle': base = 0; break;
      default: base = -Math.PI / 2; break;
    }
    if (sign < 0) base += Math.PI;
    while (base > Math.PI) base -= 2 * Math.PI;
    while (base < -Math.PI) base += 2 * Math.PI;
    return base;
  }

  function getNegPhase(posPhase) {
    return -posPhase;
  }

  function getHarmonics(waveType, ampMult, numHarmonics) {
    var harmonics = [];
    switch (waveType) {
      case 'sin':
        harmonics.push({n: 1, mag: ampMult, phase: -Math.PI / 2});
        break;
      case 'cos':
        harmonics.push({n: 1, mag: ampMult, phase: 0});
        break;
      case 'square':
        for (var n = 1; n <= numHarmonics; n += 2) {
          harmonics.push({n: n, mag: ampMult * 4 / (n * Math.PI), phase: -Math.PI / 2});
        }
        break;
      case 'sawtooth':
        for (var n = 1; n <= numHarmonics; n++) {
          var sign = (n % 2 === 0) ? -1 : 1;
          harmonics.push({n: n, mag: ampMult * 2 / (n * Math.PI), phase: sign > 0 ? -Math.PI / 2 : Math.PI / 2});
        }
        break;
      case 'triangle':
        for (var n = 1; n <= numHarmonics; n += 2) {
          var k = (n - 1) / 2;
          var sign = (k % 2 === 0) ? 1 : -1;
          harmonics.push({n: n, mag: ampMult * 8 / (n * n * Math.PI * Math.PI), phase: sign > 0 ? -Math.PI / 2 : Math.PI / 2});
        }
        break;
    }
    return harmonics;
  }

  function drawFreqDomain(freq, ampMult, waveType, baseY, w_css) {
    var spikeColor = isLight ? 'rgba(200, 50, 50,' : 'rgba(255, 100, 100,';
    var phaseColor = isLight ? 'rgba(50, 130, 50,' : 'rgba(100, 220, 140,';
    var axisColor = isLight ? 'rgba(100, 100, 100, 0.4)' : 'rgba(150, 150, 150, 0.4)';
    var textColor = isLight ? 'rgba(100, 100, 100, 0.7)' : 'rgba(180, 180, 180, 0.7)';
    var isMobile = w_css < 600;
    var fontSize = isMobile ? '9px monospace' : '11px monospace';
    var labelFontSize = isMobile ? '10px monospace' : '12px monospace';
    var spikeHeight = isMobile ? 25 : 35;
    var phaseHeight = isMobile ? 30 : 40;
    var gap = isMobile ? 50 : 70;

    var magY = baseY - gap / 2;
    var info = drawFreqAxis(magY, w_css, axisColor, textColor, fontSize, '|X(f)|');

    ctx.fillStyle = textColor;
    ctx.font = isMobile ? '9px monospace' : '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Magnitude', info.margin, magY - spikeHeight * ampMult - 10);

    var phaseY = baseY + gap / 2 + phaseHeight;
    drawFreqAxis(phaseY, w_css, axisColor, textColor, fontSize, '\u2220X(f)');
    drawPhaseGrid(phaseY, phaseHeight, info.margin, w_css, axisColor, textColor, fontSize);

    ctx.fillStyle = textColor;
    ctx.font = isMobile ? '9px monospace' : '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Phase', info.margin, phaseY - phaseHeight - 10);

    var maxHarmonics = isMobile ? 7 : 15;
    var harmonics = getHarmonics(waveType, ampMult, maxHarmonics);

    for (var hi = 0; hi < harmonics.length; hi++) {
      var h = harmonics[hi];
      var hFreq = freq * h.n;
      var scaledH = spikeHeight * h.mag;
      var posX = info.center + hFreq * info.pxPerHz;
      var negX = info.center - hFreq * info.pxPerHz;
      var alpha = hi === 0 ? 0.9 : 0.6;

      if (posX > w_css - info.margin || negX < info.margin) continue;

      drawSpike(posX, magY, scaledH, spikeColor + ' ' + alpha + ')', isMobile);
      drawSpike(negX, magY, scaledH, spikeColor + ' ' + alpha + ')', isMobile);

      if (hi < 4) {
        ctx.fillStyle = spikeColor + ' 1)';
        ctx.font = labelFontSize;
        ctx.textAlign = 'center';
        ctx.fillText(h.mag.toFixed(2), posX, magY - scaledH - 6);
        var freqLabel = h.n === 1 ? freq.toFixed(2) : (hFreq).toFixed(2);
        ctx.fillText(freqLabel, posX, magY + 24);
        ctx.fillText('-' + freqLabel, negX, magY + 24);
      }

      var negPhaseVal = getNegPhase(h.phase);
      drawPhaseDot(posX, phaseY, h.phase, phaseHeight, phaseColor + ' ' + alpha + ')', labelFontSize, isMobile);
      drawPhaseDot(negX, phaseY, negPhaseVal, phaseHeight, phaseColor + ' ' + alpha + ')', labelFontSize, isMobile);
    }

    ctx.textAlign = 'start';
  }

  function drawCombinedFreqDomain(baseY, w_css) {
    var axisColor = isLight ? 'rgba(100, 100, 100, 0.4)' : 'rgba(150, 150, 150, 0.4)';
    var textColor = isLight ? 'rgba(100, 100, 100, 0.7)' : 'rgba(180, 180, 180, 0.7)';
    var isMobile = w_css < 600;
    var fontSize = isMobile ? '9px monospace' : '11px monospace';
    var labelFontSize = isMobile ? '10px monospace' : '12px monospace';
    var spikeHeight = isMobile ? 25 : 35;
    var phaseHeight = isMobile ? 30 : 40;
    var gap = isMobile ? 50 : 70;

    var sliderEls = [slider1, slider2, slider3];
    var ampSliderEls = [ampSlider1, ampSlider2, ampSlider3];
    var typeSelectEls = [typeSelect1, typeSelect2, typeSelect3];
    var waveColors = isLight
      ? ['rgba(42, 122, 226,', 'rgba(34, 160, 80,', 'rgba(200, 120, 20,']
      : ['rgba(108, 182, 255,', 'rgba(100, 220, 140,', 'rgba(255, 180, 80,'];

    var magY = baseY - gap / 2;
    var info = drawFreqAxis(magY, w_css, axisColor, textColor, fontSize, '|X(f)|');

    ctx.fillStyle = textColor;
    ctx.font = isMobile ? '9px monospace' : '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Magnitude', info.margin, magY - spikeHeight * 2 - 10);

    var phaseY = baseY + gap / 2 + phaseHeight;
    drawFreqAxis(phaseY, w_css, axisColor, textColor, fontSize, '\u2220X(f)');
    drawPhaseGrid(phaseY, phaseHeight, info.margin, w_css, axisColor, textColor, fontSize);

    ctx.fillStyle = textColor;
    ctx.font = isMobile ? '9px monospace' : '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Phase', info.margin, phaseY - phaseHeight - 10);

    var maxHarmonics = isMobile ? 7 : 15;
    for (var i = 0; i < 3; i++) {
      var freq = parseFloat(sliderEls[i].value);
      var ampMult = parseFloat(ampSliderEls[i].value);
      var waveType = typeSelectEls[i].value;
      var sign = combineSigns[i];
      var color = waveColors[i];
      var harmonics = getHarmonics(waveType, ampMult, maxHarmonics);

      for (var hi = 0; hi < harmonics.length; hi++) {
        var h = harmonics[hi];
        var hFreq = freq * h.n;
        var scaledH = spikeHeight * h.mag;
        var posX = info.center + hFreq * info.pxPerHz;
        var negX = info.center - hFreq * info.pxPerHz;
        var alpha = hi === 0 ? 0.9 : 0.5;

        if (posX > w_css - info.margin || negX < info.margin) continue;

        drawSpike(posX, magY, scaledH, color + ' ' + alpha + ')', isMobile);
        drawSpike(negX, magY, scaledH, color + ' ' + alpha + ')', isMobile);

        if (hi === 0) {
          ctx.fillStyle = color + ' 1)';
          ctx.font = labelFontSize;
          ctx.textAlign = 'center';
          ctx.fillText(h.mag.toFixed(2), posX, magY - scaledH - 6);
          ctx.fillText((sign < 0 ? '\u2212' : '') + freq.toFixed(2), posX, magY + 24);
          ctx.fillText((sign < 0 ? '\u2212' : '') + '-' + freq.toFixed(2), negX, magY + 24);
        }

        var hPhase = h.phase;
        if (sign < 0) hPhase += Math.PI;
        while (hPhase > Math.PI) hPhase -= 2 * Math.PI;
        while (hPhase < -Math.PI) hPhase += 2 * Math.PI;
        var negPhaseVal = getNegPhase(hPhase);
        drawPhaseDot(posX, phaseY, hPhase, phaseHeight, color + ' ' + alpha + ')', labelFontSize, isMobile);
        drawPhaseDot(negX, phaseY, negPhaseVal, phaseHeight, color + ' ' + alpha + ')', labelFontSize, isMobile);
      }
    }

    ctx.font = isMobile ? '9px monospace' : '11px monospace';
    ctx.textAlign = 'left';
    for (var j = 0; j < 3; j++) {
      ctx.fillStyle = waveColors[j] + ' 0.8)';
      var signLabel = combineSigns[j] < 0 ? '\u2212' : '+';
      ctx.fillText(signLabel + 'W' + (j + 1), info.margin, magY - spikeHeight * 2 + 4 + j * 14);
    }

    ctx.textAlign = 'start';
  }

  // --- Tone playback ---------------------------------------------------------
  //
  // Each wave can be sounded as a pure tone. The audio-file player, its filters and
  // the share links moved to their own app at /playroom/audio/, so nothing here
  // builds an analyser or a filter chain: an oscillator goes straight to output.

  var wavePlayBtns = [document.getElementById('play1'), document.getElementById('play2'), document.getElementById('play3')];
  var waveSliders = [slider1, slider2, slider3];
  var waveAmpSliders = [ampSlider1, ampSlider2, ampSlider3];
  var waveTypeSelects = [typeSelect1, typeSelect2, typeSelect3];

  var audioCtx = null;
  var wavePlayOscs = [null, null, null];
  var wavePlayGains = [null, null, null];

  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function waveTypeToOsc(waveType) {
    return (waveType === 'sin' || waveType === 'cos') ? 'sine' : waveType;
  }

  function toggleWavePlay(idx) {
    if (wavePlayOscs[idx]) {
      wavePlayOscs[idx].stop();
      wavePlayOscs[idx].disconnect();
      wavePlayOscs[idx] = null;
      wavePlayGains[idx].disconnect();
      wavePlayGains[idx] = null;
      wavePlayBtns[idx].classList.remove('active');
      return;
    }
    ensureAudioCtx();

    var osc = audioCtx.createOscillator();
    osc.type = waveTypeToOsc(waveTypeSelects[idx].value);
    osc.frequency.value = parseFloat(waveSliders[idx].value);

    var gain = audioCtx.createGain();
    gain.gain.value = parseFloat(waveAmpSliders[idx].value) * 0.3;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();

    wavePlayOscs[idx] = osc;
    wavePlayGains[idx] = gain;
    wavePlayBtns[idx].classList.add('active');
  }

  wavePlayBtns[0].addEventListener('click', function() { toggleWavePlay(0); });
  wavePlayBtns[1].addEventListener('click', function() { toggleWavePlay(1); });
  wavePlayBtns[2].addEventListener('click', function() { toggleWavePlay(2); });

  // Keeps a tone that is already sounding in step with its sliders.
  function updateOscillatorParams(idx) {
    if (!wavePlayOscs[idx]) return;
    wavePlayOscs[idx].frequency.value = parseFloat(waveSliders[idx].value);
    wavePlayOscs[idx].type = waveTypeToOsc(waveTypeSelects[idx].value);
    if (wavePlayGains[idx]) {
      wavePlayGains[idx].gain.value = parseFloat(waveAmpSliders[idx].value) * 0.3;
    }
  }

  for (var mi = 0; mi < 3; mi++) {
    (function(idx) {
      waveSliders[idx].addEventListener('input', function() { updateOscillatorParams(idx); });
      waveAmpSliders[idx].addEventListener('input', function() { updateOscillatorParams(idx); });
      waveTypeSelects[idx].addEventListener('change', function() { updateOscillatorParams(idx); });
    })(mi);
  }

  function draw() {
    var w_css = window.innerWidth;
    var h_css = window.innerHeight;

    ctx.fillStyle = isLight ? '#ffffff' : '#1e1e1e';
    ctx.fillRect(0, 0, w_css, h_css);

    var t = (performance.now() - startTime) / 1000;

    var sliders = [slider1, slider2, slider3];
    var ampSliders = [ampSlider1, ampSlider2, ampSlider3];
    var typeSelects = [typeSelect1, typeSelect2, typeSelect3];
    var yOffsets = [0.3, 0.5, 0.7];

    function waveVal(i, x, t) {
      var freq = parseFloat(sliders[i].value);
      var ampMult = parseFloat(ampSliders[i].value);
      var waveType = typeSelects[i].value;
      var phase = 2 * Math.PI * freq * t;
      var sf = getSpatialFreq();
      var amp = getAmplitude() * ampMult;
      var angle = x * sf - phase;
      return waveFnEval(waveType, angle) * amp;
    }

    function computeVisualCombined(width, t) {
      function getWaveSamples(idx) {
        var samples = new Float32Array(width + 1);
        if (!waveEnabled[idx]) return null;
        for (var x = 0; x <= width; x++) {
          samples[x] = waveVal(idx, x, t);
        }
        return samples;
      }

      function visualConvolve(a, b) {
        var len = a.length;
        var result = new Float32Array(len);
        var halfKern = Math.min(Math.floor(b.length / 2), 50);
        for (var i = 0; i < len; i++) {
          var sum = 0;
          for (var j = -halfKern; j <= halfKern; j++) {
            var bi = j + halfKern;
            var ai = i - j;
            if (ai >= 0 && ai < len && bi < b.length) {
              sum += a[ai] * b[bi];
            }
          }
          result[i] = sum / (halfKern + 1);
        }
        return result;
      }

      var result = getWaveSamples(0);
      if (!result) result = new Float32Array(width + 1);

      var w2 = getWaveSamples(1);
      if (w2) {
        if (combineOps[1] === '\u2217') {
          result = visualConvolve(result, w2);
        } else {
          var sign = combineSigns[1];
          for (var i = 0; i <= width; i++) result[i] += sign * w2[i];
        }
      }

      var w3 = getWaveSamples(2);
      if (w3) {
        if (combineOps[2] === '\u2217') {
          result = visualConvolve(result, w3);
        } else {
          var sign = combineSigns[2];
          for (var i = 0; i <= width; i++) result[i] += sign * w3[i];
        }
      }

      return result;
    }

    if (!wavesHidden) {
      for (var i = 0; i < 3; i++) {
        if (!waveEnabled[i]) continue;
        var freq = parseFloat(sliders[i].value);
        var ampMult = parseFloat(ampSliders[i].value);
        var waveType = typeSelects[i].value;
        var baseY = h_css * yOffsets[i];

        if (fftState[i]) {
          drawFreqDomain(freq, ampMult, waveType, baseY, w_css);
        } else {
          ctx.beginPath();
          ctx.moveTo(0, baseY);
          for (var x = 0; x <= w_css; x++) {
            var y = baseY + waveVal(i, x, t);
            ctx.lineTo(x, y);
          }
          var waveAlpha = controlsOpen ? 0.25 : 0.1;
          ctx.strokeStyle = isLight ? 'rgba(42, 122, 226, ' + waveAlpha + ')' : 'rgba(108, 182, 255, ' + waveAlpha + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      if (combineActive) {
        var combinedY = h_css * 0.5;
        var hasConv = combineOps[1] === '\u2217' || combineOps[2] === '\u2217';

        if (combineFft) {
          drawCombinedFreqDomain(combinedY, w_css);
        } else if (hasConv) {
          var combinedSamples = computeVisualCombined(w_css, t);
          ctx.beginPath();
          ctx.moveTo(0, combinedY);
          for (var x = 0; x <= w_css; x++) {
            ctx.lineTo(x, combinedY + combinedSamples[x]);
          }
          var combAlpha = controlsOpen ? 0.5 : 0.15;
          ctx.strokeStyle = isLight ? 'rgba(180, 60, 180, ' + combAlpha + ')' : 'rgba(220, 140, 255, ' + combAlpha + ')';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(0, combinedY);
          for (var x = 0; x <= w_css; x++) {
            var val = (waveEnabled[0] ? combineSigns[0] * waveVal(0, x, t) : 0) + (waveEnabled[1] ? combineSigns[1] * waveVal(1, x, t) : 0) + (waveEnabled[2] ? combineSigns[2] * waveVal(2, x, t) : 0);
            ctx.lineTo(x, combinedY + val);
          }
          var combAlpha = controlsOpen ? 0.5 : 0.15;
          ctx.strokeStyle = isLight ? 'rgba(180, 60, 180, ' + combAlpha + ')' : 'rgba(220, 140, 255, ' + combAlpha + ')';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(draw);
  }


  draw();
})();
</script>
