<script>
(function() {
  // Signal Share: an audio player whose entire state fits in a link.
  //
  // The wave/convolution playground is a separate app now. Nothing here reads or
  // writes its controls, so the two can change independently.

  var CLIP_API = 'https://nero-chatbot-proxy.nhamidi.workers.dev';
  var CLIP_ID_RE = /^[A-Za-z0-9_-]{22}$/;
  var DEMO_SRC = '{{ "/assets/audio/symphony.mp3" | relative_url }}';

  var FILTER_CODES = { lowpass: 'lp', highpass: 'hp', bandpass: 'bp', 'notch-wide': 'bs', 'notch-narrow': 'nt' };
  var FILTER_TYPES = { lp: 'lowpass', hp: 'highpass', bp: 'bandpass', bs: 'notch-wide', nt: 'notch-narrow' };
  // The two notch presets only differ by the Q they arrive with.
  var FILTER_DEFAULT_Q = { 'notch-wide': 0.5, 'notch-narrow': 10 };

  var el = {};
  [
    'aud-drop', 'aud-file', 'aud-demo', 'aud-player', 'aud-canvas', 'aud-name', 'aud-change',
    'aud-current', 'aud-seek', 'aud-duration', 'aud-stop', 'aud-play', 'aud-play-icon',
    'aud-volume', 'aud-vol-val', 'aud-shape', 'aud-filters', 'aud-params',
    'aud-filter-freq', 'aud-filter-freq-val', 'aud-filter-q', 'aud-filter-q-val',
    'aud-pitch', 'aud-pitch-val', 'aud-pitch-rate', 'aud-pitch-reset',
    'aud-note-name', 'aud-note-hz', 'aud-note-cents',
    'aud-view-wave', 'aud-view-freq', 'aud-share', 'aud-share-btn', 'aud-share-out',
    'aud-share-link', 'aud-share-copy', 'aud-share-status', 'aud-share-hint',
    'aud-shared-note', 'aud-shared-detail'
  ].forEach(function(id) { el[id] = document.getElementById(id); });

  var ctx2d = el['aud-canvas'].getContext('2d');
  var isLight = document.body.classList.contains('light-mode');
  new MutationObserver(function() {
    isLight = document.body.classList.contains('light-mode');
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  var audioCtx = null;
  var gainNode = null;
  var filterNode = null;
  var analyser = null;
  var filterType = null;
  var showWave = true;
  var showFreq = true;
  var semitones = 0;
  var lastDetect = 0;
  var detectBuf = null;

  // Playback runs off a decoded AudioBuffer rather than an <audio> element.
  // Routing an element through createMediaElementSource leaves pause and
  // playbackRate at the mercy of each browser's media stack, and Safari honours
  // neither reliably. A buffer source is plain Web Audio: stop() always stops, and
  // playbackRate always resamples, so pitch and transport behave the same
  // everywhere. The cost is that a track is fully decoded before it plays, which
  // the 12 MB upload cap already bounds.
  var audioBuffer = null;
  var bufSource = null;
  var offsetSec = 0;        // position in the buffer, in buffer seconds
  var startedAt = 0;        // audioCtx.currentTime when the current source started
  var playing = false;
  var loadToken = 0;        // guards against a slow load finishing after a newer one

  var PLAY_PATH = 'M8 5.5v13l11-6.5z';
  var PAUSE_PATH = 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z';

  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function filterSliderToFreq(val) {
    var minLog = Math.log(20);
    var maxLog = Math.log(20000);
    return Math.exp(minLog + (val / 1000) * (maxLog - minLog));
  }

  function formatFilterFreq(hz) {
    return hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : Math.round(hz) + ' Hz';
  }

  // --- audio graph -----------------------------------------------------------

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.value = parseFloat(el['aud-volume'].value);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      rebuildChain();
    }
    // Creation is allowed without a gesture; resuming is not, so this is called
    // again from the play handler where a real activation exists.
    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }

  function rebuildChain() {
    if (!audioCtx) return;
    try { gainNode.disconnect(); } catch (e) {}
    if (filterNode) { try { filterNode.disconnect(); } catch (e) {} }
    try { analyser.disconnect(); } catch (e) {}

    var head = analyser;
    if (filterType) {
      if (!filterNode) filterNode = audioCtx.createBiquadFilter();
      filterNode.type = filterType.replace('-wide', '').replace('-narrow', '');
      filterNode.frequency.value = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
      filterNode.Q.value = parseFloat(el['aud-filter-q'].value);
      filterNode.connect(analyser);
      head = filterNode;
    }
    gainNode.connect(head);
    analyser.connect(audioCtx.destination);
  }

  // --- loading ---------------------------------------------------------------

  function resetTrackUi(name) {
    audioName = name;
    el['aud-name'].textContent = name;
    el['aud-drop'].classList.add('hidden');
    el['aud-player'].classList.remove('hidden');
    el['aud-shape'].classList.remove('hidden');
    el['aud-share'].classList.remove('hidden');
    el['aud-duration'].textContent = '0:00';
    el['aud-current'].textContent = '0:00';
    el['aud-seek'].value = 0;
  }

  // `get` returns a promise for the raw bytes, so a local file and a shared clip
  // take the same path from here on.
  function loadBytes(get, name, label) {
    var token = ++loadToken;
    stopSource();
    audioBuffer = null;
    offsetSec = 0;
    setPlaying(false);
    resetTrackUi(name);
    el['aud-name'].textContent = name + '  (decoding\u2026)';

    ensureCtx();

    get().then(function(bytes) {
      if (token !== loadToken) return null;
      return new Promise(function(resolve, reject) {
        // Callback form kept as well: older Safari never returned a promise here.
        var ret = audioCtx.decodeAudioData(bytes, resolve, reject);
        if (ret && ret.then) ret.then(resolve, reject);
      });
    }).then(function(buf) {
      if (token !== loadToken || !buf) return;
      audioBuffer = buf;
      el['aud-name'].textContent = name;
      el['aud-duration'].textContent = formatTime(buf.duration);
      el['aud-seek'].max = buf.duration;
      el['aud-seek'].step = 0.01;
    }).catch(function() {
      if (token !== loadToken) return;
      el['aud-name'].textContent = label === 'clip'
        ? 'This clip could not be loaded'
        : 'That file could not be decoded';
      el['aud-share-status'].textContent = 'Try a different MP3 or WAV.';
      clearNote();
    });
  }

  function loadFile(file) {
    loadBytes(function() {
      if (file.arrayBuffer) return file.arrayBuffer();
      return new Promise(function(resolve, reject) {
        var fr = new FileReader();
        fr.onload = function() { resolve(fr.result); };
        fr.onerror = function() { reject(fr.error); };
        fr.readAsArrayBuffer(file);
      });
    }, file.name, 'file');
  }

  function loadUrl(url, name, label) {
    loadBytes(function() {
      return fetch(url).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      });
    }, name, label);
  }

  // --- transport core --------------------------------------------------------

  function rate() { return Math.pow(2, semitones / 12); }

  function position() {
    if (!audioBuffer) return 0;
    if (!playing || !audioCtx) return offsetSec;
    var p = offsetSec + (audioCtx.currentTime - startedAt) * rate();
    return p < 0 ? 0 : (p > audioBuffer.duration ? audioBuffer.duration : p);
  }

  function stopSource() {
    if (!bufSource) return;
    try { bufSource.onended = null; } catch (e) {}
    try { bufSource.stop(); } catch (e) {}
    try { bufSource.disconnect(); } catch (e) {}
    bufSource = null;
  }

  function startAt(sec) {
    if (!audioBuffer) return;
    ensureCtx();
    stopSource();

    offsetSec = Math.max(0, Math.min(sec, Math.max(0, audioBuffer.duration - 0.01)));
    bufSource = audioCtx.createBufferSource();
    bufSource.buffer = audioBuffer;
    bufSource.playbackRate.value = rate();
    bufSource.connect(gainNode);
    bufSource.onended = function() {
      // Only a natural end reaches here; stopSource clears the handler first.
      offsetSec = 0;
      bufSource = null;
      setPlaying(false);
      el['aud-seek'].value = 0;
      el['aud-current'].textContent = '0:00';
    };
    startedAt = audioCtx.currentTime;
    bufSource.start(0, offsetSec);
    setPlaying(true);
  }

  function pausePlayback() {
    if (!playing) return;
    offsetSec = position();
    stopSource();
    setPlaying(false);
  }

  function setPlaying(on) {
    playing = on;
    if (!on) clearNote();
    el['aud-play-icon'].setAttribute('d', on ? PAUSE_PATH : PLAY_PATH);
    el['aud-play'].setAttribute('aria-label', on ? 'Pause' : 'Play');
    el['aud-play'].classList.toggle('is-on', on);
  }

  // --- visualiser ------------------------------------------------------------

  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var rect = el['aud-canvas'].getBoundingClientRect();
    if (!rect.width) return;
    el['aud-canvas'].width = rect.width * dpr;
    el['aud-canvas'].height = rect.height * dpr;
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', sizeCanvas);

  function draw() {
    var rect = el['aud-canvas'].getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;

    if (w && (el['aud-canvas'].width !== Math.round(w * (window.devicePixelRatio || 1)))) sizeCanvas();

    ctx2d.clearRect(0, 0, w, h);

    if (audioBuffer && playing) {
      var pos = position();
      el['aud-seek'].value = pos;
      el['aud-current'].textContent = formatTime(pos);
    }

    if (analyser && w) {
      var bins = analyser.frequencyBinCount;
      var half = showWave && showFreq;

      if (showWave) {
        var time = new Uint8Array(bins);
        analyser.getByteTimeDomainData(time);
        var mid = half ? h * 0.28 : h * 0.5;
        var amp = (half ? h * 0.2 : h * 0.36);
        ctx2d.beginPath();
        for (var i = 0; i < bins; i++) {
          var y = mid + ((time[i] / 128) - 1) * amp;
          if (i === 0) ctx2d.moveTo(0, y);
          else ctx2d.lineTo((i / bins) * w, y);
        }
        ctx2d.strokeStyle = isLight ? 'rgba(34,160,80,0.85)' : 'rgba(100,220,140,0.85)';
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
      }

      if (showFreq) {
        var freq = new Uint8Array(bins);
        analyser.getByteFrequencyData(freq);
        var base = half ? h * 0.95 : h * 0.9;
        var span = half ? h * 0.5 : h * 0.75;
        var bars = Math.min(bins, Math.max(24, Math.floor(w / 4)));
        var bw = w / bars;
        for (var j = 0; j < bars; j++) {
          var v = freq[Math.floor((j / bars) * bins)] / 255;
          var bh = v * span;
          ctx2d.fillStyle = isLight
            ? 'rgba(200,50,50,' + (0.25 + v * 0.55) + ')'
            : 'rgba(255,100,100,' + (0.25 + v * 0.55) + ')';
          ctx2d.fillRect(j * bw, base - bh, Math.max(bw - 1.5, 1), bh);
        }
      }
    }

    // Autocorrelation is far too costly to run every frame, and a note readout that
    // updates faster than this is unreadable anyway.
    var now = Date.now();
    if (now - lastDetect > 120) {
      lastDetect = now;
      updateNote();
    }

    requestAnimationFrame(draw);
  }

  // --- pitch -----------------------------------------------------------------
  //
  // Resampling, not a phase vocoder: playbackRate moves pitch and tempo together.
  // Browsers default to preserving pitch across a rate change, which would turn this
  // into a tempo control, so that has to be switched off on every element we make.

  function applyPitch() {
    var r = Math.pow(2, semitones / 12);
    el['aud-pitch-val'].textContent = (semitones > 0 ? '+' : '') + semitones + ' st';
    el['aud-pitch-rate'].textContent = r.toFixed(2) + '\u00d7 speed';
    if (bufSource) bufSource.playbackRate.value = r;
  }

  // The rebase has to happen while `semitones` still holds the old value, because
  // position() converts the elapsed stretch at whatever rate is current. Updating
  // the slider first and rebasing after re-times everything already played at the
  // new rate, which sends the clock racing ahead.
  function setSemitones(n) {
    if (audioCtx && playing) {
      offsetSec = position();
      startedAt = audioCtx.currentTime;
    }
    semitones = n;
    applyPitch();
  }

  el['aud-pitch'].addEventListener('input', function() {
    setSemitones(parseInt(el['aud-pitch'].value, 10) || 0);
  });

  el['aud-pitch-reset'].addEventListener('click', function() {
    el['aud-pitch'].value = '0';
    setSemitones(0);
  });

  // --- note detection --------------------------------------------------------
  //
  // Autocorrelation over the analyser's time-domain window, so it reports what is
  // actually coming out: after the filter, and after the pitch shift. Honest only on
  // roughly monophonic material, which the clarity gate below is there to enforce.

  var NOTE_MIN_HZ = 55;    // A1
  var NOTE_MAX_HZ = 2100;  // a little over C7
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  function detectPitch(buf, sr) {
    var n = buf.length;
    var energy = 0;
    for (var i = 0; i < n; i++) energy += buf[i] * buf[i];
    if (!energy || Math.sqrt(energy / n) < 0.01) return null;

    var minLag = Math.max(2, Math.floor(sr / NOTE_MAX_HZ));
    var maxLag = Math.min(n - 3, Math.floor(sr / NOTE_MIN_HZ));
    if (maxLag <= minLag + 1) return null;

    // Raw autocorrelation, deliberately not divided by the overlap count. The
    // shrinking overlap makes the envelope fall away as the lag grows, and that
    // decay is what keeps the true period ahead of its own multiples. Normalising
    // by overlap flattens them into a tie, and the peak pick then lands on a
    // subharmonic: an A4 comes back as a B1 seven periods down.
    var acf = new Float32Array(maxLag + 2);
    for (var lag = 0; lag <= maxLag + 1; lag++) {
      var sum = 0;
      for (var j = 0; j < n - lag; j++) sum += buf[j] * buf[j + lag];
      acf[lag] = sum;
    }

    // Walk past the initial descent, or the answer is always lag zero.
    var d = 0;
    while (d < maxLag && acf[d] > acf[d + 1]) d++;

    var from = Math.max(d, minLag);
    var best = -Infinity;
    var bestLag = -1;
    for (var k = from; k <= maxLag; k++) {
      if (acf[k] > best) { best = acf[k]; bestLag = k; }
    }
    if (bestLag < 1) return null;

    // How periodic the window really is. Noise and dense polyphony fall well short.
    if (best / acf[0] < 0.4) return null;

    // Parabolic interpolation puts the peak between samples.
    var lagF = bestLag;
    var y1 = acf[bestLag - 1], y2 = acf[bestLag], y3 = acf[bestLag + 1];
    var denom = y1 + y3 - 2 * y2;
    if (denom) lagF = bestLag - (y3 - y1) / (2 * denom);

    var hz = sr / lagF;
    if (hz < NOTE_MIN_HZ || hz > NOTE_MAX_HZ) return null;
    return hz;
  }

  function noteFor(hz) {
    var midi = 69 + 12 * (Math.log(hz / 440) / Math.LN2);
    var nearest = Math.round(midi);
    return {
      name: NOTE_NAMES[((nearest % 12) + 12) % 12] + (Math.floor(nearest / 12) - 1),
      cents: Math.round((midi - nearest) * 100)
    };
  }

  function clearNote() {
    el['aud-note-name'].textContent = '\u2014';
    el['aud-note-hz'].textContent = 'no clear pitch';
    el['aud-note-cents'].textContent = '';
  }

  function updateNote() {
    if (!analyser || !playing) { clearNote(); return; }
    if (!detectBuf || detectBuf.length !== analyser.fftSize) {
      detectBuf = new Float32Array(analyser.fftSize);
    }
    analyser.getFloatTimeDomainData(detectBuf);

    var hz = detectPitch(detectBuf, audioCtx.sampleRate);
    if (!hz) { clearNote(); return; }

    var note = noteFor(hz);
    el['aud-note-name'].textContent = note.name;
    el['aud-note-hz'].textContent = hz.toFixed(1) + ' Hz';
    el['aud-note-cents'].textContent = (note.cents > 0 ? '+' : '') + note.cents + '\u00a2';
  }

  // --- transport -------------------------------------------------------------

  el['aud-play'].addEventListener('click', function() {
    if (!audioBuffer) return;
    ensureCtx();
    if (playing) {
      pausePlayback();
    } else {
      startAt(offsetSec >= audioBuffer.duration - 0.02 ? 0 : offsetSec);
    }
  });

  el['aud-stop'].addEventListener('click', function() {
    stopSource();
    offsetSec = 0;
    setPlaying(false);
    el['aud-seek'].value = 0;
    el['aud-current'].textContent = '0:00';
  });

  el['aud-seek'].addEventListener('input', function() {
    if (!audioBuffer) return;
    var to = parseFloat(el['aud-seek'].value) || 0;
    el['aud-current'].textContent = formatTime(to);
    if (playing) startAt(to);
    else offsetSec = to;
  });

  el['aud-volume'].addEventListener('input', function() {
    var v = parseFloat(el['aud-volume'].value);
    if (gainNode) gainNode.gain.value = v;
    el['aud-vol-val'].textContent = Math.round(v * 100) + '%';
  });

  el['aud-change'].addEventListener('click', function() { el['aud-file'].click(); });

  // --- filter ----------------------------------------------------------------

  function setFilter(type) {
    var chips = el['aud-filters'].querySelectorAll('.aud-chip');
    filterType = (filterType === type) ? null : type;
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('is-on', chips[i].getAttribute('data-filter') === filterType);
    }
    el['aud-params'].classList.toggle('hidden', !filterType);
    if (filterType && FILTER_DEFAULT_Q[filterType] !== undefined) {
      el['aud-filter-q'].value = FILTER_DEFAULT_Q[filterType];
      el['aud-filter-q-val'].textContent = FILTER_DEFAULT_Q[filterType].toFixed(1);
    }
    rebuildChain();
  }

  (function wireFilterChips() {
    var chips = el['aud-filters'].querySelectorAll('.aud-chip');
    for (var i = 0; i < chips.length; i++) {
      (function(chip) {
        chip.addEventListener('click', function() { setFilter(chip.getAttribute('data-filter')); });
      })(chips[i]);
    }
  })();

  el['aud-filter-freq'].addEventListener('input', function() {
    var hz = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
    el['aud-filter-freq-val'].textContent = formatFilterFreq(hz);
    if (filterNode) filterNode.frequency.value = hz;
  });

  el['aud-filter-q'].addEventListener('input', function() {
    var q = parseFloat(el['aud-filter-q'].value);
    el['aud-filter-q-val'].textContent = q.toFixed(1);
    if (filterNode) filterNode.Q.value = q;
  });

  el['aud-view-wave'].addEventListener('click', function() {
    showWave = !showWave;
    el['aud-view-wave'].classList.toggle('is-on', showWave);
  });

  el['aud-view-freq'].addEventListener('click', function() {
    showFreq = !showFreq;
    el['aud-view-freq'].classList.toggle('is-on', showFreq);
  });

  // --- picking a track -------------------------------------------------------

  function takeFile(file) {
    if (!file) return;
    pendingFile = file;
    audioRef = null;
    resetShare();
    loadFile(file);
  }

  el['aud-file'].addEventListener('change', function(e) { takeFile(e.target.files[0]); });

  el['aud-demo'].addEventListener('click', function() {
    pendingFile = null;
    audioRef = 'demo';
    resetShare();
    loadUrl(DEMO_SRC, 'symphony.mp3', 'demo');
  });

  // Keyboard parity for the file label, which is not a real button.
  document.querySelector('label[for="aud-file"]').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el['aud-file'].click(); }
  });

  ['dragenter', 'dragover'].forEach(function(ev) {
    el['aud-drop'].addEventListener(ev, function(e) {
      e.preventDefault();
      el['aud-drop'].classList.add('is-over');
    });
  });
  ['dragleave', 'drop'].forEach(function(ev) {
    el['aud-drop'].addEventListener(ev, function(e) {
      e.preventDefault();
      el['aud-drop'].classList.remove('is-over');
    });
  });
  el['aud-drop'].addEventListener('drop', function(e) {
    if (e.dataTransfer && e.dataTransfer.files) takeFile(e.dataTransfer.files[0]);
  });

  // --- share -----------------------------------------------------------------

  function encodeState() {
    var parts = ['v=2'];
    function bit(b) { return b ? '1' : '0'; }
    parts.push('flt=' + [
      filterType ? FILTER_CODES[filterType] : 'off',
      el['aud-filter-freq'].value,
      el['aud-filter-q'].value
    ].join(','));
    parts.push('viz=' + [bit(showWave), bit(showFreq)].join(','));
    parts.push('vol=' + el['aud-volume'].value);
    if (semitones) parts.push('p=' + semitones);
    if (audioRef) {
      parts.push('a=' + audioRef);
      if (audioName) parts.push('n=' + encodeURIComponent(audioName));
    }
    return parts.join('&');
  }

  function decodeState(hash) {
    var out = {};
    hash.replace(/^#/, '').split('&').forEach(function(kv) {
      var eq = kv.indexOf('=');
      if (eq < 1) return;
      try { out[kv.slice(0, eq)] = decodeURIComponent(kv.slice(eq + 1)); }
      catch (err) { out[kv.slice(0, eq)] = kv.slice(eq + 1); }
    });
    return out;
  }

  function setSlider(node, value) {
    if (value === undefined || value === '' || isNaN(parseFloat(value))) return;
    node.value = value;
    node.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function applyState(s) {
    if (s.v !== '2') return;

    var flt = (s.flt || '').split(',');
    if (flt.length >= 3) {
      var want = flt[0] === 'off' ? null : (FILTER_TYPES[flt[0]] || null);
      if (want) setFilter(want);
      // After the type: the notch presets write their own Q on the way in.
      setSlider(el['aud-filter-freq'], flt[1]);
      setSlider(el['aud-filter-q'], flt[2]);
    }

    var viz = (s.viz || '').split(',');
    if (viz.length >= 2) {
      if ((viz[0] === '1') !== showWave) el['aud-view-wave'].click();
      if ((viz[1] === '1') !== showFreq) el['aud-view-freq'].click();
    }

    if (s.vol !== undefined) setSlider(el['aud-volume'], s.vol);

    if (s.p !== undefined) {
      var st = parseInt(s.p, 10);
      if (!isNaN(st) && st >= -12 && st <= 12) {
        el['aud-pitch'].value = st;
        setSemitones(st);
      }
    }

    if (s.a) restoreTrack(s.a, s.n);
  }

  function restoreTrack(ref, name) {
    var src;
    if (ref === 'demo') {
      src = DEMO_SRC;
      name = name || 'symphony.mp3';
    } else if (ref.indexOf('clip:') === 0 && CLIP_ID_RE.test(ref.slice(5))) {
      src = CLIP_API + '/clip/' + ref.slice(5);
      name = name || 'shared clip';
    } else {
      return;
    }

    audioRef = ref;
    el['aud-shared-note'].classList.remove('hidden');
    el['aud-shared-detail'].textContent = 'Press play to hear "' + name + '" with their settings.';

    // Fetched and decoded straight away. Decoding needs an AudioContext but not a
    // resumed one, so nothing here depends on a gesture; only starting playback
    // does, and the play button supplies that.
    loadUrl(src, name, ref === 'demo' ? 'demo' : 'clip');
  }

  function uploadClip(file) {
    return fetch(CLIP_API + '/clip', {
      method: 'POST',
      headers: {
        'Content-Type': file.type || 'application/octet-stream',
        'X-Clip-Name': encodeURIComponent(file.name)
      },
      body: file
    }).then(function(resp) {
      return resp.json().catch(function() { return {}; }).then(function(data) {
        if (!resp.ok) throw new Error(data.error || 'Upload failed.');
        return data;
      });
    });
  }

  function resetShare() {
    el['aud-share-out'].classList.add('hidden');
    el['aud-share-status'].textContent = '';
  }

  function showLink() {
    var hash = encodeState();
    el['aud-share-link'].value = location.origin + location.pathname + '#' + hash;
    el['aud-share-out'].classList.remove('hidden');
    el['aud-share-link'].focus();
    el['aud-share-link'].select();
    history.replaceState(null, '', '#' + hash);
  }

  el['aud-share-btn'].addEventListener('click', function() {
    if (!pendingFile) {
      showLink();
      el['aud-share-status'].textContent = audioRef === 'demo'
        ? 'Anyone who opens this hears the demo with your settings.'
        : 'Link copied to the box below.';
      return;
    }
    el['aud-share-btn'].disabled = true;
    el['aud-share-status'].textContent = 'Uploading your track...';
    uploadClip(pendingFile).then(function(data) {
      audioRef = 'clip:' + data.id;
      audioName = data.name || audioName;
      pendingFile = null;
      showLink();
      el['aud-share-status'].textContent = 'Ready. This link works for ' + data.expiresInDays + ' days.';
    }).catch(function(err) {
      el['aud-share-status'].textContent = err.message || 'Upload failed.';
    }).then(function() {
      el['aud-share-btn'].disabled = false;
    });
  });

  el['aud-share-copy'].addEventListener('click', function() {
    el['aud-share-link'].select();
    function ok() { el['aud-share-status'].textContent = 'Copied.'; }
    function fallback() { try { document.execCommand('copy'); ok(); } catch (e) {} }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el['aud-share-link'].value).then(ok, fallback);
    } else {
      fallback();
    }
  });

  // --- boot ------------------------------------------------------------------

  el['aud-vol-val'].textContent = Math.round(parseFloat(el['aud-volume'].value) * 100) + '%';
  el['aud-filter-freq-val'].textContent =
    formatFilterFreq(filterSliderToFreq(parseFloat(el['aud-filter-freq'].value)));

  if (location.hash.length > 1) {
    // A hand-edited hash should never take the page down with it.
    try { applyState(decodeState(location.hash)); }
    catch (err) { if (window.console) console.warn('Could not read the shared state:', err); }
  }

  sizeCanvas();
  draw();
})();
</script>
