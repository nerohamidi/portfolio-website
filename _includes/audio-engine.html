  // into them and nothing about the sound changes: no event is dispatched from
  // here, so no handler mistakes a redraw for someone moving a slider.

  function syncRackUi() {
    var r = rack();

    el['aud-filter-freq'].value = r.freqPos;
    el['aud-filter-q'].value = r.qPos;
    var chips = el['aud-filters'].querySelectorAll('.aud-chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('is-on', chips[i].getAttribute('data-filter') === r.filterType);
    }
    el['aud-params'].classList.toggle('hidden', !r.filterType);
    syncFilterLabels();

    el['aud-echo-on'].classList.toggle('is-on', r.echoOn);
    el['aud-echo-on'].setAttribute('aria-pressed', r.echoOn ? 'true' : 'false');
    el['aud-echo-params'].classList.toggle('hidden', !r.echoOn);
    el['aud-echo-time'].value = r.echoMs;
    el['aud-echo-fb'].value = r.echoFb;
    el['aud-echo-mix'].value = r.echoMix;
    el['aud-echo-time-val'].textContent = Math.round(r.echoMs) + ' ms';
    el['aud-echo-fb-val'].textContent = r.echoFb.toFixed(2);
    el['aud-echo-mix-val'].textContent = Math.round(r.echoMix * 100) + '%';

    el['aud-rev-on'].classList.toggle('is-on', r.revOn);
    el['aud-rev-on'].setAttribute('aria-pressed', r.revOn ? 'true' : 'false');
    el['aud-rev-params'].classList.toggle('hidden', !r.revOn);
    el['aud-rev-decay'].value = r.revSec;
    el['aud-rev-pre'].value = r.revPreMs;
    el['aud-rev-mix'].value = r.revMix;
    el['aud-rev-decay-val'].textContent = r.revSec.toFixed(1) + ' s';
    el['aud-rev-pre-val'].textContent = Math.round(r.revPreMs) + ' ms';
    el['aud-rev-mix-val'].textContent = Math.round(r.revMix * 100) + '%';

    renderTargets();
    renderChain();
    renderMath();
    syncSimple();
  }

  function setTarget(t) {
    // A stem cannot be edited while the track is whole, so asking for one turns
    // the split on rather than refusing.
    if (t >= 0 && !split.on) setSplit(true);
    target = t;
    syncRackUi();
    renderStems();
  }

  // Rebuilt rather than patched: it is five buttons, and which five depends on
  // whether the track is split.
  function renderTargets() {
    var host = el['aud-target-chips'];
    if (!host) return;
    el['aud-target'].classList.toggle('hidden', !split.on);
    host.textContent = '';

    var picks = [{ t: -1, name: 'Master' }];
    stems.forEach(function(st, i) { picks.push({ t: i, name: st.name }); });

    picks.forEach(function(pick) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'aud-chip aud-chip-sm' + (pick.t === target ? ' is-on' : '');
      b.textContent = pick.name;
      b.setAttribute('aria-pressed', pick.t === target ? 'true' : 'false');
      b.addEventListener('click', function() { setTarget(pick.t); });
      host.appendChild(b);
    });
  }

  // --- the stem mixer --------------------------------------------------------
  //
  // Four rows, built once and then only updated: a name, a level bar, mute and
  // solo, a fader, and the button that points the effects panel at that stem.

  function setSplit(on) {
    split.on = !!on;
    el['aud-split-on'].classList.toggle('is-on', split.on);
    el['aud-split-on'].setAttribute('aria-pressed', split.on ? 'true' : 'false');
    // Nothing to point at any more, so the panel goes back to the master rather
    // than editing a stem the mix no longer contains.
    if (!split.on && target >= 0) target = -1;
    syncSplitUi();
    syncRackUi();
    rebuildChain();
    // Source mode plays a second buffer, and a running source cannot be given
    // one, so the transport is restarted where it stands.
    if (playing && split.mode === 'sources' && sepReady()) startPlayback(position());
  }

  function stemRow(st, i) {
    var li = document.createElement('li');
    li.className = 'aud-stem';

    var head = document.createElement('div');
    head.className = 'aud-stem-head';

    var name = document.createElement('span');
    name.className = 'aud-stem-name';
    var what = document.createElement('span');
    what.className = 'aud-stem-what';
    var meter = document.createElement('span');
    meter.className = 'aud-stem-meter';
    var fill = document.createElement('i');
    meter.appendChild(fill);

    head.appendChild(name);
    head.appendChild(what);
    head.appendChild(meter);

    var tools = document.createElement('div');
    tools.className = 'aud-stem-tools';

    var mute = document.createElement('button');
    mute.type = 'button';
    mute.className = 'aud-stem-btn';
    mute.textContent = 'M';
    mute.setAttribute('aria-label', 'Mute ' + st.name);
    mute.addEventListener('click', function() {
      st.muted = !st.muted;
      applyStemGains();
      renderStems();
    });

    var solo = document.createElement('button');
    solo.type = 'button';
    solo.className = 'aud-stem-btn';
    solo.textContent = 'S';
    solo.setAttribute('aria-label', 'Solo ' + st.name);
    solo.addEventListener('click', function() {
      st.soloed = !st.soloed;
      applyStemGains();
      renderStems();
    });

    var fader = document.createElement('input');
    fader.type = 'range';
    fader.className = 'aud-stem-gain';
    fader.min = STEM_DB_MIN;
    fader.max = STEM_DB_MAX;
    fader.step = 0.5;
    fader.value = st.db;
    fader.setAttribute('aria-label', st.name + ' level');
    fader.addEventListener('input', function() {
      st.db = parseFloat(fader.value);
      applyStemGains();
      renderStems();
    });

    var db = document.createElement('span');
    db.className = 'aud-stem-db';

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'aud-stem-btn aud-stem-edit';
    edit.textContent = 'Edit';
    edit.setAttribute('aria-label', 'Edit the ' + st.name + ' stem\u2019s effects');
    edit.addEventListener('click', function() { setTarget(i); });

    tools.appendChild(mute);
    tools.appendChild(solo);
    tools.appendChild(fader);
    tools.appendChild(db);
    tools.appendChild(edit);

    li.appendChild(head);
    li.appendChild(tools);
    st.row = { li: li, fill: fill, mute: mute, solo: solo, fader: fader, db: db,
               edit: edit, name: name, what: what };
    return li;
  }

  function buildStems() {
    var list = el['aud-stem-list'];
    if (!list) return;
    list.textContent = '';
    stems.forEach(function(st, i) { list.appendChild(stemRow(st, i)); });
  }

  // What a rack is doing, in as few characters as a row has for it.
  function rackSummary(r) {
    var bits = [];
    if (r.filterType) bits.push(FILTER_LABELS[r.filterType]);
    if (r.echoOn) bits.push('echo');
    if (r.revOn) bits.push('reverb');
    return bits.join(' · ');
  }

  // Everything on a row that only changes when something is pressed. The bars
  // are not in here: they move fifteen times a second and the rest of this does
  // not, so paintMeters is the only thing the draw loop calls.
  function renderStems() {
    stems.forEach(function(st, i) {
      var row = st.row;
      if (!row) return;
      var fx = rackSummary(st.rack);
      row.name.textContent = st.name;
      row.what.textContent = st.what;
      row.mute.setAttribute('aria-label', 'Mute ' + st.name);
      row.solo.setAttribute('aria-label', 'Solo ' + st.name);
      row.fader.setAttribute('aria-label', st.name + ' level');
      row.edit.setAttribute('aria-label', 'Edit the ' + st.name + ' stem\u2019s effects');
      // A source-mode strip with nothing behind it yet is a strip that cannot do
      // anything, and should not look as if it can.
      row.li.classList.toggle('is-idle', split.mode === 'sources' && !sepReady());
      row.li.classList.toggle('is-target', split.on && target === i);
      row.li.classList.toggle('is-silent', stemGainValue(st) === 0);
      row.li.classList.toggle('has-fx', Boolean(fx));
      row.mute.classList.toggle('is-on', st.muted);
      row.mute.setAttribute('aria-pressed', st.muted ? 'true' : 'false');
      row.solo.classList.toggle('is-on', st.soloed);
      row.solo.setAttribute('aria-pressed', st.soloed ? 'true' : 'false');
      row.fader.value = st.db;
      // The bottom of the travel reads off rather than as −40 dB, which is what
      // it is doing.
      row.db.textContent = st.db <= STEM_DB_MIN ? 'off' : signed(st.db, 1) + ' dB';
      row.edit.classList.toggle('is-on', split.on && target === i);
      row.edit.title = fx || 'No effects on this stem yet';
    });
    paintMeters();
  }

  function paintMeters() {
    stems.forEach(function(st) {
      if (st.row) st.row.fill.style.width = Math.round(st.level * 100) + '%';
    });
  }

  // A peak meter, read from the time domain because that is what a level is.
  // It rises at once and falls slowly, or there is nothing on it to read.
  function readMeters() {
    stems.forEach(function(st) {
      if (!st.meter || !st.meterBuf) { st.level = 0; return; }
      st.meter.getByteTimeDomainData(st.meterBuf);
      var peak = 0;
      for (var i = 0; i < st.meterBuf.length; i++) {
        var d = Math.abs(st.meterBuf[i] - 128);
        if (d > peak) peak = d;
      }
      var amp = peak / 128;
      // On a decibel scale: a linear one spends nine tenths of the bar on the
      // top 20 dB and shows a quiet stem as nothing at all.
      var db = amp > 0 ? 20 * Math.log(amp) / Math.LN10 : -Infinity;
      var v = db <= -METER_FLOOR_DB ? 0 : Math.min(1, 1 + db / METER_FLOOR_DB);
      st.level = v > st.level ? v : st.level * 0.82 + v * 0.18;
    });
    paintMeters();
  }

  el['aud-split-on'].addEventListener('click', function() { setSplit(!split.on); });

  // The crossovers cannot cross, and the one that is not being dragged is the
  // one that gives way.
  function splitSlider(id, which) {
    el[id].addEventListener('input', function() {
      var v = parseFloat(el[id].value);
      if (which === 1) {
        split.f1Pos = Math.min(v, 1000 - SPLIT_MIN_GAP);
        split.f2Pos = Math.max(split.f2Pos, split.f1Pos + SPLIT_MIN_GAP);
      } else {
        split.f2Pos = Math.max(v, SPLIT_MIN_GAP);
        split.f1Pos = Math.min(split.f1Pos, split.f2Pos - SPLIT_MIN_GAP);
      }
      syncSplitLabels();
      applySplitFreqs();
      renderMath();
    });
  }
  splitSlider('aud-split-f1', 1);
  splitSlider('aud-split-f2', 2);

  function syncSplitLabels() {
    el['aud-split-f1'].value = split.f1Pos;
    el['aud-split-f2'].value = split.f2Pos;
    el['aud-split-f1-val'].textContent = formatFilterFreq(splitF1());
    el['aud-split-f2-val'].textContent = formatFilterFreq(splitF2());
  }

  // --- running the separation ------------------------------------------------
  //
  // The analysis is seconds of arithmetic on a full-length track, so it goes to
  // a worker: a page that stops answering for five seconds is a page that looks
  // broken, whatever it is busy with. The worker's source is sitting in the
  // document as text; it is wrapped in a Blob here so that the whole app stays
  // one file with nothing extra to fetch.

  function sepBoot() {
    if (sepWorker) return sepWorker;
    var tag = document.getElementById('aud-sep-worker');
    if (!tag || !window.Worker || !window.Blob || !window.URL) return null;
    try {
      var url = URL.createObjectURL(new Blob([tag.textContent], { type: 'text/javascript' }));
      sepWorker = new Worker(url);
      // The Blob is only needed until the worker has read it.
      URL.revokeObjectURL(url);
      sepWorker.onmessage = sepMessage;
      sepWorker.onerror = function() { sepFail('The separator stopped unexpectedly.'); };
    } catch (e) {
      sepWorker = null;
    }
    return sepWorker;
  }

  function sepStatus(text) {
    el['aud-sep-status'].textContent = text || '';
  }

  function sepProgress(frac) {
    el['aud-sep-bar'].classList.toggle('hidden', frac === null);
    if (frac !== null) el['aud-sep-fill'].style.width = Math.round(frac * 100) + '%';
  }

  function sepFail(why) {
    sepBusy = false;
    sepProgress(null);
    el['aud-sep-go'].disabled = false;
    el['aud-sep-go'].textContent = 'Separate';
    sepStatus(why);
  }

  // Decibels of pan either side of the middle, which is what the label says and
  // now also what the sweep measures.
  function sepWidth() { return parseFloat(el['aud-sep-width'].value); }
  function sepVoice() { return parseFloat(el['aud-sep-voice'].value); }

  function sepStart() {
    if (sepBusy || !audioBuffer) return;
    var worker = sepBoot();
    if (!worker) { sepFail('This browser cannot run the separator.'); return; }
    if (audioBuffer.duration > SEP_MAX_SEC) {
      sepFail('Too long to separate \u2014 the stems would not fit in memory. ' +
        Math.round(SEP_MAX_SEC / 60) + ' minutes is the ceiling.');
      return;
    }

    // Copies, because the arrays are handed to the worker and a transfer leaves
    // the originals detached -- and the originals here are the track itself.
    var left = new Float32Array(audioBuffer.getChannelData(0));
    var right = audioBuffer.numberOfChannels > 1
      ? new Float32Array(audioBuffer.getChannelData(1))
      : new Float32Array(left);

    sepBusy = true;
    sepFor = trackKey();
    el['aud-sep-go'].disabled = true;
    el['aud-sep-go'].textContent = 'Separating\u2026';
    sepProgress(0);
    sepStatus('Starting\u2026');

    worker.postMessage({
      type: 'separate',
      left: left.buffer, right: right.buffer,
      sampleRate: audioBuffer.sampleRate,
      bassHz: filterSliderToFreq(split.f1Pos),
      widthDb: sepWidth(), voice: sepVoice()
    }, [left.buffer, right.buffer]);
  }

  function sepMessage(ev) {
    var msg = ev.data || {};
    if (msg.type === 'progress') {
      sepProgress(Math.max(0, Math.min(1, msg.frac || 0)));
      sepStatus(msg.stage + (msg.loop ? ' \u2014 a ' + msg.loop.toFixed(1) + ' s figure' : '') + '\u2026');
      return;
    }
    if (msg.type === 'error') { sepFail(msg.message || 'The separation failed.'); return; }
    if (msg.type !== 'done') return;
    sepAdopt(msg);
  }

  function sepAdopt(msg) {
    sepBusy = false;
    sepProgress(null);
    el['aud-sep-go'].disabled = false;
    el['aud-sep-go'].textContent = 'Separate again';

    try {
      var n = msg.length;
      var buf = audioCtx.createBuffer(4, n, msg.sampleRate);
      // One at a time, dropping each as it lands: four channels of a long track
      // is a lot to be holding twice over.
      var parts = [msg.vox, msg.drL, msg.drR, msg.bass];
      for (var c = 0; c < 4; c++) {
        buf.copyToChannel(new Float32Array(parts[c]), c);
        parts[c] = null;
      }
      sepBuffer = buf;
    } catch (e) {
      sepBuffer = null;
      sepFail('There was not enough memory for the stems.');
      return;
    }

    sepStatus('Four stems, and together they are the track again.');
    nameStems();
    syncSplitUi();
    txSyncControls();
    rebuildChain();
    // The stems have to join a track that may already be playing, and a source
    // cannot be started late and still be in step, so the transport is restarted
    // where it stands.
    if (playing) startPlayback(position());
  }

  el['aud-sep-go'].addEventListener('click', sepStart);

  wireParam('aud-sep-width', function() {
    el['aud-sep-width-val'].textContent = '\u00b1' + sepWidth().toFixed(1) + ' dB';
  });
  wireParam('aud-sep-voice', function() {
    el['aud-sep-voice-val'].textContent = sepVoice().toFixed(2) + '\u00d7';
  });

  // Both knobs are read when the analysis runs, not while it plays, so moving
  // one after the fact is an offer to run it again rather than a change.
  function sepStale() {
    if (sepReady() && !sepBusy) sepStatus('Moved \u2014 press Separate again to hear it.');
  }
  el['aud-sep-width'].addEventListener('change', sepStale);
  el['aud-sep-voice'].addEventListener('change', sepStale);

  // What the line under the button says when nothing is running. Worked out from
  // the state rather than announced once, because a link that asks for source
  // mode says so before the track it names has finished loading -- and loading a
  // track drops the stems, which used to wipe the message with it.
  function sepIdleText() {
    if (split.mode === 'sources' && sepAsked && !sepReady()) {
      return 'They split this into sources \u2014 press Separate to hear it their way.';
    }
    if (audioBuffer && audioBuffer.duration > SEP_WARN_SEC) {
      return 'A long track \u2014 this will take a while and hold a lot of memory.';
    }
    return 'Takes a few seconds, and holds the stems in memory while they play.';
  }

  // A new track invalidates the stems: they were made from the old one.
  function sepDrop() {
    sepBuffer = null;
    sepFor = '';
    sepProgress(null);
    el['aud-sep-go'].disabled = false;
    el['aud-sep-go'].textContent = 'Separate';
    sepStatus(sepIdleText());
  }

  // --- which cut is in force ---------------------------------------------------

  function setSplitMode(mode) {
    split.mode = mode === 'sources' ? 'sources' : 'bands';
    nameStems();
    syncSplitUi();
    rebuildChain();
    // Source mode plays from a second buffer, and whether that buffer is in the
    // graph is decided when a source is made rather than while it runs.
    if (playing) startPlayback(position());
  }

  function syncSplitUi() {
    var sources = split.mode === 'sources';
    el['aud-by-bands'].classList.toggle('is-on', !sources);
    el['aud-by-bands'].setAttribute('aria-pressed', sources ? 'false' : 'true');
    el['aud-by-sources'].classList.toggle('is-on', sources);
    el['aud-by-sources'].setAttribute('aria-pressed', sources ? 'true' : 'false');

    el['aud-split-how'].classList.toggle('hidden', !split.on);
    el['aud-split-params'].classList.toggle('hidden', !split.on || sources);
    el['aud-sep'].classList.toggle('hidden', !split.on || !sources);
    el['aud-stem-list'].classList.toggle('hidden', !split.on);
    el['aud-stem-foot'].classList.toggle('hidden', !split.on);

    el['aud-split-note'].innerHTML = sources
      ? 'Four stems, told apart by what a sound <em>is</em>. Nothing learned, nothing guessed \u2014 three measurements, and the four sum back to the recording exactly.'
      : 'Four stems, told apart by where a sound <em>sits</em>: two crossover frequencies, then the middle split from the sides. All four up is the track again, level for level.';

    if (sources && !sepReady() && !sepBusy) sepStatus(sepIdleText());
    renderTargets();
    renderStems();
    renderMath();
  }

  el['aud-by-bands'].addEventListener('click', function() { setSplitMode('bands'); });
  el['aud-by-sources'].addEventListener('click', function() { setSplitMode('sources'); });

  // --- simple mode -----------------------------------------------------------
  //
  // The same app with almost all of it put away: the transport, one switch each
  // for echo and reverb, and five pitches. Everything it touches is the master
  // rack, so a link made here and a link made in Pro mode are the same link.

  function setMode(simple, remember) {
    simpleMode = !!simple;
    document.body.classList.toggle('aud-simple', simpleMode);
    el['aud-mode-simple'].classList.toggle('is-on', simpleMode);
    el['aud-mode-pro'].classList.toggle('is-on', !simpleMode);
    el['aud-mode-simple'].setAttribute('aria-pressed', simpleMode ? 'true' : 'false');
    el['aud-mode-pro'].setAttribute('aria-pressed', simpleMode ? 'false' : 'true');
    if (remember) {
      try { window.localStorage.setItem(MODE_STORE, simpleMode ? 's' : 'p'); } catch (e) {}
    }
    // The canvas is a different size in each mode and is sized from its box, so
    // it has to be measured again after the class has landed.
    sizeCanvas();
    syncSimple();
  }

  // Simple mode's switches are a second view onto the master rack, so they
  // follow it however it was changed -- a Pro chip, or a shared link.
  function syncSimple() {
    if (!el['aud-simple-echo']) return;
    el['aud-simple-echo'].classList.toggle('is-on', master.echoOn);
    el['aud-simple-echo'].setAttribute('aria-pressed', master.echoOn ? 'true' : 'false');
    el['aud-simple-rev'].classList.toggle('is-on', master.revOn);
    el['aud-simple-rev'].setAttribute('aria-pressed', master.revOn ? 'true' : 'false');

    var chips = el['aud-simple-pitch'].querySelectorAll('.aud-simple-st');
    for (var i = 0; i < chips.length; i++) {
      var st = parseInt(chips[i].getAttribute('data-st'), 10);
      chips[i].classList.toggle('is-on', st === semitones);
      chips[i].setAttribute('aria-pressed', st === semitones ? 'true' : 'false');
    }
  }

  el['aud-mode-simple'].addEventListener('click', function() { setMode(true, true); });
  el['aud-mode-pro'].addEventListener('click', function() { setMode(false, true); });

  // Switching a stage on from here writes into the master rack whether or not
  // the Pro panel happens to be pointed at it.
  function toggleMasterStage(field) {
    master[field] = !master[field];
    if (target < 0) syncRackUi();
    else { syncSimple(); renderChain(); renderMath(); }
    rebuildChain();
  }

  el['aud-simple-echo'].addEventListener('click', function() { toggleMasterStage('echoOn'); });
  el['aud-simple-rev'].addEventListener('click', function() { toggleMasterStage('revOn'); });

  (function wireSimplePitch() {
    var chips = el['aud-simple-pitch'].querySelectorAll('.aud-simple-st');
    for (var i = 0; i < chips.length; i++) {
      (function(chip) {
        chip.addEventListener('click', function() {
          var st = parseInt(chip.getAttribute('data-st'), 10) || 0;
          el['aud-pitch'].value = st;
          setSemitones(st);
        });
      })(chips[i]);
    }
  })();

  // --- the chain strip -------------------------------------------------------
  //
  // Every stage is drawn whether or not it is switched on, so the order is
  // visible before anything is pressed and a stage that is off reads as a gap in
  // a chain rather than as an absence.

  function renderChain() {
    var row = el['aud-chain'];
    if (!row) return;
    var r = rack();
    // What is feeding this rack and what it feeds. A stem's rack sits between
    // the split and the mix; the master's sits between the mix and the speakers,
    // and reads as the track itself while there is nothing to mix.
    var head = target >= 0 ? stems[target].name : (split.on ? 'Mix' : 'Track');
    var tail = target >= 0 ? 'Mix' : 'Out';
    var stages = [
      { name: head, on: true, fixed: true },
      { name: r.filterType ? FILTER_LABELS[r.filterType] : 'Filter', on: Boolean(r.filterType) },
      { name: 'Echo', on: r.echoOn },
      { name: 'Reverb', on: r.revOn },
      { name: tail, on: true, fixed: true }
    ];

    row.textContent = '';
    stages.forEach(function(stage, i) {
      if (i) {
        var arrow = document.createElement('span');
        arrow.className = 'aud-chain-arrow';
        arrow.textContent = '→';
        row.appendChild(arrow);
      }
      var node = document.createElement('span');
      node.className = 'aud-chain-node' +
        (stage.on ? ' is-on' : '') + (stage.fixed ? ' is-fixed' : '');
      node.textContent = stage.name;
      row.appendChild(node);
    });
  }

  // --- the math --------------------------------------------------------------
  //
  // Off by default and never carried in a share link: it is a reading aid for
  // whoever opened the page, not part of the sound, and a recipient should get
  // what the sender built rather than how they were looking at it.
  //
  // It reads like the caption under the visualiser rather than like a paper. One
  // short line per idea, each arriving a token at a time, because a panel that
  // drops six paragraphs of prose on a phone is a panel nobody reads. Everything
  // is derived from the same slider values the graph is running on, so it cannot
  // drift from what is being heard. Where the browser is the authority on a
  // number rather than a formula, the browser is asked.

  function sampleRate() { return audioCtx ? audioCtx.sampleRate : 44100; }

  // Thin spaces between the thousands: these are counts to be read at a glance,
  // and a comma inside a number sitting next to a comma between two of them is
  // a number misread.
  function grouped(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function signed(v, digits) {
    return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(digits);
  }

  // The cookbook the Web Audio biquad is specified in terms of. Q is read as
  // decibels for the low and high pass and as a plain ratio everywhere else,
  // which is a quirk of the original WebKit implementation that the spec kept.
  function biquad(type, f0, q, fs) {
    var w0 = 2 * Math.PI * f0 / fs;
    var cw = Math.cos(w0);
    var sw = Math.sin(w0);
    var dB = (type === 'lowpass' || type === 'highpass');
    var qLin = dB ? Math.pow(10, q / 20) : q;
    var alpha = sw / (2 * qLin);
    var b0, b1, b2;
    var a0 = 1 + alpha, a1 = -2 * cw, a2 = 1 - alpha;

    if (type === 'lowpass') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; }
    else if (type === 'highpass') { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0; }
    else if (type === 'bandpass') { b0 = alpha; b1 = 0; b2 = -alpha; }
    else { b0 = 1; b1 = -2 * cw; b2 = 1; }

    return {
      w0: w0, alpha: alpha, qLin: qLin, qIsDb: dB,
      // Divided through by a0, which is the form the difference equation runs in.
      b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0
    };
  }

  // Ground truth, straight out of the node that is actually filtering the audio.
  function responseDb(r, hz) {
    var node = rackFilterNode(r);
    if (!node || !node.getFrequencyResponse) return null;
    try {
      var f = new Float32Array([hz]);
      var mag = new Float32Array(1);
      var phase = new Float32Array(1);
      node.getFrequencyResponse(f, mag, phase);
      if (!isFinite(mag[0]) || mag[0] <= 0) return null;
      return 20 * Math.log(mag[0]) / Math.LN10;
    } catch (e) { return null; }
  }

  // How many repeats of an echo are left above -60 dB. g^k = 10^-3 solves to
  // k = 3 / log10(1/g), and a feedback of zero means the one tap and nothing after.
  function echoRepeats(g) {
    if (g <= 0) return 1;
    if (g >= 1) return Infinity;
    return Math.ceil(3 / (Math.log(1 / g) / Math.LN10));
  }

  // The whole panel, as a flat list of short lines. A `tag` line is a stage
  // heading; everything else is one statement. Keys are stable across renders,
  // which is what lets a slider update the numbers in place rather than making
  // the panel flicker through its whole entrance again on every frame of a drag.
  function mathLines() {
    var fs = sampleRate();
    var r = rack();
    var lines = [];
    function add(key, text, tag) { lines.push({ key: key, text: text, tag: Boolean(tag) }); }

    // The split first, because it is what decides which signal the rack below it
    // is even looking at.
    if (split.on && split.mode === 'sources') {
      add('t-split', 'Split by source', true);
      if (!sepReady()) {
        add('sp-idle', 'nothing separated yet — press Separate');
      } else {
        add('sp-stft', 'X(t,f): ' + N_SEP + '-point window, hopped ' + (N_SEP / 2) + ', sine both ways');
        add('sp-hp', 'H = median<sub>t</sub>|X|, P = median<sub>f</sub>|X|, over 17');
        add('sp-hpm', 'm<sub>perc</sub> = P²/(H²+P²) &nbsp;→&nbsp; drums');
        add('sp-rep', 'W(f, t mod p) = median over repetitions of |X|');
        add('sp-repm', 'm<sub>rep</sub> = min(W,|X|)²/|X|², p from the beat spectrum');
        add('sp-az', 'd* = argmin<sub>d</sub> |L − dR|, pan = 20 log₁₀ d*');
        add('sp-azw', 'c = 1 where |pan| < ' + (sepWidth() / 3).toFixed(1) +
          ' dB, 0 beyond ' + sepWidth().toFixed(1) + ' dB');
        add('sp-vox', 'm<sub>vox</sub> = (1−m<sub>perc</sub>)(1−m<sub>bass</sub>)(1−m<sub>rep</sub>)&middot;c&middot;v(f)');
        add('sp-sum2', 'Σ m = 1 in every bin, and the masks are real');
        add('sp-exact', 'so all four up is the recording, sample for sample');
      }
    } else if (split.on) {
      add('t-split', 'Split by band', true);
      add('sp-lr', 'H<sub>LP</sub>(s) = 1/(s²+√2s+1)², H<sub>HP</sub>(s) = s⁴/(s²+√2s+1)²');
      add('sp-sum', 'H<sub>LP</sub> + H<sub>HP</sub> = (s²−√2s+1)/(s²+√2s+1), so |H| = 1');
      add('sp-f', 'f<sub>1</sub> = ' + grouped(splitF1()) + ' Hz, f<sub>2</sub> = ' +
        grouped(splitF2()) + ' Hz, 24 dB/oct');
      add('sp-ms', 'M = (L+R)/2, S = (L−R)/2');
      add('sp-back', 'M+S = L, M−S = R, to the last bit');
      add('sp-all', 'Σ stems = A(z)&middot;A(z)&middot;x[n], and |A| = 1');
      add('sp-flat', 'so all four up is the track, flat, its phase turned');
    }

    var on = [];
    if (r.filterType) on.push('H<sub>flt</sub>(z)');
    if (r.echoOn) on.push('H<sub>echo</sub>(z)');
    if (r.revOn) on.push('H<sub>rev</sub>(z)');

    // Which rack the algebra below belongs to, once there is more than one it
    // could be. Named rather than numbered, because that is how the panel above
    // asked for it.
    if (split.on) add('who', target >= 0 ? stems[target].name + ' stem' : 'Master rack', true);

    if (!on.length) {
      add('idle', 'y[n] = x[n]');
      add('fs', 'f<sub>s</sub> = ' + grouped(fs) + ' Hz');
      return lines;
    }

    // Stacking, stated once: every stage is linear and time invariant, so the
    // chain is one filter and the order it is wired in cannot matter.
    add('chain', 'H(z) = ' + on.join(' &middot; '));
    add('fs', 'f<sub>s</sub> = ' + grouped(fs) + ' Hz');

    if (r.filterType) {
      var type = r.filterType.replace('-wide', '').replace('-narrow', '');
      var f0 = filterSliderToFreq(r.freqPos);
      var q = rackQ(r);
      var c = biquad(type, f0, q, fs);
      var atCut = responseDb(r, f0);

      add('t-flt', FILTER_LABELS[r.filterType], true);
      add('flt-y', 'y[n] = b<sub>0</sub>x[n] + b<sub>1</sub>x[n−1] + b<sub>2</sub>x[n−2] − a<sub>1</sub>y[n−1] − a<sub>2</sub>y[n−2]');
      add('flt-w', 'ω<sub>0</sub> = 2πf<sub>0</sub>/f<sub>s</sub> = ' + c.w0.toFixed(5));
      add('flt-a', 'α = sin ω<sub>0</sub> / ' +
        (c.qIsDb ? '2&middot;10<sup>Q/20</sup>' : '2Q') + ' = ' + c.alpha.toFixed(5));
      add('flt-b', 'b = [ ' + [c.b0, c.b1, c.b2].map(function(v) { return signed(v, 5); }).join(', ') + ' ]');
      add('flt-ab', 'a = [ +1.00000, ' + [c.a1, c.a2].map(function(v) { return signed(v, 5); }).join(', ') + ' ]');
      if (atCut !== null) add('flt-h', '|H(f<sub>0</sub>)| = ' + signed(atCut, 1) + ' dB');
    }

    if (r.echoOn) {
      var tau = r.echoMs / 1000;
      var g = r.echoFb;
      var m = r.echoMix;
      var repeats = echoRepeats(g);

      add('t-echo', 'Echo', true);
      add('echo-w', 'w[n] = x[n−D] + g&middot;w[n−D]');
      add('echo-y', 'y[n] = (1−m)x[n] + m&middot;w[n]');
      add('echo-d', 'D = τf<sub>s</sub> = ' + grouped(tau * fs) + ' samples');
      add('echo-g', 'g = ' + g.toFixed(2) + ', m = ' + m.toFixed(2));
      add('echo-t', g <= 0
        ? 'one repeat, then nothing'
        : 'g<sup>k</sup> &lt; −60 dB after ' + repeats + ' repeats, ' + (repeats * tau).toFixed(1) + ' s');
      add('echo-c', 'comb teeth every 1/τ = ' + (1 / tau).toFixed(2) + ' Hz');
    }

    if (r.revOn) {
      var t = r.revSec;
      var pre = r.revPreMs / 1000;
      var rm = r.revMix;
      var n = t * fs;

      add('t-rev', 'Reverb', true);
      add('rev-h', 'h[k] = r[k]&middot;e<sup>−k&middot;ln1000/Tf<sub>s</sub></sup>');
      add('rev-y', 'y[n] = (1−m)x[n] + m&middot;Σ h[k]x[n−k−P]');
      add('rev-n', 'N = Tf<sub>s</sub> = ' + grouped(n) + ' taps');
      add('rev-p', 'P = ' + grouped(pre * fs) + ' samples, m = ' + rm.toFixed(2));
      add('rev-c', (n * fs / 1e9).toFixed(1) + ' billion mul–adds a second, so: FFT');
    }

    if (semitones) {
      var rr = Math.pow(2, semitones / 12);
      add('t-pitch', 'Pitch', true);
      add('pitch-r', 'r = 2<sup>n/12</sup> = ' + rr.toFixed(4));
      add('pitch-f', 'f → ' + rr.toFixed(4) + 'f, and the clock with it');
    }

    return lines;
  }

  // What is on screen, so the next render can tell a new line from a line whose
  // numbers moved.
  var mathShown = [];

  // Split on plain spaces only, and never inside a tag: the markup carries
  // subscripts, and half of a <sub> is not a token. \s is deliberately not used
  // here -- it matches the thin space that groups the thousands, which would cut
  // 14 112 into two tokens and reveal a number in halves.
  function mathTokens(html) {
    return html.split(/ +(?![^<]*>)/).filter(function(t) { return t; });
  }

  function mathLineEl(line, at) {
    var row = document.createElement('p');
    row.className = line.tag ? 'aud-math-line is-tag' : 'aud-math-line';

    mathTokens(line.text).forEach(function(tok, k) {
      var span = document.createElement('span');
      span.className = 'aud-math-w';
      span.innerHTML = (k ? ' ' : '') + tok;
      // Staggered the way the caption stages its words, by delaying the ink
      // rather than the element: every line is laid out at once, so nothing
      // reflows as the rest of it arrives.
      span.style.transitionDelay = Math.min(at * 55 + k * 24, 1400) + 'ms';
      row.appendChild(span);
    });
    return row;
  }

  // A slider moved but the shape of the panel did not, so only the tokens whose
  // text actually changed are rewritten, and they are lit briefly instead of
  // being faded in from nothing. Re-running the entrance on every input event
  // would make a drag strobe.
  function mathPatch(row, line) {
    var spans = row.querySelectorAll('.aud-math-w');
    var toks = mathTokens(line.text);
    if (spans.length !== toks.length) return false;

    for (var i = 0; i < toks.length; i++) {
      var want = (i ? ' ' : '') + toks[i];
      if (spans[i].innerHTML === want) continue;
      spans[i].innerHTML = want;
      (function(node) {
        node.classList.add('is-hot');
        setTimeout(function() { node.classList.remove('is-hot'); }, 320);
      })(spans[i]);
    }
    return true;
  }

  function renderMath() {
    var host = el['aud-math'];
    if (!host) return;

    host.classList.toggle('hidden', !mathOn);
    // Emptied rather than merely hidden, so a closed panel is not sitting on a
    // stale set of numbers that would flash before the next rebuild.
    if (!mathOn) { host.textContent = ''; mathShown = []; return; }

    var lines = mathLines();
    var rows = host.querySelectorAll('.aud-math-line');

    // Same lines in the same order: patch the numbers where they moved.
    var same = rows.length === lines.length && mathShown.length === lines.length;
    for (var i = 0; same && i < lines.length; i++) {
      if (mathShown[i].key !== lines[i].key) same = false;
    }
    if (same) {
      for (var j = 0; j < lines.length; j++) {
        if (!mathPatch(rows[j], lines[j])) { same = false; break; }
      }
      if (same) { mathShown = lines; return; }
    }

    host.textContent = '';
    lines.forEach(function(line, at) { host.appendChild(mathLineEl(line, at)); });
    mathShown = lines;

    // One frame later, so the browser has the un-inked state to transition from.
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(function() {
        var fresh = host.querySelectorAll('.aud-math-w');
        for (var k = 0; k < fresh.length; k++) fresh[k].classList.add('is-in');
      });
    } else {
      var fresh = host.querySelectorAll('.aud-math-w');
      for (var k = 0; k < fresh.length; k++) fresh[k].classList.add('is-in');
    }
  }

  el['aud-math-on'].addEventListener('change', function() {
    mathOn = el['aud-math-on'].checked;
    renderMath();
  });


  // --- the queue -------------------------------------------------------------
  //
  // One track used to be the whole app state. It is now one entry in a list, and
  // the list is what a link carries. An entry is only shareable once it has a
  // `ref`: local files get one when a share uploads them.

  function clipIdOf(entry) {
    return entry && entry.ref && entry.ref.indexOf('clip:') === 0 ? entry.ref.slice(5) : null;
  }

  // Uploaded tracks only. The demo is not a clip and has no id to delete.
  function uploadedIds() {
    var ids = [];
    queue.forEach(function(entry) {
      var id = clipIdOf(entry);
      if (id && ids.indexOf(id) < 0) ids.push(id);
    });
    return ids;
  }

  function srcOf(entry) {
    if (!entry) return null;
    if (entry.ref === 'demo') return DEMO_SRC;
    var id = clipIdOf(entry);
    return id ? CLIP_API + '/clip/' + id : null;
  }

  function newEntry(fields) {
    return {
      ref: fields.ref || null,
      name: fields.name || '',
      file: fields.file || null,
      // Whether deleting this clip will ask for a password. Learned from the
      // upload's own reply, or from the clip's headers on a restored playlist.
      locked: Boolean(fields.locked),
      tx: null
    };
  }

  function playIndex(i, autostart) {
    if (i < 0 || i >= queue.length) return;
    current = i;
    var entry = queue[i];
    renderQueue();
    if (entry.file) {
      loadFile(entry.file, autostart);
    } else {
      var src = srcOf(entry);
      if (!src) return;
      loadUrl(src, entry.name || 'Shared track', entry.ref === 'demo' ? 'demo' : 'clip', autostart);
    }
  }

  // The name a track is finally known by: from the file, from the clip's stored
  // metadata, or from the upload's reply. Addressed by entry rather than by index,
  // because the answer can arrive after the listener has moved on.
  function renameEntry(entry, name) {
    if (!entry || !name || entry.name === name) return;
    entry.name = name;
    if (entry === queue[current]) {
      audioName = name;
      if (audioBuffer) el['aud-name'].textContent = name;
    }
    renderQueue();
  }

  function addTracks(entries, playFirst) {
    if (!entries.length) return;
    var room = MAX_QUEUE - queue.length;
    if (room <= 0) {
      el['aud-share-status'].textContent = 'A playlist holds ' + MAX_QUEUE + ' tracks.';
      return;
    }
    var dropped = entries.length - room;
    var added = entries.slice(0, room);
    var at = queue.length;
    queue = queue.concat(added);
    resetShare();
    if (dropped > 0) {
      el['aud-share-status'].textContent = 'A playlist holds ' + MAX_QUEUE +
        ' tracks, so ' + dropped + ' did not fit.';
    }
    if (playFirst || current < 0) playIndex(at, playFirst && playing);
    else renderQueue();
  }

  function removeAt(i) {
    if (i < 0 || i >= queue.length) return;
    var wasCurrent = i === current;
    var wasPlaying = playing;
    queue.splice(i, 1);
    resetShare();

    if (!queue.length) {
      current = -1;
      resetToEmpty();
      return;
    }
    if (wasCurrent) {
      // Whatever slid into this slot, or the new last track if the end went.
      playIndex(Math.min(i, queue.length - 1), wasPlaying);
      return;
    }
    if (i < current) current -= 1;
    renderQueue();
  }

  function moveAt(i, delta) {
    var to = i + delta;
    if (i < 0 || i >= queue.length || to < 0 || to >= queue.length) return;
    var held = queue[i];
    queue[i] = queue[to];
    queue[to] = held;
    if (current === i) current = to;
    else if (current === to) current = i;
    resetShare();
    renderQueue();
  }

  function resetToEmpty() {
    stopSource();
    bgRelease();
    audioBuffer = null;
    offsetSec = 0;
    // Tearing the track down settles any debt the door left owing on it.
    pausedByHide = false;
    setPlaying(false);
    txReset();
    sepDrop();
    loadToken++;
    el['aud-drop'].classList.remove('hidden');
    ['aud-player', 'aud-shape', 'aud-share', 'aud-queue', 'aud-stems'].forEach(function(id) {
      el[id].classList.add('hidden');
    });
    el['aud-shared-note'].classList.add('hidden');
    renderQueue();
  }

  function tagFor(entry) {
    if (entry.ref === 'demo') return 'demo';
    if (clipIdOf(entry)) return 'shared';
    return 'on this device';
  }

  // Built with the DOM rather than a template string: a row carries a filename
  // the visitor chose, and that is not text to hand to innerHTML.
  function queueRow(entry, i) {
    var li = document.createElement('li');
    li.className = 'aud-q-item' + (i === current ? ' is-current' : '');

    var pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'aud-q-pick';
    pick.addEventListener('click', function() { playIndex(i, playing); });

    var n = document.createElement('span');
    n.className = 'aud-q-n';
    n.textContent = String(i + 1);
    var name = document.createElement('span');
    name.className = 'aud-q-name';
    name.textContent = entry.name || 'Untitled track';
    var tag = document.createElement('span');
    tag.className = 'aud-q-tag';
    tag.textContent = tagFor(entry);
    pick.appendChild(n);
    pick.appendChild(name);
    pick.appendChild(tag);

    var tools = document.createElement('span');
    tools.className = 'aud-q-tools';
    [
      { label: 'Move "' + (entry.name || 'track') + '" up', glyph: '↑', run: function() { moveAt(i, -1); }, off: i === 0 },
      { label: 'Move "' + (entry.name || 'track') + '" down', glyph: '↓', run: function() { moveAt(i, 1); }, off: i === queue.length - 1 },
      { label: 'Remove "' + (entry.name || 'track') + '"', glyph: '×', run: function() { removeAt(i); }, off: false }
    ].forEach(function(spec) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'aud-q-btn';
      b.textContent = spec.glyph;
      b.setAttribute('aria-label', spec.label);
      b.disabled = spec.off;
      b.addEventListener('click', spec.run);
      tools.appendChild(b);
    });

    li.appendChild(pick);
    li.appendChild(tools);
    return li;
  }

  function renderQueue() {
    var list = el['aud-q-list'];
    list.textContent = '';
    queue.forEach(function(entry, i) { list.appendChild(queueRow(entry, i)); });

    el['aud-q-count'].textContent = queue.length
      ? queue.length + (queue.length === 1 ? ' track' : ' tracks') + ' of ' + MAX_QUEUE
      : '';

    var many = queue.length > 1;
    el['aud-prev'].classList.toggle('hidden', !many);
    el['aud-next'].classList.toggle('hidden', !many);
    el['aud-prev'].disabled = current <= 0;
    el['aud-next'].disabled = current < 0 || current >= queue.length - 1;

    // Offered whenever the queue holds something that is actually in the bucket,
    // which includes a playlist someone else shared: the link is the permission,
    // so the recipient gets the same button the sharer has.
    syncDanger();
  }

  // A clip knows its own name, so a restored playlist can label every row before
  // any of them is played. One HEAD per track, and the Worker answers those from
  // metadata without reading the audio.
  function labelClips() {
    queue.forEach(function(entry, i) {
      var id = clipIdOf(entry);
      if (!id) return;
      // The same HEAD answers both questions, so it is worth making even for a
      // track that already has a name: whether the delete button is going to ask
      // for a password is not something to discover by pressing it.
      if (!entry.name) entry.name = 'Shared track ' + (i + 1);
      fetch(CLIP_API + '/clip/' + id, { method: 'HEAD' }).then(function(r) {
        if (!r.ok) return;
        var sent = r.headers.get('X-Clip-Name');
        if (sent) renameEntry(entry, decodeURIComponent(sent));
        if (r.headers.get('X-Clip-Locked')) {
          entry.locked = true;
          syncDanger();
        }
      }).catch(function() {});
    });
    renderQueue();
  }

  el['aud-prev'].addEventListener('click', function() {
    if (current > 0) playIndex(current - 1, playing);
  });

  el['aud-next'].addEventListener('click', function() {
    if (current >= 0 && current < queue.length - 1) playIndex(current + 1, playing);
  });

  el['aud-q-through'].addEventListener('change', function() {
    playThrough = el['aud-q-through'].checked;
  });

  el['aud-q-demo'].addEventListener('click', function() {
    addTracks([newEntry({ ref: 'demo', name: 'symphony.mp3' })], false);
  });

  // --- picking a track -------------------------------------------------------

  function takeFiles(files) {
    var picked = [];
    for (var i = 0; i < files.length; i++) picked.push(files[i]);
    // Consumed here, so a picker that was opened and then cancelled cannot leave
    // "replace" armed for whatever opens it next.
    var intent = fileIntent;
    fileIntent = 'add';
    if (!picked.length) return;

    if (intent === 'replace' && current >= 0) {
      // "Change track" swaps this row rather than growing the list.
      queue[current] = newEntry({ file: picked[0], name: picked[0].name });
      resetShare();
      playIndex(current, playing);
      if (picked.length > 1) {
        addTracks(picked.slice(1).map(function(f) {
          return newEntry({ file: f, name: f.name });
        }), false);
      }
      return;
    }

    addTracks(picked.map(function(f) { return newEntry({ file: f, name: f.name }); }), current < 0);
  }

  function wireFileInput(input) {
    input.addEventListener('change', function(e) {
      takeFiles(e.target.files);
      // Cleared so choosing the same file twice in a row still fires a change.
      e.target.value = '';
    });
  }
  wireFileInput(el['aud-file']);
  wireFileInput(el['aud-add']);
  wireFileInput(el['aud-simple-file']);

  el['aud-demo'].addEventListener('click', function() {
    addTracks([newEntry({ ref: 'demo', name: 'symphony.mp3' })], true);
  });

  el['aud-change'].addEventListener('click', function() {
    fileIntent = 'replace';
    el['aud-file'].click();
  });

  // Keyboard parity for the file labels, which are not real buttons, and the
  // intent each one carries. A label's own click runs before it forwards to the
  // input.
  //
  // Simple mode's is the odd one out. It says "Track", there is no playlist on
  // screen to add to, and someone who presses it while something is playing
  // means play this instead -- so it swaps rather than appends. With nothing
  // loaded yet there is nothing to swap and it falls through to adding, and
  // picking several files still builds a playlist that the step buttons can
  // walk, which is the whole of a queue that mode has room for.
  [
    ['label[for="aud-file"]', el['aud-file'], 'add'],
    ['label[for="aud-add"]', el['aud-add'], 'add'],
    ['label[for="aud-simple-file"]', el['aud-simple-file'], 'replace']
  ].forEach(function(spec) {
    var label = document.querySelector(spec[0]);
    if (!label) return;
    label.addEventListener('click', function() { fileIntent = spec[2]; });
    label.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileIntent = spec[2];
        spec[1].click();
      }
    });
  });

  ['dragenter', 'dragover'].forEach(function(ev) {
    el['aud-drop'].addEventListener(ev, function(e) {
      e.preventDefault();
      el['aud-drop'].classList.add('is-over');
    });
  });
  ['dragleave', 'drop'].forEach(function(ev) {
    el['aud-drop'].addEventListener(ev, function(e) {
      e.preventDefault();
      el['aud-drop'].classList.remove('is-over');
    });
  });
  el['aud-drop'].addEventListener('drop', function(e) {
    if (e.dataTransfer && e.dataTransfer.files) {
      fileIntent = 'add';
      takeFiles(e.dataTransfer.files);
    }
  });

  // --- live transcription ----------------------------------------------------
  //
  // The Web Speech API only ever listens to a microphone, so a loaded file cannot
  // be fed to it. Instead the track is cut into short windows, resampled to
  // 16 kHz mono, and posted to the Worker, which hands it to Gemini. The pump
  // stays a little ahead of the playhead, so a window is transcribed before it is
  // heard and the words land in time with the audio rather than after it.
  //
  // None of it starts on its own. The toggle is the only way in, it is off for
  // every track and every visit, and it is not remembered anywhere: audio leaves
  // this browser when someone asks for that and at no other time.
  //
  // Cuts land on the quietest moment near the target length. A window that ends
  // mid-word costs that word twice: once truncated here, once truncated at the
  // start of the next window.

  var txOn = false;
  // What the toggle reads, and the only thing that starts any of this. It is per
  // track and per visit: not remembered across tracks, not remembered across
  // sessions, and never set by anything but a press. A track that began
  // transcribing on its own would be sending audio to the Worker that nobody
  // asked to have sent, and that includes sending it on the strength of a box
  // that was ticked for some other track yesterday.
  var txWanted = false;
  // Whether the cached transcript for this clip has been asked for yet. Also
  // gated on the press: the lookup is free, but it says what someone is playing.
  var txLookedUp = false;
  var txBusy = false;
  var txDone = false;
  var txSegments = [];
  var txNext = 0;        // where the next window starts, in track seconds
  var txIndex = 0;       // window number, which is also its cache key
  var txLang = '';
  var txPrev = '';
  var txDuration = 0;
  var txSpans = [];
  var txActive = -1;
  var txActiveWord = -1;

  function txStatus(text) {
    el['aud-tx-status'].textContent = text || '';
  }

  function txSyncControls() {
    var box = el['aud-tx-on'];
    if (el['aud-tx-tip']) {
      el['aud-tx-tip'].innerHTML = txSeparated()
        ? 'off until you tick it &middot; then short windows of <strong>the vocal stem</strong> go to Gemini'
        : 'off until you tick it &middot; then short windows of the track go to Gemini';
    }
    // The box says what was asked for, and nothing else. It used to say
    // `txOn || txDone`, which made a finished transcript re-tick the box the
    // instant it was cleared: the change handler set txWanted false, this ran,
    // and txDone put the tick straight back. The toggle could not be switched off
    // at all on a track that had finished.
    box.checked = txWanted;
    box.disabled = !audioBuffer;
    el['aud-tx-copy'].disabled = !txSegments.length;
  }

  // The only way in. Nothing calls this on a load, on a track change, or on a
  // remembered preference: audio leaves the browser when someone ticks the box
  // and at no other time.
  function txBegin() {
    txWanted = true;
    txOn = true;
    // From the playhead, not from the top: the point is to read what is about to
    // be heard.
    if (!txSegments.length && !txNext) txNext = Math.max(0, position() - 0.5);
    txSyncControls();

    // Whatever the Worker already holds for this clip, asked for now rather than
    // on load. It costs nothing and saves the whole track's transcription, but it
    // still names a clip to the Worker, so it waits for the same press.
    var id = clipIdOf(queue[current]);
    if (id && !txLookedUp && !txSegments.length) {
      txLookedUp = true;
      txLoadCached(id, txDuration);
      return;
    }
    if (!txSegments.length) txStatus('Listening ahead to ' + txListensTo() + '…');
  }

  function txReset() {
    txOn = false;
    txWanted = false;
    txLookedUp = false;
    txBusy = false;
    txDone = false;
    txSegments = [];
    txNext = 0;
    txIndex = 0;
    txLang = '';
    txPrev = '';
    txDuration = 0;
    txSpans = [];
    txActive = -1;
    txActiveWord = -1;
    el['aud-caption'].classList.add('hidden');
    el['aud-caption-line'].textContent = '';
    txStatus('');
    txSyncControls();
  }

  // Kept on the entry, so leaving a track and coming back does not pay for it
  // again.
  function txSave() {
    if (current < 0 || !queue[current]) return;
    queue[current].tx = {
      segments: txSegments, next: txNext, index: txIndex, lang: txLang,
      done: txDone, wanted: txWanted, lookedUp: txLookedUp
    };
  }

  // Only ever from what this browser already has. A track that was transcribed
  // earlier in the visit comes back with its words and with the toggle in the
  // position it was left in; a track that was not fetches nothing and shows an
  // empty caption row until someone asks.
  function txAdopt(duration) {
    txDuration = duration;

    var saved = queue[current] && queue[current].tx;
    if (saved && saved.segments.length) {
      txSegments = saved.segments;
      txNext = saved.next;
      txIndex = saved.index;
      txLang = saved.lang;
      txDone = saved.done;
      txLookedUp = saved.lookedUp;
      txShowBody();
      txStatus(txDone ? 'Transcript complete.' : 'Picking up where this left off.');
      // Resumed only for a track that was already being transcribed when it was
      // left. The press is remembered for that track, never carried to a new one.
      if (saved.wanted && !txDone) txBegin();
      return;
    }

    txSyncControls();
  }

  // Whatever the Worker already holds for this clip. Someone transcribed it once
  // and everyone the link reaches reads it back without spending anything. Only
  // ever reached from txBegin, so this too waits for the press.
  function txLoadCached(id, duration) {
    var token = loadToken;
    fetch(CLIP_API + '/transcript/' + id).then(function(r) {
      return r.ok ? r.json() : null;
    }).then(function(data) {
      // Nothing to merge into: if the pump got a window back first, that text is
      // the one that is live.
      if (!data || token !== loadToken || txSegments.length) return;
      var chunks = data.chunks || [];
      if (!chunks.length) return;

      var end = 0;
      chunks.forEach(function(c) {
        (c.segments || []).forEach(function(seg) { txSegments.push(seg); });
        if (c.end > end) end = c.end;
        if (c.i >= txIndex) txIndex = c.i + 1;
        if (c.language && !txLang) txLang = c.language;
      });
      txSegments.sort(function(a, b) { return a.s - b.s; });
      txNext = end;
      txDone = end >= duration - 0.5;
      txSave();
      txShowBody();
      txStatus(txDone ? 'Transcript came with the link.' : 'Part of this is already transcribed.');
      txSyncControls();
    }).catch(function() {}).then(function() {
      // Found or not, the pump takes it from here; it has been running since the
      // press. This only has to say something if the lookup came back empty.
      if (token === loadToken && txOn && !txSegments.length) txStatus('Listening ahead to ' + txListensTo() + '…');
    });
  }

  // --- cutting the window ---
  //
  // What the transcriber is given, which is not the same thing as what is
  // playing. A model handed a voice with the band still on it spends its
  // attention deciding which of the two it is being asked about; handed the
  // vocal stem it gets a voice on a quiet background, which is the case it was
  // trained for. So when the track has been separated, the transcript is taken
  // from channel zero of the stems and not from the mix.
  //
  // It changes more than the words. The window boundaries are chosen on the
  // quietest moment nearby, and quiet in the mix is where the band stops, while
  // quiet in the vocal stem is where the singer stops -- which is exactly the
  // place a window should end.
  function txSeparated() { return sepReady() && sepBuffer.numberOfChannels >= 4; }

  function txListensTo() {
    return txSeparated() ? 'the vocal stem' : 'the track';
  }

  // One channel of whatever is being listened to, for the stretch asked for.
  // Built rather than referenced, so the resampler downstream is handed a voice
  // rather than a four-channel buffer it would helpfully mix back together.
  function txMono(start, end) {
    var src = txSeparated() ? sepBuffer : audioBuffer;
    var sr = src.sampleRate;
    var from = Math.max(0, Math.floor(start * sr));
    var to = Math.min(src.length, Math.ceil(end * sr));
    var n = Math.max(1, to - from);
    var out = audioCtx.createBuffer(1, n, sr);
    var dst = out.getChannelData(0);

    if (txSeparated()) {
      dst.set(src.getChannelData(0).subarray(from, to));
    } else {
      var l = src.getChannelData(0);
      var r = src.numberOfChannels > 1 ? src.getChannelData(1) : null;
      for (var i = 0; i < n; i++) dst[i] = r ? (l[from + i] + r[from + i]) * 0.5 : l[from + i];
    }
    return out;
  }

  // The quietest 20 ms in the search band around the target length. Silence is
  // where a sentence is least likely to be split.
  function txCut(start) {
    var target = Math.min(start + TX_TARGET_SEC, txDuration);
    if (txDuration - target < 2) return txDuration;

    var src = txSeparated() ? sepBuffer : audioBuffer;
    var sr = src.sampleRate;
    var data = src.getChannelData(0);
    var win = Math.max(64, Math.floor(sr * 0.02));
    var from = Math.max(start + 1, target - TX_CUT_SEARCH);
    var to = Math.min(txDuration - 0.05, target + TX_CUT_SEARCH);
    var best = target;
    var quietest = Infinity;

    for (var t = from; t <= to; t += 0.02) {
      var at = Math.floor(t * sr);
      var energy = 0;
      for (var i = at; i < at + win && i < data.length; i++) energy += data[i] * data[i];
      if (energy < quietest) { quietest = energy; best = t; }
    }
    return best;
  }

  function txWav(samples, rate) {
    var bytes = samples.length * 2;
    var buf = new ArrayBuffer(44 + bytes);
    var view = new DataView(buf);
    function str(at, text) {
      for (var i = 0; i < text.length; i++) view.setUint8(at + i, text.charCodeAt(i));
    }
    str(0, 'RIFF');
    view.setUint32(4, 36 + bytes, true);
    str(8, 'WAVE');
    str(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);          // PCM
    view.setUint16(22, 1, true);          // mono
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);   // byte rate
    view.setUint16(32, 2, true);          // block align
    view.setUint16(34, 16, true);         // bits
    str(36, 'data');
    view.setUint32(40, bytes, true);
    var at = 44;
    for (var i = 0; i < samples.length; i++) {
      var v = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(at, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      at += 2;
    }
    return buf;
  }

  // Averaged over each decimation window rather than picked from it: a plain
  // stride would fold everything above 8 kHz back down into the speech band.
  // Only reached where an offline context at 16 kHz is refused.
  function txDecimate(start, end) {
    var src = txSeparated() ? sepBuffer : audioBuffer;
    var sr = src.sampleRate;
    var left = src.getChannelData(0);
    // The stems' first channel is the voice on its own, so there is nothing to
    // average it with; the track's two channels still want summing.
    var right = (!txSeparated() && src.numberOfChannels > 1) ? src.getChannelData(1) : null;
    var step = sr / TX_RATE;
    var n = Math.max(1, Math.floor((end - start) * TX_RATE));
    var out = new Float32Array(n);
    var base = start * sr;

    for (var i = 0; i < n; i++) {
      var from = Math.floor(base + i * step);
      var to = Math.floor(base + (i + 1) * step);
      if (to <= from) to = from + 1;
      var sum = 0;
      var count = 0;
      for (var j = from; j < to && j < left.length; j++) {
        sum += right ? (left[j] + right[j]) * 0.5 : left[j];
        count++;
      }
      out[i] = count ? sum / count : 0;
    }
    return out;
  }

  // An offline context resamples properly and downmixes to mono on the way out,
  // because its destination has one channel. Safari refused rates outside the
  // hardware range for years, hence the fallback.
  function txSlice(start, end) {
    var Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var frames = Math.max(1, Math.round((end - start) * TX_RATE));

    if (Offline) {
      try {
        var off = new Offline(1, frames, TX_RATE);
        var src = off.createBufferSource();
        // A single channel, already chosen: handing the four-channel stem buffer
        // to a mono destination would have it helpfully mixed back into the
        // track this is trying to get away from.
        src.buffer = txMono(start, end);
        src.connect(off.destination);
        src.start(0);
        return new Promise(function(resolve, reject) {
          off.oncomplete = function(ev) {
            resolve(txWav(ev.renderedBuffer.getChannelData(0), TX_RATE));
          };
          var ret = off.startRendering();
          if (ret && ret.then) {
            ret.then(function(buf) { resolve(txWav(buf.getChannelData(0), TX_RATE)); }, reject);
          }
          // Neither form reported back. Without this the pump would sit busy for
          // the rest of the track.
          setTimeout(function() { reject(new Error('The browser stalled on that window.')); }, 20000);
        });
      } catch (e) {
        // Fall through to the hand-rolled path.
      }
    }
    return Promise.resolve(txWav(txDecimate(start, end), TX_RATE));
  }

  function txPost(wav, start, index) {
    var id = clipIdOf(queue[current]);
    var url = CLIP_API + '/transcribe?i=' + index + '&start=' + start.toFixed(3) +
      (id ? '&clip=' + id : '');
    var headers = { 'Content-Type': 'audio/wav' };
    // The tail of the last window, so a sentence carried across the cut is
    // finished rather than restarted.
    if (txPrev) headers['X-Clip-Prev'] = encodeURIComponent(txPrev);
    // Detected once and held: per-window detection lets an instrumental passage
    // flip the track into another language.
    if (txLang) headers['X-Clip-Lang'] = encodeURIComponent(txLang);

    return fetch(url, { method: 'POST', headers: headers, body: wav }).then(function(resp) {
      return resp.json().catch(function() { return {}; }).then(function(data) {
        if (!resp.ok) throw new Error(data.error || 'Transcription failed.');
        return data;
      });
    });
  }

  function txPump() {
    if (!txOn || txBusy || txDone || !audioBuffer) return;

    if (txNext >= txDuration - 0.2) {
      txDone = true;
      txSave();
      txStatus('Transcript complete.');
      txSyncControls();
      return;
    }

    var pos = position();
    // Someone jumped forward. Transcribing the minutes they skipped would spend
    // the budget on audio nobody is going to hear, so the gap is left as a gap.
    if (pos > txNext + TX_JUMP_SEC) {
      txNext = pos;
      txPrev = '';
    }
    // Already far enough ahead of the playhead. The first stretch is exempt, so a
    // track sitting paused at the start still gets half a minute fetched once
    // transcription is switched on.
    if (txNext > pos + TX_LEAD_SEC && txNext >= TX_PRELOAD_SEC) return;

    var start = txNext;
    var end = txCut(start);
    if (end - start < 0.4) {
      txDone = true;
      txSyncControls();
      return;
    }

    txBusy = true;
    var token = loadToken;
    if (!txSegments.length) txStatus('Listening ahead to ' + txListensTo() + '…');

    txSlice(start, end).then(function(wav) {
      if (token !== loadToken) return null;
      return txPost(wav, start, txIndex);
    }).then(function(data) {
      if (!data || token !== loadToken) return;
      txIndex += 1;
      txNext = end;
      if (data.language) txLang = data.language;

      var added = data.segments || [];
      if (added.length) {
        added.forEach(function(seg) { txSegments.push(seg); });
        txPrev = (txPrev + ' ' + added[added.length - 1].t).slice(-220).trim();
        txShowBody();
      }
      txSave();
      txStatus(txNext >= txDuration - 0.2 ? 'Transcript complete.' : 'Transcribing…');
    }).catch(function(err) {
      if (token !== loadToken) return;
      // The toggle clears with it. A refusal is something to be told about and
      // then to retry deliberately, not a box that stays ticked over a pump that
      // has stopped.
      txOn = false;
      txWanted = false;
      txStatus(err && err.message ? err.message : 'Transcription failed.');
      txSave();
      txSyncControls();
    }).then(function() {
      if (token === loadToken) txBusy = false;
    });
  }

  // --- rendering ---

  // There is no transcript list any more, only the caption under the visualiser,
  // so arriving text has nothing to render into. All this has to do is open the
  // caption row and let the copy button light up.
  function txShowBody() {
    if (!txSegments.length) return;
    // Shown from here rather than per line: the caption keeps its height while it
    // is empty, so the transport underneath does not jump between lines.
    el['aud-caption'].classList.remove('hidden');
    txSyncControls();
  }

  function txFind(pos) {
    for (var i = 0; i < txSegments.length; i++) {
      var seg = txSegments[i];
      if (pos >= seg.s - 0.15 && pos <= seg.e + 0.35) return i;
      if (seg.s > pos) break;
    }
    return -1;
  }

  // Some windows come back as a block of text with no word timings on it. Spacing
  // the words out by their length is not the real cadence, but it keeps the line
  // arriving a word at a time rather than landing all at once.
  function txSpreadWords(seg) {
    var parts = seg.t.split(/\s+/).filter(function(p) { return p; });
    if (!parts.length) return [];

    var total = 0;
    parts.forEach(function(p) { total += p.length + 1; });
    var span = Math.max(0.2, seg.e - seg.s);
    var at = 0;

    return parts.map(function(p) {
      var s = seg.s + (at / total) * span;
      at += p.length + 1;
      return { t: p, s: s, e: seg.s + (at / total) * span };
    });
  }

  // The whole line is laid out the moment its segment starts, and every word is
  // invisible until the playhead reaches it. Holding back the ink rather than the
  // element means the line wraps once, so the words already spoken stay put as the
  // next one appears instead of being re-centred under it.
  function txCaption(i) {
    var line = el['aud-caption-line'];
    line.textContent = '';
    txSpans = [];
    txActiveWord = -1;

    // Between lines: the row stays, holding its space, with nothing in it.
    if (i < 0) return;

    var seg = txSegments[i];
    var words = seg.w && seg.w.length ? seg.w : txSpreadWords(seg);
    words.forEach(function(word, k) {
      var span = document.createElement('span');
      span.className = 'aud-cap-w';
      // Some models hand back tokens with their own leading space, some do not.
      span.textContent = (k && word.t.charAt(0) !== ' ' ? ' ' : '') + word.t;
      line.appendChild(span);
      txSpans.push({ node: span, s: word.s, e: word.e });
    });
  }

  // How much of the line has been heard: every word up to the playhead is showing,
  // and the one being said now is lit.
  function txMarkWord(pos) {
    if (!txSpans.length) return;
    var at = -1;
    for (var i = 0; i < txSpans.length; i++) {
      if (pos >= txSpans[i].s - 0.05) at = i;
      else break;
    }
    if (at === txActiveWord) return;

    // Rewritten across the line rather than just the two words that changed, so a
    // seek backwards takes the later words away again.
    for (var k = 0; k < txSpans.length; k++) {
      txSpans[k].node.classList.toggle('is-in', k <= at);
      txSpans[k].node.classList.toggle('is-now', k === at);
    }
    txActiveWord = at;
  }

  function txFollow() {
    if (!txSegments.length) return;
    var pos = position();
    var i = txFind(pos);
    if (i !== txActive) {
      txActive = i;
      txCaption(i);
    }
    if (i >= 0) txMarkWord(pos);
  }

  el['aud-tx-on'].addEventListener('change', function() {
    if (el['aud-tx-on'].checked && audioBuffer) {
      txBegin();
      return;
    }
    txWanted = false;
    txOn = false;
    txStatus(txSegments.length ? 'Stopped. The text so far is kept.' : '');
    txSave();
    txSyncControls();
  });

  function txPlainText() {
    return txSegments.map(function(seg) { return seg.t; }).join('\n');
  }

  el['aud-tx-copy'].addEventListener('click', function() {
    var text = txPlainText();
    function done() { txStatus('Copied.'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function() {
        txStatus('Could not copy.');
      });
    } else {
      txStatus('Could not copy.');
    }
  });

  // --- share -----------------------------------------------------------------

  // v3 replaces v2's single `a=<ref>` with `t=`, the whole queue, and `i=`, which
  // track it opens on. v2 links are still read; see applyState.
  //
  // Echo and reverb arrived after v3 and did not take the version with them, and
  // the stems have not either. They are extra keys, written only when they are
  // doing something, and a reader that has never heard of them ignores them and
  // restores everything else. A bump would have made an older cached page throw
  // the whole link away -- and a playlist that opens without its reverb, or with
  // its four stems summed back into one track, is a better failure than a
  // playlist that does not open.
  //
  // The master rack keeps the bare `flt`, `ec` and `rv` it has always had, which
  // is what makes a link written before any of this mean exactly what it did.
  // Each stem takes the same three keys behind an `s<k>` prefix, plus `s<k>` for
  // its fader, and none of them is written for a stem that is doing nothing.
  function encodeState() {
    var parts = ['v=3'];
    function bit(b) { return b ? '1' : '0'; }

    function rackKeys(r, prefix, always) {
      if (always || r.filterType) {
        parts.push(prefix + 'flt=' + [
          r.filterType ? FILTER_CODES[r.filterType] : 'off',
          r.freqPos,
          // The Q itself, not where the slider is sitting. The two were the same
          // number until the slider was remapped, and keeping the link on the
          // value is what makes a link written either side of that still mean
          // one thing.
          String(+rackQ(r).toFixed(2))
        ].join(','));
      }
      if (r.echoOn) parts.push(prefix + 'ec=' + [r.echoMs, r.echoFb, r.echoMix].join(','));
      if (r.revOn) parts.push(prefix + 'rv=' + [r.revSec, r.revPreMs, r.revMix].join(','));
    }

    rackKeys(master, '', true);

    if (split.on) {
      // A third field on a key that used to have two. A page from before this
      // splits on the comma, takes the two it knows and ignores the rest, which
      // is a link that opens on the band split -- the right failure, because the
      // band split is the one that needs no analysis to be heard.
      parts.push('sp=' + [split.f1Pos, split.f2Pos, split.mode === 'sources' ? 's' : 'b'].join(','));
      stems.forEach(function(st, i) {
        var prefix = 's' + i;
        if (st.db !== 0 || st.muted || st.soloed) {
          parts.push(prefix + '=' + [String(+st.db.toFixed(1)), bit(st.muted), bit(st.soloed)].join(','));
        }
        rackKeys(st.rack, prefix, false);
      });
    }

    parts.push('viz=' + [bit(showWave), bit(showFreq)].join(','));
    parts.push('vol=' + el['aud-volume'].value);
    if (semitones) parts.push('p=' + semitones);

    var refs = [];
    var at = -1;
    for (var i = 0; i < queue.length; i++) {
      // No ref means the file never left this browser, so there is nothing a link
      // could point at.
      if (!queue[i].ref) continue;
      if (i === current) at = refs.length;
      refs.push(queue[i].ref === 'demo' ? 'd' : queue[i].ref.slice(5));
    }
    if (refs.length) {
      parts.push('t=' + refs.join(','));
      if (at > 0) parts.push('i=' + at);
      // The rest of the names come back from the clips themselves. This one is
      // carried so the note at the top of a shared page can be specific before
      // any audio has been fetched.
      if (audioName && at >= 0) parts.push('n=' + encodeURIComponent(audioName));
    }

    // What the sender wrote about the link. It rides in the hash so the page can
    // show it, and it is sent to the Worker as well so the preview card can, but
    // the hash is the copy that survives being forwarded on after the card has
    // expired.
    var title = shareTitle();
    var note = shareNote();
    if (title) parts.push('ti=' + encodeURIComponent(title));
    if (note) parts.push('no=' + encodeURIComponent(note));

    return parts.join('&');
  }

  function shareTitle() { return el['aud-share-title'].value.trim().slice(0, MAX_TITLE); }
  function shareNote() { return el['aud-share-note'].value.trim().slice(0, MAX_NOTE); }

  function decodeState(hash) {
    var out = {};
    hash.replace(/^#/, '').split('&').forEach(function(kv) {
      var eq = kv.indexOf('=');
      if (eq < 1) return;
      try { out[kv.slice(0, eq)] = decodeURIComponent(kv.slice(eq + 1)); }
      catch (err) { out[kv.slice(0, eq)] = kv.slice(eq + 1); }
    });
    return out;
  }

  function setSlider(node, value) {
    if (value === undefined || value === '' || isNaN(parseFloat(value))) return;
    node.value = value;
    node.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // A number a stranger put in a URL, held to the range the slider it is going
  // to sit on actually has.
  function inRange(text, lo, hi, fallback) {
    var v = parseFloat(text);
    if (!isFinite(v)) return fallback;
    return v < lo ? lo : (v > hi ? hi : v);
  }

  // The three keys a rack is written as, read back into it. Absence is the off
  // switch for echo and reverb, which is why neither is written when it is off.
  function readRack(s, r, prefix) {
    var flt = (s[prefix + 'flt'] || '').split(',');
    if (s[prefix + 'flt'] && flt.length >= 3) {
      var want = flt[0] === 'off' ? null : (FILTER_TYPES[flt[0]] || null);
      r.filterType = want;
      r.freqPos = inRange(flt[1], 0, 1000, r.freqPos);
      // Back from the value the link carries to a position on the slider, under
      // whichever chip is about to read it.
      var q = parseFloat(flt[2]);
      if (isFinite(q)) r.qPos = qValueToSlider(want || 'lowpass', q);
    }

    var ec = (s[prefix + 'ec'] || '').split(',');
    if (s[prefix + 'ec'] && ec.length >= 3) {
      r.echoMs = inRange(ec[0], 20, 1500, r.echoMs);
      r.echoFb = inRange(ec[1], 0, 0.9, r.echoFb);
      r.echoMix = inRange(ec[2], 0, 1, r.echoMix);
      r.echoOn = true;
    }

    var rv = (s[prefix + 'rv'] || '').split(',');
    if (s[prefix + 'rv'] && rv.length >= 3) {
      r.revSec = inRange(rv[0], 0.2, 6, r.revSec);
      r.revPreMs = inRange(rv[1], 0, 200, r.revPreMs);
      r.revMix = inRange(rv[2], 0, 1, r.revMix);
      r.revOn = true;
    }
  }

  function applyState(s) {
    if (s.v !== '2' && s.v !== '3') return;

    readRack(s, master, '');

    // Only when the link says so: a reader arriving on a link from before the
    // stems existed gets the whole track, which is what it was.
    var sp = (s.sp || '').split(',');
    if (s.sp && sp.length >= 2) {
      split.f1Pos = inRange(sp[0], 0, 1000 - SPLIT_MIN_GAP, split.f1Pos);
      split.f2Pos = inRange(sp[1], split.f1Pos + SPLIT_MIN_GAP, 1000, split.f2Pos);
      // The stems themselves are not in the link and could not be: they are
      // hundreds of megabytes made out of the recording. What travels is the
      // instruction, and the recipient presses Separate to carry it out.
      split.mode = sp[2] === 's' ? 'sources' : 'bands';
      sepAsked = split.mode === 'sources';
      stems.forEach(function(st, i) {
        var prefix = 's' + i;
        var mix = (s[prefix] || '').split(',');
        if (s[prefix] && mix.length >= 3) {
          st.db = inRange(mix[0], STEM_DB_MIN, STEM_DB_MAX, st.db);
          st.muted = mix[1] === '1';
          st.soloed = mix[2] === '1';
        }
        readRack(s, st.rack, prefix);
      });
      nameStems();
      syncSplitLabels();
      setSplit(true);
    }

    var viz = (s.viz || '').split(',');
    if (viz.length >= 2) {
      if ((viz[0] === '1') !== showWave) el['aud-view-wave'].click();
      if ((viz[1] === '1') !== showFreq) el['aud-view-freq'].click();
    }

    if (s.vol !== undefined) setSlider(el['aud-volume'], s.vol);

    if (s.p !== undefined) {
      var st = parseInt(s.p, 10);
      if (!isNaN(st) && st >= -12 && st <= 12) {
        el['aud-pitch'].value = st;
        setSemitones(st);
      }
    }

    // Whatever the racks and the split came out as, in the controls and in the
    // graph. setSplit has already done both where the link carried one.
    syncRackUi();
    applyStemGains();
    rebuildChain();

    if (s.t) restoreQueue(s.t, parseInt(s.i, 10) || 0, s.n);
    // A v2 link, from before a share could carry more than one track.
    else if (s.a) restoreQueue(s.a === 'demo' ? 'd' : s.a.replace(/^clip:/, ''), 0, s.n);

    // After the queue, which is what un-hides the note this writes into. The
    // share card adds `s=` on its way through, so a recipient can take the card
    // down along with the audio.
    if (s.s && CLIP_ID_RE.test(s.s)) shareId = s.s;
    showSenderWords(s.ti, s.no);
  }

  // Set from a link, and put back into the share fields so that forwarding the
  // page on carries them rather than quietly dropping them.
  function showSenderWords(title, note) {
    var clean = function(text, limit) {
      return String(text || '').replace(/\s+/g, ' ').trim().slice(0, limit);
    };
    var t = clean(title, MAX_TITLE);
    var n = clean(note, MAX_NOTE);
    if (!t && !n) return;

    if (t) {
      el['aud-shared-title'].textContent = t;
      el['aud-share-title'].value = t;
    }
    if (n) {
      // textContent, not innerHTML: this is a stranger's text arriving in a URL.
      el['aud-shared-msg'].textContent = n;
      el['aud-shared-msg'].classList.remove('hidden');
      el['aud-share-note'].value = n;
    }
    el['aud-shared-note'].classList.remove('hidden');
  }

  function restoreQueue(list, index, name) {
    var entries = [];
    String(list).split(',').slice(0, MAX_QUEUE).forEach(function(token) {
      if (token === 'd') entries.push(newEntry({ ref: 'demo', name: 'symphony.mp3' }));
      else if (CLIP_ID_RE.test(token)) entries.push(newEntry({ ref: 'clip:' + token }));
    });
    if (!entries.length) return;
    if (!(index >= 0 && index < entries.length)) index = 0;
    if (name && !entries[index].name) entries[index].name = name;

    queue = entries;
    el['aud-shared-note'].classList.remove('hidden');
    el['aud-shared-detail'].textContent = entries.length > 1
      ? 'Press play for their ' + entries.length + ' track playlist, with their filter settings.'
      : 'Press play to hear "' + (entries[index].name || 'their track') + '" with their settings.';

    // Fetched and decoded straight away. Decoding needs an AudioContext but not a
    // resumed one, so nothing here depends on a gesture; only starting playback
    // does, and the play button supplies that.
    playIndex(index, false);
    labelClips();
  }

  function uploadKey() {
    try { return window.sessionStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; }
  }

  function sharePassword() {
    return el['aud-share-pass'].value;
  }

  function uploadClip(file) {
    var headers = {
      'Content-Type': file.type || 'application/octet-stream',
      'X-Clip-Name': encodeURIComponent(file.name)
    };
    // Only ever a request header. encodeState never sees it, so it cannot end up
    // in a link that gets forwarded on.
    var key = uploadKey();
    if (key) headers['X-Clip-Key'] = key;

    // The delete password, and the same rule: a request header, never the hash.
    // It can only be set as the clip goes up, which is why the field is disabled
    // once anything in the queue has been uploaded.
    var pass = sharePassword();
    if (pass) headers['X-Clip-Lock'] = pass;

    return fetch(CLIP_API + '/clip', {
      method: 'POST',
      headers: headers,
      body: file
    }).then(function(resp) {
