<script>
(function() {
  // Signal Share: an audio player whose entire state fits in a link.
  //
  // The wave/convolution playground is a separate app now. Nothing here reads or
  // writes its controls, so the two can change independently.

  var CLIP_API = 'https://nero-chatbot-proxy.nhamidi.workers.dev';
  var CLIP_ID_RE = /^[A-Za-z0-9_-]{22}$/;
  var DEMO_SRC = '{{ "/assets/audio/symphony.mp3" | relative_url }}';

  var FILTER_CODES = { lowpass: 'lp', highpass: 'hp', bandpass: 'bp', 'notch-wide': 'bs', 'notch-narrow': 'nt' };
  var FILTER_TYPES = { lp: 'lowpass', hp: 'highpass', bp: 'bandpass', bs: 'notch-wide', nt: 'notch-narrow' };
  // The Q a chip arrives on. Band Stop and Notch are the same filter and differ by
  // nothing else; Band Pass is here because Q is a width for it, and inheriting a
  // number left behind by another chip can hand it a band too narrow to hear
  // through. Low and high pass are left out on purpose: their Q is resonance in
  // decibels, which is a filter you can listen to anywhere on the slider.
  var FILTER_DEFAULT_Q = { bandpass: 2, 'notch-wide': 0.5, 'notch-narrow': 10 };
  var FILTER_LABELS = {
    lowpass: 'Low Pass', highpass: 'High Pass', bandpass: 'Band Pass',
    'notch-wide': 'Band Stop', 'notch-narrow': 'Notch'
  };
  // A band type has no cut-off. It has a centre and two −3 dB edges either side,
  // so the frequency slider is naming a different thing depending on the chip.
  var FILTER_IS_BAND = { bandpass: true, 'notch-wide': true, 'notch-narrow': true };
  // And the second slider is two different quantities: the Web Audio biquad reads
  // Q as decibels of resonance for the low and high pass, and as a plain quality
  // factor for the band types. One slider, so the label has to say which.
  function filterFreqLabel(type) { return FILTER_IS_BAND[type] ? 'Centre' : 'Cutoff'; }
  function filterQLabel(type) { return FILTER_IS_BAND[type] ? 'Q' : 'Resonance'; }

  // The delay line is allocated once at its longest, and the slider moves a
  // read pointer inside it. A DelayNode cannot grow after it is made.
  // A shade over what the sliders can ask for: delayTime is clamped to the
  // ceiling the line was built with, and a slider sitting exactly on it is one
  // rounding error away from being quietly shortened.
  var ECHO_MAX_SEC = 1.6;
  var REV_MAX_PRE = 0.25;
  // -60 dB is the conventional end of a tail, and 10^(-60/20) = 1/1000. Every
  // decay figure on this page is measured to that point.
  var DECAY_LN = Math.log(1000);
  // Building a stereo impulse response is a few hundred thousand random numbers,
  // which is fine once and jank if it happens on every pixel of a drag.
  var IR_REBUILD_MS = 90;

  // A share uploads every local file in the queue, one request each, and the
  // Worker rate-limits uploads per minute. Ten keeps a full playlist inside one
  // window of that limit.
  var MAX_QUEUE = 10;

  // Transcription windows. Short enough that the first words land while the intro
  // is still playing, long enough that the model has a sentence to work with.
  var TX_TARGET_SEC = 12;
  var TX_CUT_SEARCH = 1.2;   // how far either side of the target to hunt for a quiet cut
  var TX_LEAD_SEC = 24;      // how far ahead of the playhead to stay
  var TX_JUMP_SEC = 45;      // a seek longer than this gives up on the gap
  var TX_RATE = 16000;       // plenty for speech, and what keeps a window under a megabyte
  // Fetched from wherever the pump starts even if nothing is playing, so ticking
  // the toggle before pressing play leaves words waiting. Windows are cut on
  // quiet, so it stops at the first boundary past this rather than exactly on it.
  // Nothing here runs before the toggle is ticked; see the note above txBegin.
  var TX_PRELOAD_SEC = 30;
  // What a title and a note may be, matching the Worker's own ceilings. Longer
  // than either is not a share card, it is a place to keep text.
  var MAX_TITLE = 80;
  var MAX_NOTE = 300;
  // The upload key lives in sessionStorage rather than localStorage: it is a
  // password, and a password that survives closing the tab is one that outlives
  // the reason it was typed. Retyping it once a session is the cheaper mistake.
  var KEY_STORE = 'aud-upload-key';

  var el = {};
  [
    'aud-drop', 'aud-file', 'aud-demo', 'aud-player', 'aud-canvas', 'aud-name', 'aud-change',
    'aud-current', 'aud-seek', 'aud-duration', 'aud-stop', 'aud-play', 'aud-play-icon',
    'aud-volume', 'aud-vol-val', 'aud-shape', 'aud-filters', 'aud-params',
    'aud-filter-freq', 'aud-filter-freq-val', 'aud-filter-q', 'aud-filter-q-val',
    'aud-filter-freq-name', 'aud-filter-q-name',
    'aud-pitch', 'aud-pitch-val', 'aud-pitch-rate', 'aud-pitch-reset',
    'aud-chain', 'aud-math', 'aud-math-on',
    'aud-echo-on', 'aud-echo-params', 'aud-echo-time', 'aud-echo-time-val',
    'aud-echo-fb', 'aud-echo-fb-val', 'aud-echo-mix', 'aud-echo-mix-val',
    'aud-rev-on', 'aud-rev-params', 'aud-rev-decay', 'aud-rev-decay-val',
    'aud-rev-pre', 'aud-rev-pre-val', 'aud-rev-mix', 'aud-rev-mix-val',
    'aud-note-name', 'aud-note-hz', 'aud-note-cents',
    'aud-view-wave', 'aud-view-freq', 'aud-share', 'aud-share-btn', 'aud-share-out',
    'aud-share-link', 'aud-share-copy', 'aud-share-status', 'aud-share-hint',
    'aud-shared-note', 'aud-shared-title', 'aud-shared-detail', 'aud-shared-msg',
    'aud-share-title', 'aud-share-note', 'aud-share-pass', 'aud-lock-hint',
    'aud-key', 'aud-danger', 'aud-del-btn', 'aud-del-note', 'aud-del-pass',
    'aud-prev', 'aud-next', 'aud-caption', 'aud-caption-line',
    'aud-queue', 'aud-q-list', 'aud-add', 'aud-q-demo', 'aud-q-through', 'aud-q-count',
    'aud-tx-on', 'aud-tx-status', 'aud-tx-copy', 'aud-bg', 'aud-bg-on', 'aud-bg-tip'
  ].forEach(function(id) { el[id] = document.getElementById(id); });

  var ctx2d = el['aud-canvas'].getContext('2d');
  var isLight = document.body.classList.contains('light-mode');
  new MutationObserver(function() {
    isLight = document.body.classList.contains('light-mode');
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  var audioCtx = null;
  var gainNode = null;
  var filterNode = null;
  var analyser = null;
  var filterType = null;
  // Every effect is its own stage with its own on switch, and the stages chain
  // rather than replace one another. All of them are linear and time invariant,
  // so the whole chain is one filter whose transfer function is the product of
  // theirs; the math panel says so, and it is why the fixed order costs nothing.
  var echoOn = false;
  var revOn = false;
  var echoNodes = null;    // built on first use, then kept and rewired
  var revNodes = null;
  var irKey = '';          // the size and rate the current impulse response was built for
  var irTimer = null;
  var mathOn = false;
  var showWave = true;
  var showFreq = true;
  var filterTouched = 0;   // last time a filter control moved, for the curve's emphasis
  var semitones = 0;
  var lastDetect = 0;
  var detectBuf = null;

  // Playback runs off a decoded AudioBuffer rather than an <audio> element.
  // Routing an element through createMediaElementSource leaves pause and
  // playbackRate at the mercy of each browser's media stack, and Safari honours
  // neither reliably. A buffer source is plain Web Audio: stop() always stops, and
  // playbackRate always resamples, so pitch and transport behave the same
  // everywhere. The cost is that a track is fully decoded before it plays, which
  // the 12 MB upload cap already bounds.
  var audioBuffer = null;
  var bufSource = null;
  var offsetSec = 0;        // position in the buffer, in buffer seconds
  var startedAt = 0;        // audioCtx.currentTime when the current source started
  var playing = false;
  var loadToken = 0;        // guards against a slow load finishing after a newer one

  // --- what happens when the page goes away ---------------------------------
  //
  // One switch the listener owns, and one fact about the platform. Between them
  // they decide the whole of it:
  //
  //   off                  playback pauses at the door and picks up where it
  //                        left off on the way back in.
  //   on, graph survives   nothing happens at all. A desktop browser keeps an
  //                        AudioContext running in a hidden tab, so the source,
  //                        the effects and the level carry on exactly as they
  //                        were. This is the common case, and doing nothing to
  //                        it is what makes it seamless.
  //   on, graph does not   the track is handed to a bare media element.
  //
  // Only iOS needs that third case. Safari there moves an AudioContext to
  // `interrupted` the moment it is backgrounded or the screen locks: the spec
  // has a state for it and no flag turns it off, so Web Audio cannot play while
  // the page is hidden no matter how the graph is built. A plain <audio> element
  // can, because it runs on the platform's own audio session rather than ours.
  //
  // Handing over is not free. The element plays the track unrouted, so the
  // effects and the spectrum drop out and the level jumps to whatever the track
  // is without them — audible as a blip and then a louder track, which is
  // exactly why it is now reserved for the one platform with no alternative.
  var bgAllowed = true;     // "Continue in the background"
  var bgUrl = null;         // object URL for the current track, or null
  var bgActive = false;     // the element, not the graph, is the one playing
  var bgPrimed = false;     // the element has played once from a real gesture
  var pausedByHide = false; // we paused it at the door, so we resume it on return

  // iPhone and iPad, including the iPad that calls itself a Mac. Every browser
  // on iOS is WebKit underneath and inherits the interruption, so which one it
  // is does not come into it. A guess, but only ever the opening one: a context
  // that is interrupted out from under a hidden page corrects it below.
  var handoffNeeded = (function() {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
  })();

  var PLAY_PATH = 'M8 5.5v13l11-6.5z';
  var PAUSE_PATH = 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z';

  // The queue is the unit the page shares now. Each entry is one track:
  //   ref   'demo', 'clip:<id>', or null while a file is still only local
  //   file  the File, until a share uploads it and it gains a ref
  //   name  what the row and the player show
  //   tx    that track's transcript, kept so switching away and back is free
  var queue = [];
  var current = -1;
  var playThrough = true;
  var audioName = '';
  // Both file inputs land in the same handler; this says which one opened it.
  var fileIntent = 'add';

  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // The audible decade and a bit, shared by the slider and by the x axis of the
  // visualiser. One pair of constants so a curve drawn at 632 Hz cannot land
  // somewhere other than where the slider says it is.
  var F_MIN = 20;
  var F_MAX = 20000;
  var F_LOG_MIN = Math.log(F_MIN);
  var F_LOG_SPAN = Math.log(F_MAX) - F_LOG_MIN;

  function filterSliderToFreq(val) {
    return Math.exp(F_LOG_MIN + (val / 1000) * F_LOG_SPAN);
  }

  function freqToX(hz, w) {
    if (!(hz > 0)) return 0;
    return ((Math.log(hz) - F_LOG_MIN) / F_LOG_SPAN) * w;
  }

  function xToFreq(x, w) {
    return Math.exp(F_LOG_MIN + (x / w) * F_LOG_SPAN);
  }

  function formatFilterFreq(hz) {
    return hz >= 1000 ? (hz / 1000).toFixed(1) + ' kHz' : Math.round(hz) + ' Hz';
  }

  // Short enough to sit under a curve without covering it.
  function formatFreqTick(hz) {
    if (hz >= 10000) return Math.round(hz / 1000) + 'k';
    if (hz >= 1000) return (hz / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return Math.round(hz) + '';
  }

  // The second slider is a position, not a number to be used as it stands.
  //
  // For the low and high pass it runs linearly over decibels of resonance, which
  // is already a logarithmic unit and needs no help. For the band types it runs
  // logarithmically over Q, because Q is a width there and width is heard in
  // octaves: a band at Q 10 and one at Q 20 are both a single frequency to the
  // ear, while 0.5 to 1 is a whole octave of difference. Linear in Q spent half
  // the travel on the first pair and a fifth of it on the second.
  var Q_DB_MIN = 0.1;
  var Q_DB_MAX = 20;
  var Q_BAND_MIN = 0.2;
  var Q_BAND_MAX = 20;
  var Q_BAND_LOG_MIN = Math.log(Q_BAND_MIN);
  var Q_BAND_LOG_SPAN = Math.log(Q_BAND_MAX) - Q_BAND_LOG_MIN;

  function qSliderToValue(type, pos) {
    if (!FILTER_IS_BAND[type]) return qSnap(type, Q_DB_MIN + (pos / 1000) * (Q_DB_MAX - Q_DB_MIN));
    return qSnap(type, Math.exp(Q_BAND_LOG_MIN + (pos / 1000) * Q_BAND_LOG_SPAN));
  }

  // Snapped to the precision the readout prints, which makes three things one
  // number: what the slider says, what the filter runs on, and what the link
  // carries. A thousand positions over a hundredfold range land between the
  // tenths otherwise, and a link would come back as a slightly different filter
  // from the one that was shared.
  function qSnap(type, v) {
    if (!FILTER_IS_BAND[type]) return Math.round(v * 10) / 10;
    return v < 1 ? Math.round(v * 100) / 100 : Math.round(v * 10) / 10;
  }

  function qValueToSlider(type, v) {
    if (!(v > 0)) return 0;
    var pos = FILTER_IS_BAND[type]
      ? ((Math.log(v) - Q_BAND_LOG_MIN) / Q_BAND_LOG_SPAN) * 1000
      : ((v - Q_DB_MIN) / (Q_DB_MAX - Q_DB_MIN)) * 1000;
    return Math.max(0, Math.min(1000, Math.round(pos)));
  }

  // What the filter is actually running on, wherever the slider is sitting.
  function filterQ() {
    return qSliderToValue(filterType || 'lowpass', parseFloat(el['aud-filter-q'].value));
  }

  // The value under the second slider, in the units that slider actually carries.
  // Two decimals below 1, where a tenth is a fifth of the number.
  function formatFilterQ(type, q) {
    if (!FILTER_IS_BAND[type]) return q.toFixed(1) + ' dB';
    return q < 1 ? q.toFixed(2) : q.toFixed(1);
  }

  // --- audio graph -----------------------------------------------------------

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.value = parseFloat(el['aud-volume'].value);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      // A browser that takes the context away from a hidden page has just said
      // it needs the handoff, whatever the user agent claimed. Recorded rather
      // than acted on: by the time this fires the page is already gone, and the
      // fix belongs to the next time it leaves.
      audioCtx.onstatechange = function() {
        if (document.hidden && playing && !bgActive && audioCtx.state !== 'running') {
          handoffNeeded = true;
        }
      };
      rebuildChain();
    }
    // Creation is allowed without a gesture; resuming is not, so this is called
    // again from the play handler where a real activation exists.
    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }

  // --- the effect stages -----------------------------------------------------
  //
  // Each stage is a little subgraph with one input node and one output node, so
  // the chain builder does not have to know what is inside it. The wiring within
  // a stage is made once and left alone; only the connections between stages are
  // torn down and remade when something is switched on or off.

  function echoStage() {
    if (echoNodes || !audioCtx) return echoNodes;
    var input = audioCtx.createGain();
    var out = audioCtx.createGain();
    var dry = audioCtx.createGain();
    var wet = audioCtx.createGain();
    var delay = audioCtx.createDelay(ECHO_MAX_SEC);
    var fb = audioCtx.createGain();

    input.connect(dry);
    dry.connect(out);
    input.connect(delay);
    // The delay feeding its own input is the whole effect: one tap that comes
    // round again at g times its own level, forever, until g^k stops mattering.
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(wet);
    wet.connect(out);

    echoNodes = { input: input, output: out, dry: dry, wet: wet, delay: delay, fb: fb };
    applyEcho();
    return echoNodes;
  }

  // Noise that dies away exponentially. A real room's impulse response has early
  // reflections with structure, then a diffuse tail; this only models the tail,
  // which is the part that reads as a room.
  //
  //   h[k] = r[k] * exp(-k * ln(1000) / (T * fs)),  r uniform in [-1, 1]
  //
  // The constant is what puts the amplitude exactly 60 dB down at k = T * fs.
  // Each channel gets its own noise, which is what makes the tail wide rather
  // than a single point between the speakers.
  function impulseResponse(seconds) {
    var sr = audioCtx.sampleRate;
    var n = Math.max(1, Math.round(seconds * sr));
    var ir = audioCtx.createBuffer(2, n, sr);
    var k = DECAY_LN / (seconds * sr);
    for (var c = 0; c < 2; c++) {
      var data = ir.getChannelData(c);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-k * i);
    }
    return ir;
  }

  function reverbStage() {
    if (revNodes || !audioCtx) return revNodes;
    var input = audioCtx.createGain();
    var out = audioCtx.createGain();
    var dry = audioCtx.createGain();
    var wet = audioCtx.createGain();
    var pre = audioCtx.createDelay(REV_MAX_PRE);
    var conv = audioCtx.createConvolver();

    input.connect(dry);
    dry.connect(out);
    // Pre-delay before the convolver, not baked into the impulse response: it is
    // the gap between the sound and the room answering, and holding it separate
    // means moving it does not cost a new response.
    input.connect(pre);
    pre.connect(conv);
    conv.connect(wet);
    wet.connect(out);

    revNodes = { input: input, output: out, dry: dry, wet: wet, pre: pre, conv: conv };
    refreshIr(true);
    applyReverb();
    return revNodes;
  }

  function echoTime() { return parseFloat(el['aud-echo-time'].value) / 1000; }
  function echoFeedback() { return parseFloat(el['aud-echo-fb'].value); }
  function echoMix() { return parseFloat(el['aud-echo-mix'].value); }
  function revDecay() { return parseFloat(el['aud-rev-decay'].value); }
  function revPre() { return parseFloat(el['aud-rev-pre'].value) / 1000; }
  function revMix() { return parseFloat(el['aud-rev-mix'].value); }

  function applyEcho() {
    if (!echoNodes) return;
    echoNodes.delay.delayTime.value = echoTime();
    echoNodes.fb.gain.value = echoFeedback();
    // A straight crossfade, so the two paths always sum to unity gain and the
    // track does not get louder as the effect is dialled in.
    echoNodes.wet.gain.value = echoMix();
    echoNodes.dry.gain.value = 1 - echoMix();
  }

  function applyReverb() {
    if (!revNodes) return;
    revNodes.pre.delayTime.value = revPre();
    revNodes.wet.gain.value = revMix();
    revNodes.dry.gain.value = 1 - revMix();
  }

  // Rebuilt only when the size actually changed, and never more than once every
  // IR_REBUILD_MS while a slider is moving.
  function refreshIr(now) {
    if (!revNodes || !audioCtx) return;
    var want = revDecay().toFixed(1) + '@' + audioCtx.sampleRate;
    if (want === irKey) return;
    if (irTimer) { clearTimeout(irTimer); irTimer = null; }
    if (!now) { irTimer = setTimeout(function() { irTimer = null; refreshIr(true); }, IR_REBUILD_MS); return; }
    irKey = want;
    try { revNodes.conv.buffer = impulseResponse(revDecay()); } catch (e) {}
  }

  function rebuildChain() {
    // The chain strip and the math are drawn from the switches, not from the
    // graph, so they are still right on a page where nothing has been loaded yet.
    if (!audioCtx) { renderChain(); renderMath(); return; }

    var stages = [];
    if (filterType) {
      if (!filterNode) filterNode = audioCtx.createBiquadFilter();
      filterNode.type = filterType.replace('-wide', '').replace('-narrow', '');
      filterNode.frequency.value = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
      filterNode.Q.value = filterQ();
      stages.push({ input: filterNode, output: filterNode });
    }
    if (echoOn) stages.push(echoStage());
    if (revOn) stages.push(reverbStage());

    // Everything that could be feeding the next stage, whether or not it is in
    // the chain this time round. A node left connected from a previous shape
    // would keep pouring into the analyser after its switch was turned off.
    [gainNode, filterNode, echoNodes && echoNodes.output, revNodes && revNodes.output, analyser]
      .forEach(function(node) { if (node) { try { node.disconnect(); } catch (e) {} } });

    var head = gainNode;
    stages.forEach(function(stage) {
      if (!stage) return;
      head.connect(stage.input);
      head = stage.output;
    });
    // The analyser sits at the end, so the spectrum and the note readout report
    // what is actually leaving the page rather than what went into the effects.
    head.connect(analyser);
    analyser.connect(audioCtx.destination);

    renderChain();
    renderMath();
  }

  // --- loading ---------------------------------------------------------------

  function resetTrackUi(name) {
    audioName = name;
    el['aud-name'].textContent = name;
    el['aud-drop'].classList.add('hidden');
    el['aud-player'].classList.remove('hidden');
    el['aud-shape'].classList.remove('hidden');
    el['aud-share'].classList.remove('hidden');
    el['aud-queue'].classList.remove('hidden');
    el['aud-duration'].textContent = '0:00';
    el['aud-current'].textContent = '0:00';
    el['aud-seek'].value = 0;
  }

  // `get` returns a promise for the raw bytes, so a local file and a shared clip
  // take the same path from here on. `autostart` is set when the track was not
  // chosen by a click on the play button: the end of the previous one, or a click
  // on a queue row while the queue was already playing.
  function loadBytes(get, name, label, autostart) {
    var token = ++loadToken;
    stopSource();
    bgRelease();
    audioBuffer = null;
    offsetSec = 0;
    // Tearing the track down settles any debt the door left owing on it.
    pausedByHide = false;
    setPlaying(false);
    txReset();
    resetTrackUi(name);
    el['aud-name'].textContent = name + '  (decoding\u2026)';

    ensureCtx();

    get().then(function(got) {
      if (token !== loadToken) return null;
      // Before the decode, which detaches the buffer it is given.
      bgAdopt(got.bytes, got.type);
      return new Promise(function(resolve, reject) {
        // Callback form kept as well: older Safari never returned a promise here.
        var ret = audioCtx.decodeAudioData(got.bytes, resolve, reject);
        if (ret && ret.then) ret.then(resolve, reject);
      });
    }).then(function(buf) {
      if (token !== loadToken || !buf) return;
      audioBuffer = buf;
      audioName = (queue[current] && queue[current].name) || name;
      el['aud-name'].textContent = audioName;
      el['aud-duration'].textContent = formatTime(buf.duration);
      el['aud-seek'].max = buf.duration;
      el['aud-seek'].step = 0.01;
      txAdopt(buf.duration);
      nowPlaying();
      // Through whichever transport suits where the page is: a track that ends
      // while Safari is in the background hands the next one straight to the
      // element rather than waking a context that cannot run.
      if (autostart) startPlayback(0);
    }).catch(function() {
      if (token !== loadToken) return;
      el['aud-name'].textContent = label === 'clip'
        ? 'This clip could not be loaded'
        : 'That file could not be decoded';
      el['aud-share-status'].textContent = 'Try a different MP3 or WAV.';
      clearNote();
    });
  }

  function loadFile(file, autostart) {
    loadBytes(function() {
      var type = file.type || '';
      if (file.arrayBuffer) {
        return file.arrayBuffer().then(function(bytes) { return { bytes: bytes, type: type }; });
      }
      return new Promise(function(resolve, reject) {
        var fr = new FileReader();
        fr.onload = function() { resolve({ bytes: fr.result, type: type }); };
        fr.onerror = function() { reject(fr.error); };
        fr.readAsArrayBuffer(file);
      });
    }, file.name, 'file', autostart);
  }

  function loadUrl(url, name, label, autostart) {
    var loading = queue[current];
    loadBytes(function() {
      return fetch(url).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        // The clip's own name, which is the only place a shared track's title is
        // kept. It arrives with the audio, so a row labelled from the hash gets
        // corrected here.
        var sent = r.headers.get('X-Clip-Name');
        if (sent) {
          try { renameEntry(loading, decodeURIComponent(sent)); } catch (e) {}
        }
        if (loading && r.headers.get('X-Clip-Locked')) {
          loading.locked = true;
          syncDanger();
        }
        var type = r.headers.get('Content-Type') || '';
        return r.arrayBuffer().then(function(bytes) { return { bytes: bytes, type: type }; });
      });
    }, name, label, autostart);
  }

  // --- transport core --------------------------------------------------------

  function rate() { return Math.pow(2, semitones / 12); }

  function position() {
    if (!audioBuffer) return 0;
    // While the element has the track, it is the clock.
    if (bgActive) return el['aud-bg'].currentTime || 0;
    if (!playing || !audioCtx) return offsetSec;
    var p = offsetSec + (audioCtx.currentTime - startedAt) * rate();
    return p < 0 ? 0 : (p > audioBuffer.duration ? audioBuffer.duration : p);
  }

  // --- handing the track to the element and back -----------------------------

  function bgRelease() {
    bgActive = false;
    var node = el['aud-bg'];
    try { node.pause(); } catch (e) {}
    try { node.removeAttribute('src'); node.load(); } catch (e) {}
    if (bgUrl) {
      try { URL.revokeObjectURL(bgUrl); } catch (e) {}
      bgUrl = null;
    }
  }

  // Called before decodeAudioData, which detaches the ArrayBuffer it is handed:
  // the Blob has to be taken from the bytes while they are still there.
  function bgAdopt(bytes, type) {
    bgRelease();
    try {
      bgUrl = URL.createObjectURL(new Blob([bytes], { type: type || 'audio/mpeg' }));
      el['aud-bg'].src = bgUrl;
    } catch (e) { bgUrl = null; }
  }

  // iOS will not let a media element begin playing unless that element has
  // played once from a real gesture, and the handoff happens on a
  // visibilitychange, which is not one. So the element is unlocked here instead,
  // on the click that starts the graph: a muted play, and a pause the moment it
  // is granted. Approval is per element and outlives the src, so once is enough.
  function bgPrime() {
    // Nothing to unlock where the element is never going to be asked to play:
    // a desktop tab would be spinning up the platform's media stack, and
    // decoding the blob a second time, for a handoff that will not happen.
    if (bgPrimed || !bgAllowed || !handoffNeeded || !bgUrl) return;
    var node = el['aud-bg'];
    bgPrimed = true;
    var undo = function() {
      // Unless the page left in the meantime and the element is now the one
      // playing the track for real.
      if (!bgActive) {
        try { node.pause(); node.currentTime = 0; } catch (e) {}
      }
      node.muted = false;
    };
    try {
      node.muted = true;
      var p = node.play();
      if (p && p.then) p.then(undo, function() { node.muted = false; bgPrimed = false; });
      else undo();
    } catch (e) {
      node.muted = false;
      bgPrimed = false;
    }
  }

  function bgSync() {
    var node = el['aud-bg'];
    try {
      node.volume = parseFloat(el['aud-volume'].value);
      node.playbackRate = rate();
      // Both spellings: pitch has to move with the rate, the way the buffer
      // source does it, and browsers default to preserving it.
      if ('preservesPitch' in node) node.preservesPitch = false;
      if ('webkitPreservesPitch' in node) node.webkitPreservesPitch = false;
    } catch (e) {}
  }

  function bgStart(sec) {
    if (!bgUrl) return false;
    var node = el['aud-bg'];
    bgActive = true;
    // An unlocking play from a moment ago may still be muted and waiting on its
    // promise; this is the real one.
    node.muted = false;
    bgSync();

    // A refused play leaves the page claiming to be playing something that is
    // not, so it is unwound rather than swallowed: the position it was asked
    // for becomes the paused position, which is where the graph resumes from.
    var failed = function() {
      bgActive = false;
      offsetSec = Math.max(0, sec || 0);
      setPlaying(false);
    };
    var go = function() {
      try { node.currentTime = Math.max(0, sec || 0); } catch (e) {}
      try {
        var p = node.play();

      } catch (e) { failed(); }

    if (node.readyState >= 1) go();
    else node.addEventListener('loadedmetadata', go, { once: true });

    return true;

  function bgStop() {
    if (!bgActive) return 0;
    var at = el['aud-bg'].currentTime || 0;
    bgActive = false;
    try { el['aud-bg'].pause(); } catch (e) {}
    return at;
  }

  // The one entry point the rest of the transport calls. The element only ever
  // gets the track on a hidden page that has asked to keep playing and cannot do
  // it on the graph; every other case is Web Audio, effects and all.
  function startPlayback(sec) {
    if (document.hidden && bgAllowed && handoffNeeded && bgUrl) { bgStart(sec); return; }
    startAt(sec);
  }

  function stopSource() {
    if (!bufSource) return;
    try { bufSource.onended = null; } catch (e) {}
    try { bufSource.stop(); } catch (e) {}
    try { bufSource.disconnect(); } catch (e) {}
    bufSource = null;
  }

  function startAt(sec) {
    if (!audioBuffer) return;
    ensureCtx();
    stopSource();

    offsetSec = Math.max(0, Math.min(sec, Math.max(0, audioBuffer.duration - 0.01)));
    bufSource = audioCtx.createBufferSource();
    bufSource.buffer = audioBuffer;
    bufSource.playbackRate.value = rate();
    bufSource.connect(gainNode);
    bufSource.onended = function() {
      // Only a natural end reaches here; stopSource clears the handler first.
      offsetSec = 0;
      bufSource = null;
      setPlaying(false);
      el['aud-seek'].value = 0;
      el['aud-current'].textContent = '0:00';
      // The context is already running by now, so the next track can start
      // without a fresh gesture.
      if (playThrough && current >= 0 && current < queue.length - 1) playIndex(current + 1, true);
    };
    startedAt = audioCtx.currentTime;
    bufSource.start(0, offsetSec);
    setPlaying(true);
  }

  function pausePlayback() {
    if (!playing) return;
    offsetSec = position();
    if (bgActive) bgStop();
    else stopSource();
    setPlaying(false);
  }

  function setPlaying(on) {
    playing = on;
    if (!on) clearNote();
    try {
      if (navigator.mediaSession) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
    } catch (e) {}
    nowPlayingPosition();
    el['aud-play-icon'].setAttribute('d', on ? PAUSE_PATH : PLAY_PATH);
    el['aud-play'].setAttribute('aria-label', on ? 'Pause' : 'Play');
    el['aud-play'].classList.toggle('is-on', on);
  }

  // --- the lock screen and the door ------------------------------------------

  // What the phone shows while the page is not the thing being looked at: the
  // track's name on the lock screen, and controls that reach this transport.
  // Also how iOS is told there is a media session here at all, which is the
  // difference between backgrounded audio and audio that is quietly stopped.
  function nowPlaying() {
    var ms = navigator.mediaSession;
    if (!ms) return;
    try {
      if (window.MediaMetadata) {
        ms.metadata = new window.MediaMetadata({
          title: audioName || 'Signal Share',
          artist: queue.length > 1
            ? 'Track ' + (current + 1) + ' of ' + queue.length
            : 'Signal Share'
        });
      }
    } catch (e) {}

    // Wrapped one at a time: a browser that knows the API can still refuse an
    // individual action, and one refusal should not cost the others.
    function on(action, run) {
      try { ms.setActionHandler(action, run); } catch (e) {}
    }
    on('play', function() { if (!playing) togglePlay(); });
    on('pause', function() { if (playing) pausePlayback(); });
    on('stop', stopPlayback);
    on('previoustrack', queue.length > 1 && current > 0
      ? function() { playIndex(current - 1, playing); } : null);
    on('nexttrack', queue.length > 1 && current < queue.length - 1
      ? function() { playIndex(current + 1, playing); } : null);
  }

  // Where the lock screen's own scrubber sits, and how fast it should be
  // running. The OS carries it forward on its own between these, so it is only
  // worth saying when the position jumps: a start, a seek, a stop.
  function nowPlayingPosition() {
    var ms = navigator.mediaSession;
    if (!ms || !ms.setPositionState || !audioBuffer) return;
    try {
      ms.setPositionState({
        duration: audioBuffer.duration,
        playbackRate: rate(),
        position: Math.max(0, Math.min(position(), audioBuffer.duration))
      });
    } catch (e) {}
  }

  // The element can be stopped by things that are not this page: the lock
  // screen, a phone call, another app taking the audio session. bgStop clears
  // bgActive before it pauses, so what reaches here is only ever somebody else's
  // decision, and the page had better agree with it rather than come back
  // claiming to be playing a track that stopped ten minutes ago.
  el['aud-bg'].addEventListener('pause', function() {
    var node = el['aud-bg'];
    if (!bgActive || node.ended) return;
    bgActive = false;
    offsetSec = node.currentTime || 0;
    setPlaying(false);
  });

  // The track ran out while the element had it. Play-through still applies, and
  // the next track will be handed straight back to the element, because
  // startPlayback asks where the page is rather than assuming.
  el['aud-bg'].addEventListener('ended', function() {
    if (!bgActive) return;
    bgActive = false;
    offsetSec = 0;
    setPlaying(false);
    if (playThrough && current >= 0 && current < queue.length - 1) playIndex(current + 1, true);
  });

  // The door. Three ways through it, one per line of the policy above, and one
  // rule that outranks all of them: nothing here starts audio that was not
  // already playing. Leaving a paused page leaves it paused.
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (!playing) return;

      // Asked not to follow them out.
      if (!bgAllowed) {
        pausePlayback();
        pausedByHide = true;
        return;
      }

      // The graph plays on by itself here, so the kindest handoff is none: no
      // gap, no unrouted track, no jump in level. Most browsers land on this.
      if (!handoffNeeded || bgActive || !bgUrl) return;

      var at = position();
      stopSource();
      // setPlaying is left alone on purpose: the transport is changing hands,
      // not stopping, and the button should read the same when the page returns.
      if (!bgStart(at)) {
        // No element to hand it to. Better to stop cleanly than to leave the
        // page claiming to play something that no longer is.
        offsetSec = at;
        setPlaying(false);
      }
      return;
    }

    // Back in. Whatever we stopped at the door, we start again.
    if (pausedByHide) {
      pausedByHide = false;
      if (!playing && audioBuffer) startPlayback(offsetSec);
      return;
    }

    if (!bgActive) {
      // Came back to a context iOS interrupted while nothing was handed over.
      if (audioCtx && audioCtx.state !== 'running' && audioCtx.resume) {
        try { audioCtx.resume(); } catch (e) {}
      }
      return;
    }

    var back = bgStop();
    offsetSec = back;
    if (playing) startAt(back);
  });

  // --- visualiser ------------------------------------------------------------

  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var rect = el['aud-canvas'].getBoundingClientRect();
    if (!rect.width) return;
    el['aud-canvas'].width = rect.width * dpr;
    el['aud-canvas'].height = rect.height * dpr;
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', sizeCanvas);

  // --- filter response -------------------------------------------------------
  //
  // The shape the filter is imposing, drawn over the spectrum on the same log
  // axis, so a dip in the curve sits directly above the bars it is taking out.
  // Ground truth comes from the node that is doing the filtering; before anything
  // has played there is no node to ask, and the cookbook coefficients stand in.

  var CURVE_DB_TOP = 18;    // headroom for a resonant low pass, which peaks well over 0
  var CURVE_DB_BOT = -42;
  var CURVE_N_LOG = 256;    // an even sweep of the whole axis
  var CURVE_N_TIGHT = 65;   // packed around f0, so a sharp notch is not stepped straight over.
                            // Odd, so the middle sample is f0 exactly and the null is drawn full depth
  var CURVE_N = CURVE_N_LOG + CURVE_N_TIGHT;

  var curveHz = new Float32Array(CURVE_N);
  var curveMag = new Float32Array(CURVE_N);
  var curvePhase = new Float32Array(CURVE_N);
  var curveDb = new Float32Array(CURVE_N);
  var curveX = new Float32Array(CURVE_N);   // the same points in pixels, worked out once a frame

  // Two ascending runs merged into one: the sweep, and a cluster either side of
  // f0. A notch 30 Hz wide would fall between two points of the sweep alone and
  // draw as a dimple instead of the hole it is.
  function buildCurveHz(f0, top) {
    var topLog = Math.log(top);
    // A context running slower than 40 kHz puts the top of the slider past its own
    // Nyquist. The cluster follows f0 only as far as the axis goes, or it would run
    // backwards and fold the curve over itself.
    var c = Math.min(Math.max(f0, F_MIN), top);
    var tLo = Math.max(F_MIN, c / 1.3);
    var tHi = Math.min(top, c * 1.3);
    var tLoLog = Math.log(tLo);
    var tSpan = Math.log(tHi) - tLoLog;
    var i = 0, j = 0, k = 0;
    while (k < CURVE_N) {
      var a = i < CURVE_N_LOG
        ? Math.exp(F_LOG_MIN + (i / (CURVE_N_LOG - 1)) * (topLog - F_LOG_MIN))
        : Infinity;
      var b = j < CURVE_N_TIGHT
        ? Math.exp(tLoLog + (j / (CURVE_N_TIGHT - 1)) * tSpan)
        : Infinity;
      if (a <= b) { curveHz[k++] = a; i++; } else { curveHz[k++] = b; j++; }
    }
  }

  function fillCurveDb() {
    var i;
    if (filterNode && filterNode.getFrequencyResponse) {
      try {
        filterNode.getFrequencyResponse(curveHz, curveMag, curvePhase);
        for (i = 0; i < CURVE_N; i++) {
          curveDb[i] = curveMag[i] > 0
            ? 20 * Math.log(curveMag[i]) / Math.LN10
            : CURVE_DB_BOT;
        }
        return;
      } catch (e) {}
    }
    var fs = sampleRate();
    var type = filterType.replace('-wide', '').replace('-narrow', '');
    var c = biquad(type, filterSliderToFreq(parseFloat(el['aud-filter-freq'].value)),
                   filterQ(), fs);
    for (i = 0; i < CURVE_N; i++) {
      var wn = 2 * Math.PI * curveHz[i] / fs;
      var c1 = Math.cos(wn), s1 = Math.sin(wn);
      var c2 = Math.cos(2 * wn), s2 = Math.sin(2 * wn);
      var nr = c.b0 + c.b1 * c1 + c.b2 * c2;
      var ni = c.b1 * s1 + c.b2 * s2;
      var dr = 1 + c.a1 * c1 + c.a2 * c2;
      var di = c.a1 * s1 + c.a2 * s2;
      var den = dr * dr + di * di;
      var m2 = den > 0 ? (nr * nr + ni * ni) / den : 0;
      curveDb[i] = m2 > 0 ? 10 * Math.log(m2) / Math.LN10 : CURVE_DB_BOT;
    }
  }

  // Read straight off the curve rather than from the analogue formula, so what is
  // marked is where this filter, warped onto this sample rate, really is 3 dB down.
  function bandEdges(w) {
    var out = [];
    for (var i = 1; i < CURVE_N; i++) {
      var a = curveDb[i - 1], b = curveDb[i];
      if ((a > -3) === (b > -3) || a === b) continue;
      // Interpolated in pixels rather than in hertz, because that is the spacing
      // the two samples either side of the crossing are actually evenly on.
      var t = (-3 - a) / (b - a);
      out.push(xToFreq(curveX[i - 1] + t * (curveX[i] - curveX[i - 1]), w));
      if (out.length === 2) break;
    }
    return out;
  }

  // Centred on what it is labelling, nudged inward by however wide it turns out
  // to be, so a marker at either end of the axis still reads.
  function curveLabel(text, x, yPos, w, rgba) {
    var half = ctx2d.measureText(text).width / 2 + 2;
    ctx2d.textAlign = 'center';
    ctx2d.fillStyle = rgba;
    ctx2d.fillText(text, Math.min(Math.max(x, half), w - half), yPos);
  }

  function drawFilterCurve(w, base, span) {
    var f0 = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
    var top = Math.min(F_MAX, (sampleRate() / 2) * 0.999);
    buildCurveHz(f0, top);
    fillCurveDb();

    var yTop = base - span;
    function y(db) {
      var t = (CURVE_DB_TOP - db) / (CURVE_DB_TOP - CURVE_DB_BOT);
      return yTop + (t < 0 ? 0 : t > 1 ? 1 : t) * span;
    }

    // The emphasis rides for a moment past the last move, so a drag reads bright
    // and then settles back behind the bars instead of snapping off mid-gesture.
    var since = Date.now() - filterTouched;
    var lift = since < 900 ? 1 : since < 1500 ? (1500 - since) / 600 : 0;
    var rgb = isLight ? '184,121,26' : '224,160,64';
    function amber(a) { return 'rgba(' + rgb + ',' + a.toFixed(3) + ')'; }

    var i;
    for (i = 0; i < CURVE_N; i++) curveX[i] = freqToX(curveHz[i], w);

    // Faint decades, because a log axis with nothing on it cannot be read.
    ctx2d.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx2d.textBaseline = 'bottom';
    [100, 1000, 10000].forEach(function(hz) {
      var gx = freqToX(hz, w);
      ctx2d.strokeStyle = amber(0.1 + lift * 0.06);
      ctx2d.lineWidth = 1;
      ctx2d.beginPath();
      ctx2d.moveTo(gx, yTop);
      ctx2d.lineTo(gx, base);
      ctx2d.stroke();
      curveLabel(formatFreqTick(hz), gx, base - 1, w, amber(0.38 + lift * 0.14));
    });

    // What survives the filter, as area under the curve.
    ctx2d.beginPath();
    ctx2d.moveTo(curveX[0], base);
    for (i = 0; i < CURVE_N; i++) ctx2d.lineTo(curveX[i], y(curveDb[i]));
    ctx2d.lineTo(curveX[CURVE_N - 1], base);
    ctx2d.closePath();
    ctx2d.fillStyle = amber(0.06 + lift * 0.09);
    ctx2d.fill();

    // The line the curve is read against.
    ctx2d.save();
    ctx2d.setLineDash([3, 4]);
    ctx2d.strokeStyle = amber(0.16 + lift * 0.2);
    ctx2d.lineWidth = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(0, y(0));
    ctx2d.lineTo(w, y(0));
    ctx2d.stroke();
    ctx2d.restore();

    // The curve itself.
    ctx2d.beginPath();
    for (i = 0; i < CURVE_N; i++) {
      if (i === 0) ctx2d.moveTo(curveX[0], y(curveDb[0]));
      else ctx2d.lineTo(curveX[i], y(curveDb[i]));
    }
    ctx2d.strokeStyle = amber(0.5 + lift * 0.45);
    ctx2d.lineWidth = lift > 0 ? 2.5 : 2;
    ctx2d.stroke();

    // f0, and for a band type the two edges the centre sits between. The lines
    // start below the numbers rather than running through them.
    var edges = FILTER_IS_BAND[filterType] ? bandEdges(w) : [];
    var markTop = yTop + (lift > 0 ? 13 : 0);
    ctx2d.save();
    ctx2d.setLineDash([2, 3]);
    ctx2d.strokeStyle = amber(0.2 + lift * 0.3);
    ctx2d.lineWidth = 1;
    edges.forEach(function(hz) {
      var ex = freqToX(hz, w);
      ctx2d.beginPath();
      ctx2d.moveTo(ex, markTop);
      ctx2d.lineTo(ex, base);
      ctx2d.stroke();
    });
    ctx2d.restore();

    var fx = freqToX(f0, w);
    ctx2d.strokeStyle = amber(0.35 + lift * 0.45);
    ctx2d.lineWidth = 1.5;
    ctx2d.beginPath();
    ctx2d.moveTo(fx, markTop);
    ctx2d.lineTo(fx, base);
    ctx2d.stroke();

    // Numbers only while the emphasis is up, so a curve left alone stays quiet.
    // All on one line: the edges of a narrow notch are a few pixels apart and
    // would print on top of each other, and the strip is 55px tall on a phone,
    // which is not enough for a second row that does not land on the curve.
    if (lift > 0) {
      ctx2d.textBaseline = 'top';
      var text = formatFilterFreq(f0);
      if (edges.length === 2) {
        text += '\u2002' + formatFreqTick(edges[0]) + '\u2013' + formatFreqTick(edges[1]);
      }
      curveLabel(text, fx, yTop + 1, w, amber(0.5 + lift * 0.5));
    }
    ctx2d.textAlign = 'left';
  }

  function draw() {
    var rect = el['aud-canvas'].getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;

    if (w && (el['aud-canvas'].width !== Math.round(w * (window.devicePixelRatio || 1)))) sizeCanvas();

    ctx2d.clearRect(0, 0, w, h);

    if (audioBuffer && playing) {
      var pos = position();
      el['aud-seek'].value = pos;
      el['aud-current'].textContent = formatTime(pos);
    }

    // The spectrum's own strip, hoisted because the filter curve shares it and is
    // drawn whether or not there is an analyser running behind it yet.
    var half = showWave && showFreq;
    var base = half ? h * 0.95 : h * 0.9;
    var span = half ? h * 0.5 : h * 0.75;

    if (analyser && w) {
      var bins = analyser.frequencyBinCount;

      if (showWave) {
        var time = new Uint8Array(bins);
        analyser.getByteTimeDomainData(time);
        var mid = half ? h * 0.28 : h * 0.5;
        var amp = (half ? h * 0.2 : h * 0.36);
        ctx2d.beginPath();
        for (var i = 0; i < bins; i++) {
          var y = mid + ((time[i] / 128) - 1) * amp;
          if (i === 0) ctx2d.moveTo(0, y);
          else ctx2d.lineTo((i / bins) * w, y);
        }
        ctx2d.strokeStyle = isLight ? 'rgba(34,160,80,0.85)' : 'rgba(100,220,140,0.85)';
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
      }

      if (showFreq) {
        var freq = new Uint8Array(bins);
        analyser.getByteFrequencyData(freq);
        var nyq = sampleRate() / 2;
        var bars = Math.min(bins, Math.max(24, Math.floor(w / 4)));
        var bw = w / bars;
        // Log spaced, like the slider and like the curve drawn over the top. A bar
        // now covers a range of bins rather than one, so it reports the loudest of
        // them; taking a single bin would drop peaks out of the wide bars up top.
        for (var j = 0; j < bars; j++) {
          var i0 = Math.floor(xToFreq(j * bw, w) / nyq * bins);
          var i1 = Math.ceil(xToFreq((j + 1) * bw, w) / nyq * bins);
          if (i0 >= bins) break;
          if (i1 <= i0) i1 = i0 + 1;
          if (i1 > bins) i1 = bins;
          var peak = 0;
          for (var k = i0; k < i1; k++) { if (freq[k] > peak) peak = freq[k]; }
          var v = peak / 255;
          var bh = v * span;
          ctx2d.fillStyle = isLight
            ? 'rgba(200,50,50,' + (0.25 + v * 0.55) + ')'
            : 'rgba(255,100,100,' + (0.25 + v * 0.55) + ')';
          ctx2d.fillRect(j * bw, base - bh, Math.max(bw - 1.5, 1), bh);
        }
      }
    }

    if (filterType && w) drawFilterCurve(w, base, span);

    // Autocorrelation is far too costly to run every frame, and a note readout that
    // updates faster than this is unreadable anyway.
    var now = Date.now();
    if (now - lastDetect > 120) {
      lastDetect = now;
      updateNote();
    }

    // Cheap every frame: the caption has to track the playhead exactly, and the
    // pump usually decides in a couple of comparisons that it has nothing to do.
    txFollow();
    txPump();

    requestAnimationFrame(draw);
  }

  // --- pitch -----------------------------------------------------------------
  //
  // Resampling, not a phase vocoder: playbackRate moves pitch and tempo together.
  // Browsers default to preserving pitch across a rate change, which would turn this
  // into a tempo control, so that has to be switched off on every element we make.

  function applyPitch() {
    var r = Math.pow(2, semitones / 12);
    el['aud-pitch-val'].textContent = (semitones > 0 ? '+' : '') + semitones + ' st';
    el['aud-pitch-rate'].textContent = r.toFixed(2) + '\u00d7 speed';
    if (bufSource) bufSource.playbackRate.value = r;
    bgSync();
    renderMath();
  }

  // The rebase has to happen while `semitones` still holds the old value, because
  // position() converts the elapsed stretch at whatever rate is current. Updating
  // the slider first and rebasing after re-times everything already played at the
  // new rate, which sends the clock racing ahead.
  function setSemitones(n) {
    if (audioCtx && playing) {
      offsetSec = position();
      startedAt = audioCtx.currentTime;
    }
    semitones = n;
    applyPitch();
  }

  el['aud-pitch'].addEventListener('input', function() {
    setSemitones(parseInt(el['aud-pitch'].value, 10) || 0);
  });

  el['aud-pitch-reset'].addEventListener('click', function() {
    el['aud-pitch'].value = '0';
    setSemitones(0);
  });

  // --- note detection --------------------------------------------------------
  //
  // Autocorrelation over the analyser's time-domain window, so it reports what is
  // actually coming out: after the filter, and after the pitch shift. Honest only on
  // roughly monophonic material, which the clarity gate below is there to enforce.

  var NOTE_MIN_HZ = 55;    // A1
  var NOTE_MAX_HZ = 2100;  // a little over C7
  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  function detectPitch(buf, sr) {
    var n = buf.length;
    var energy = 0;
    for (var i = 0; i < n; i++) energy += buf[i] * buf[i];
    if (!energy || Math.sqrt(energy / n) < 0.01) return null;

    var minLag = Math.max(2, Math.floor(sr / NOTE_MAX_HZ));
    var maxLag = Math.min(n - 3, Math.floor(sr / NOTE_MIN_HZ));
    if (maxLag <= minLag + 1) return null;

    // Raw autocorrelation, deliberately not divided by the overlap count. The
    // shrinking overlap makes the envelope fall away as the lag grows, and that
    // decay is what keeps the true period ahead of its own multiples. Normalising
    // by overlap flattens them into a tie, and the peak pick then lands on a
    // subharmonic: an A4 comes back as a B1 seven periods down.
    var acf = new Float32Array(maxLag + 2);
    for (var lag = 0; lag <= maxLag + 1; lag++) {
      var sum = 0;
      for (var j = 0; j < n - lag; j++) sum += buf[j] * buf[j + lag];
      acf[lag] = sum;
    }

    // Walk past the initial descent, or the answer is always lag zero.
    var d = 0;
    while (d < maxLag && acf[d] > acf[d + 1]) d++;

    var from = Math.max(d, minLag);
    var best = -Infinity;
    var bestLag = -1;
    for (var k = from; k <= maxLag; k++) {
      if (acf[k] > best) { best = acf[k]; bestLag = k; }
    }
    if (bestLag < 1) return null;

    // How periodic the window really is. Noise and dense polyphony fall well short.
    if (best / acf[0] < 0.4) return null;

    // Parabolic interpolation puts the peak between samples.
    var lagF = bestLag;
    var y1 = acf[bestLag - 1], y2 = acf[bestLag], y3 = acf[bestLag + 1];
    var denom = y1 + y3 - 2 * y2;
    if (denom) lagF = bestLag - (y3 - y1) / (2 * denom);

    var hz = sr / lagF;
    if (hz < NOTE_MIN_HZ || hz > NOTE_MAX_HZ) return null;
    return hz;
  }

  function noteFor(hz) {
    var midi = 69 + 12 * (Math.log(hz / 440) / Math.LN2);
    var nearest = Math.round(midi);
    return {
      name: NOTE_NAMES[((nearest % 12) + 12) % 12] + (Math.floor(nearest / 12) - 1),
      cents: Math.round((midi - nearest) * 100)
    };
  }

  function clearNote() {
    el['aud-note-name'].textContent = '\u2014';
    el['aud-note-hz'].textContent = 'no clear pitch';
    el['aud-note-cents'].textContent = '';
  }

  function updateNote() {
    if (!analyser || !playing) { clearNote(); return; }
    if (!detectBuf || detectBuf.length !== analyser.fftSize) {
      detectBuf = new Float32Array(analyser.fftSize);
    }
    analyser.getFloatTimeDomainData(detectBuf);

    var hz = detectPitch(detectBuf, audioCtx.sampleRate);
    if (!hz) { clearNote(); return; }

    var note = noteFor(hz);
    el['aud-note-name'].textContent = note.name;
    el['aud-note-hz'].textContent = hz.toFixed(1) + ' Hz';
    el['aud-note-cents'].textContent = (note.cents > 0 ? '+' : '') + note.cents + '\u00a2';
  }

  // --- transport -------------------------------------------------------------

  function togglePlay() {
    if (!audioBuffer) return;
    ensureCtx();
    if (playing) {
      pausedByHide = false;
      pausePlayback();
    } else {
      // Called from the play button and from the lock screen, both of which are
      // gestures as far as the element is concerned.
      bgPrime();
      startPlayback(offsetSec >= audioBuffer.duration - 0.02 ? 0 : offsetSec);
    }
  }

  el['aud-play'].addEventListener('click', togglePlay);

  function stopPlayback() {
    pausedByHide = false;
    if (bgActive) bgStop();
    else stopSource();
    offsetSec = 0;
    setPlaying(false);
    el['aud-seek'].value = 0;
    el['aud-current'].textContent = '0:00';
  }

  el['aud-stop'].addEventListener('click', stopPlayback);

  function seekTo(sec) {
    if (!audioBuffer) return;
    var to = Math.max(0, Math.min(sec, audioBuffer.duration));
    el['aud-seek'].value = to;
    el['aud-current'].textContent = formatTime(to);
    if (playing) startPlayback(to);
    else { offsetSec = to; nowPlayingPosition(); }
  }

  el['aud-seek'].addEventListener('input', function() {
    seekTo(parseFloat(el['aud-seek'].value) || 0);
  });

  // --- continue in the background --------------------------------------------
  //
  // A property of this browser on this device rather than of the sound, so it is
  // remembered here and stays out of the share link: what a listener wants a
  // background tab to do is not something the person who made the link decides.
  var BG_STORE = 'aud-background';

  function bgTipText() {
    if (!bgAllowed) return 'pauses when you switch away, and picks up where it left off';
    if (handoffNeeded) return 'keeps playing when you leave &middot; effects and the spectrum wait for you';
    return 'keeps playing when you switch tabs or lock the screen';
  }

  function setBackground(on, remember) {
    bgAllowed = !!on;
    el['aud-bg-on'].checked = bgAllowed;
    el['aud-bg-tip'].innerHTML = bgTipText();
    if (!bgAllowed) pausedByHide = false;
    if (remember) {
      try { window.localStorage.setItem(BG_STORE, bgAllowed ? '1' : '0'); } catch (e) {}
    }
  }

  el['aud-bg-on'].addEventListener('change', function() {
    setBackground(el['aud-bg-on'].checked, true);
    // Ticking it is itself a gesture, and the element may never get another one
    // before the page is put away.
    if (bgAllowed) bgPrime();
  });

  el['aud-volume'].addEventListener('input', function() {
    var v = parseFloat(el['aud-volume'].value);
    if (gainNode) gainNode.gain.value = v;
    bgSync();
    el['aud-vol-val'].textContent = Math.round(v * 100) + '%';
  });

  // --- filter ----------------------------------------------------------------

  // Both sliders keep their range and their stored value across a chip change, so
  // only the words around them move. A share link written before this still reads
  // back the same, because what is encoded is the raw slider position.
  function syncFilterLabels() {
    var type = filterType || 'lowpass';
    el['aud-filter-freq-name'].textContent = filterFreqLabel(type);
    el['aud-filter-q-name'].textContent = filterQLabel(type);
    el['aud-filter-freq-val'].textContent =
      formatFilterFreq(filterSliderToFreq(parseFloat(el['aud-filter-freq'].value)));
    el['aud-filter-q-val'].textContent = formatFilterQ(type, filterQ());
  }

  function setFilter(type) {
    var chips = el['aud-filters'].querySelectorAll('.aud-chip');
    filterType = (filterType === type) ? null : type;
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('is-on', chips[i].getAttribute('data-filter') === filterType);
    }
    el['aud-params'].classList.toggle('hidden', !filterType);
    if (filterType && FILTER_DEFAULT_Q[filterType] !== undefined) {
      el['aud-filter-q'].value = qValueToSlider(filterType, FILTER_DEFAULT_Q[filterType]);
    }
    syncFilterLabels();
    filterTouched = Date.now();
    rebuildChain();
  }

  (function wireFilterChips() {
    var chips = el['aud-filters'].querySelectorAll('.aud-chip');
    for (var i = 0; i < chips.length; i++) {
      (function(chip) {
        chip.addEventListener('click', function() { setFilter(chip.getAttribute('data-filter')); });
      })(chips[i]);
    }
  })();

  el['aud-filter-freq'].addEventListener('input', function() {
    var hz = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
    el['aud-filter-freq-val'].textContent = formatFilterFreq(hz);
    if (filterNode) filterNode.frequency.value = hz;
    filterTouched = Date.now();
    renderMath();
  });

  el['aud-filter-q'].addEventListener('input', function() {
    var q = filterQ();
    el['aud-filter-q-val'].textContent = formatFilterQ(filterType || 'lowpass', q);
    if (filterNode) filterNode.Q.value = q;
    filterTouched = Date.now();
    renderMath();
  });

  el['aud-view-wave'].addEventListener('click', function() {
    showWave = !showWave;
    el['aud-view-wave'].classList.toggle('is-on', showWave);
  });

  el['aud-view-freq'].addEventListener('click', function() {
    showFreq = !showFreq;
    el['aud-view-freq'].classList.toggle('is-on', showFreq);
  });

  // --- echo and reverb controls ----------------------------------------------

  function setEcho(on) {
    echoOn = on;
    el['aud-echo-on'].classList.toggle('is-on', echoOn);
    el['aud-echo-on'].setAttribute('aria-pressed', echoOn ? 'true' : 'false');
    el['aud-echo-params'].classList.toggle('hidden', !echoOn);
    rebuildChain();
  }

  function setReverb(on) {
    revOn = on;
    el['aud-rev-on'].classList.toggle('is-on', revOn);
    el['aud-rev-on'].setAttribute('aria-pressed', revOn ? 'true' : 'false');
    el['aud-rev-params'].classList.toggle('hidden', !revOn);
    rebuildChain();
  }

  el['aud-echo-on'].addEventListener('click', function() { setEcho(!echoOn); });
  el['aud-rev-on'].addEventListener('click', function() { setReverb(!revOn); });

  // Every effect slider does the same three things: relabel itself, push the
  // value at the graph, and let the readouts catch up.
  function wireParam(id, apply) {
    el[id].addEventListener('input', function() {
      apply();
      renderMath();
    });
  }

  wireParam('aud-echo-time', function() {
    el['aud-echo-time-val'].textContent = Math.round(echoTime() * 1000) + ' ms';
    applyEcho();
  });
  wireParam('aud-echo-fb', function() {
    el['aud-echo-fb-val'].textContent = echoFeedback().toFixed(2);
    applyEcho();
  });
  wireParam('aud-echo-mix', function() {
    el['aud-echo-mix-val'].textContent = Math.round(echoMix() * 100) + '%';
    applyEcho();
  });
  wireParam('aud-rev-decay', function() {
    el['aud-rev-decay-val'].textContent = revDecay().toFixed(1) + ' s';
    refreshIr(false);
  });
  wireParam('aud-rev-pre', function() {
    el['aud-rev-pre-val'].textContent = Math.round(revPre() * 1000) + ' ms';
    applyReverb();
  });
  wireParam('aud-rev-mix', function() {
    el['aud-rev-mix-val'].textContent = Math.round(revMix() * 100) + '%';
    applyReverb();
  });

  // --- the chain strip -------------------------------------------------------
  //
  // Every stage is drawn whether or not it is switched on, so the order is
  // visible before anything is pressed and a stage that is off reads as a gap in
  // a chain rather than as an absence.

  function renderChain() {
    var row = el['aud-chain'];
    if (!row) return;
    var stages = [
      { name: 'Track', on: true, fixed: true },
      { name: filterType ? FILTER_LABELS[filterType] : 'Filter', on: Boolean(filterType) },
      { name: 'Echo', on: echoOn },
      { name: 'Reverb', on: revOn },
      { name: 'Out', on: true, fixed: true }
    ];

    row.textContent = '';
    stages.forEach(function(stage, i) {
      if (i) {
        var arrow = document.createElement('span');
        arrow.className = 'aud-chain-arrow';
        arrow.textContent = '→';
        row.appendChild(arrow);
      }
      var node = document.createElement('span');
      node.className = 'aud-chain-node' +
        (stage.on ? ' is-on' : '') + (stage.fixed ? ' is-fixed' : '');
      node.textContent = stage.name;
      row.appendChild(node);
    });
  }

  // --- the math --------------------------------------------------------------
  //
  // Off by default and never carried in a share link: it is a reading aid for
  // whoever opened the page, not part of the sound, and a recipient should get
  // what the sender built rather than how they were looking at it.
  //
  // It reads like the caption under the visualiser rather than like a paper. One
  // short line per idea, each arriving a token at a time, because a panel that
  // drops six paragraphs of prose on a phone is a panel nobody reads. Everything
  // is derived from the same slider values the graph is running on, so it cannot
  // drift from what is being heard. Where the browser is the authority on a
  // number rather than a formula, the browser is asked.

  function sampleRate() { return audioCtx ? audioCtx.sampleRate : 44100; }

  // Thin spaces between the thousands: these are counts to be read at a glance,
  // and a comma inside a number sitting next to a comma between two of them is
  // a number misread.
  function grouped(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function signed(v, digits) {
    return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(digits);
  }

  // The cookbook the Web Audio biquad is specified in terms of. Q is read as
  // decibels for the low and high pass and as a plain ratio everywhere else,
  // which is a quirk of the original WebKit implementation that the spec kept.
  function biquad(type, f0, q, fs) {
    var w0 = 2 * Math.PI * f0 / fs;
    var cw = Math.cos(w0);
    var sw = Math.sin(w0);
    var dB = (type === 'lowpass' || type === 'highpass');
    var qLin = dB ? Math.pow(10, q / 20) : q;
    var alpha = sw / (2 * qLin);
    var b0, b1, b2;
    var a0 = 1 + alpha, a1 = -2 * cw, a2 = 1 - alpha;

    if (type === 'lowpass') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; }
    else if (type === 'highpass') { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = b0; }
    else if (type === 'bandpass') { b0 = alpha; b1 = 0; b2 = -alpha; }
    else { b0 = 1; b1 = -2 * cw; b2 = 1; }

    return {
      w0: w0, alpha: alpha, qLin: qLin, qIsDb: dB,
      // Divided through by a0, which is the form the difference equation runs in.
      b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0
    };
  }

  // Ground truth, straight out of the node that is actually filtering the audio.
  function responseDb(hz) {
    if (!filterNode || !filterNode.getFrequencyResponse) return null;
    try {
      var f = new Float32Array([hz]);
      var mag = new Float32Array(1);
      var phase = new Float32Array(1);
      filterNode.getFrequencyResponse(f, mag, phase);
      if (!isFinite(mag[0]) || mag[0] <= 0) return null;
      return 20 * Math.log(mag[0]) / Math.LN10;
    } catch (e) { return null; }
  }

  // How many repeats of an echo are left above -60 dB. g^k = 10^-3 solves to
  // k = 3 / log10(1/g), and a feedback of zero means the one tap and nothing after.
  function echoRepeats(g) {
    if (g <= 0) return 1;
    if (g >= 1) return Infinity;
    return Math.ceil(3 / (Math.log(1 / g) / Math.LN10));
  }

  // The whole panel, as a flat list of short lines. A `tag` line is a stage
  // heading; everything else is one statement. Keys are stable across renders,
  // which is what lets a slider update the numbers in place rather than making
  // the panel flicker through its whole entrance again on every frame of a drag.
  function mathLines() {
    var fs = sampleRate();
    var lines = [];
    function add(key, text, tag) { lines.push({ key: key, text: text, tag: Boolean(tag) }); }

    var on = [];
    if (filterType) on.push('H<sub>flt</sub>(z)');
    if (echoOn) on.push('H<sub>echo</sub>(z)');
    if (revOn) on.push('H<sub>rev</sub>(z)');

    if (!on.length) {
      add('idle', 'y[n] = x[n]');
      add('fs', 'f<sub>s</sub> = ' + grouped(fs) + ' Hz');
      return lines;
    }

    // Stacking, stated once: every stage is linear and time invariant, so the
    // chain is one filter and the order it is wired in cannot matter.
    add('chain', 'H(z) = ' + on.join(' &middot; '));
    add('fs', 'f<sub>s</sub> = ' + grouped(fs) + ' Hz');

    if (filterType) {
      var type = filterType.replace('-wide', '').replace('-narrow', '');
      var f0 = filterSliderToFreq(parseFloat(el['aud-filter-freq'].value));
      var q = filterQ();
      var c = biquad(type, f0, q, fs);
      var atCut = responseDb(f0);

      add('t-flt', FILTER_LABELS[filterType], true);
      add('flt-y', 'y[n] = b<sub>0</sub>x[n] + b<sub>1</sub>x[n−1] + b<sub>2</sub>x[n−2] − a<sub>1</sub>y[n−1] − a<sub>2</sub>y[n−2]');
      add('flt-w', 'ω<sub>0</sub> = 2πf<sub>0</sub>/f<sub>s</sub> = ' + c.w0.toFixed(5));
      add('flt-a', 'α = sin ω<sub>0</sub> / ' +
        (c.qIsDb ? '2&middot;10<sup>Q/20</sup>' : '2Q') + ' = ' + c.alpha.toFixed(5));
      add('flt-b', 'b = [ ' + [c.b0, c.b1, c.b2].map(function(v) { return signed(v, 5); }).join(', ') + ' ]');
      add('flt-ab', 'a = [ +1.00000, ' + [c.a1, c.a2].map(function(v) { return signed(v, 5); }).join(', ') + ' ]');
      if (atCut !== null) add('flt-h', '|H(f<sub>0</sub>)| = ' + signed(atCut, 1) + ' dB');
    }

    if (echoOn) {
      var tau = echoTime();
      var g = echoFeedback();
      var m = echoMix();
      var repeats = echoRepeats(g);

      add('t-echo', 'Echo', true);
      add('echo-w', 'w[n] = x[n−D] + g&middot;w[n−D]');
      add('echo-y', 'y[n] = (1−m)x[n] + m&middot;w[n]');
      add('echo-d', 'D = τf<sub>s</sub> = ' + grouped(tau * fs) + ' samples');
      add('echo-g', 'g = ' + g.toFixed(2) + ', m = ' + m.toFixed(2));
      add('echo-t', g <= 0
        ? 'one repeat, then nothing'
        : 'g<sup>k</sup> &lt; −60 dB after ' + repeats + ' repeats, ' + (repeats * tau).toFixed(1) + ' s');
      add('echo-c', 'comb teeth every 1/τ = ' + (1 / tau).toFixed(2) + ' Hz');
    }

    if (revOn) {
      var t = revDecay();
      var pre = revPre();
      var rm = revMix();
      var n = t * fs;

      add('t-rev', 'Reverb', true);
      add('rev-h', 'h[k] = r[k]&middot;e<sup>−k&middot;ln1000/Tf<sub>s</sub></sup>');
      add('rev-y', 'y[n] = (1−m)x[n] + m&middot;Σ h[k]x[n−k−P]');
      add('rev-n', 'N = Tf<sub>s</sub> = ' + grouped(n) + ' taps');
      add('rev-p', 'P = ' + grouped(pre * fs) + ' samples, m = ' + rm.toFixed(2));
      add('rev-c', (n * fs / 1e9).toFixed(1) + ' billion mul–adds a second, so: FFT');
    }

    if (semitones) {
      var r = Math.pow(2, semitones / 12);
      add('t-pitch', 'Pitch', true);
      add('pitch-r', 'r = 2<sup>n/12</sup> = ' + r.toFixed(4));
      add('pitch-f', 'f → ' + r.toFixed(4) + 'f, and the clock with it');
    }

    return lines;
  }

  // What is on screen, so the next render can tell a new line from a line whose
  // numbers moved.
  var mathShown = [];

  // Split on plain spaces only, and never inside a tag: the markup carries
  // subscripts, and half of a <sub> is not a token. \s is deliberately not used
  // here -- it matches the thin space that groups the thousands, which would cut
  // 14 112 into two tokens and reveal a number in halves.
  function mathTokens(html) {
    return html.split(/ +(?![^<]*>)/).filter(function(t) { return t; });
  }

  function mathLineEl(line, at) {
    var row = document.createElement('p');
    row.className = line.tag ? 'aud-math-line is-tag' : 'aud-math-line';

    mathTokens(line.text).forEach(function(tok, k) {
      var span = document.createElement('span');
      span.className = 'aud-math-w';
      span.innerHTML = (k ? ' ' : '') + tok;
      // Staggered the way the caption stages its words, by delaying the ink
      // rather than the element: every line is laid out at once, so nothing
      // reflows as the rest of it arrives.
      span.style.transitionDelay = Math.min(at * 55 + k * 24, 1400) + 'ms';
      row.appendChild(span);
    });
    return row;
  }

  // A slider moved but the shape of the panel did not, so only the tokens whose
  // text actually changed are rewritten, and they are lit briefly instead of
  // being faded in from nothing. Re-running the entrance on every input event
  // would make a drag strobe.
  function mathPatch(row, line) {
    var spans = row.querySelectorAll('.aud-math-w');
    var toks = mathTokens(line.text);
    if (spans.length !== toks.length) return false;

    for (var i = 0; i < toks.length; i++) {
      var want = (i ? ' ' : '') + toks[i];
      if (spans[i].innerHTML === want) continue;
      spans[i].innerHTML = want;
      (function(node) {
        node.classList.add('is-hot');
        setTimeout(function() { node.classList.remove('is-hot'); }, 320);
      })(spans[i]);
    }
    return true;
  }

  function renderMath() {
    var host = el['aud-math'];
    if (!host) return;

    host.classList.toggle('hidden', !mathOn);
    // Emptied rather than merely hidden, so a closed panel is not sitting on a
    // stale set of numbers that would flash before the next rebuild.
    if (!mathOn) { host.textContent = ''; mathShown = []; return; }

    var lines = mathLines();
    var rows = host.querySelectorAll('.aud-math-line');

    // Same lines in the same order: patch the numbers where they moved.
    var same = rows.length === lines.length && mathShown.length === lines.length;
    for (var i = 0; same && i < lines.length; i++) {
      if (mathShown[i].key !== lines[i].key) same = false;
    }
    if (same) {
      for (var j = 0; j < lines.length; j++) {
        if (!mathPatch(rows[j], lines[j])) { same = false; break; }
      }
      if (same) { mathShown = lines; return; }
    }

    host.textContent = '';
    lines.forEach(function(line, at) { host.appendChild(mathLineEl(line, at)); });
    mathShown = lines;

    // One frame later, so the browser has the un-inked state to transition from.
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(function() {
        var fresh = host.querySelectorAll('.aud-math-w');
        for (var k = 0; k < fresh.length; k++) fresh[k].classList.add('is-in');
      });
    } else {
      var fresh = host.querySelectorAll('.aud-math-w');
      for (var k = 0; k < fresh.length; k++) fresh[k].classList.add('is-in');
    }
  }

  el['aud-math-on'].addEventListener('change', function() {
    mathOn = el['aud-math-on'].checked;
    renderMath();
  });


  // --- the queue -------------------------------------------------------------
  //
  // One track used to be the whole app state. It is now one entry in a list, and
  // the list is what a link carries. An entry is only shareable once it has a
  // `ref`: local files get one when a share uploads them.

  function clipIdOf(entry) {
    return entry && entry.ref && entry.ref.indexOf('clip:') === 0 ? entry.ref.slice(5) : null;
  }

  // Uploaded tracks only. The demo is not a clip and has no id to delete.
  function uploadedIds() {
    var ids = [];
    queue.forEach(function(entry) {
      var id = clipIdOf(entry);
      if (id && ids.indexOf(id) < 0) ids.push(id);
    });
    return ids;
  }

  function srcOf(entry) {
    if (!entry) return null;
    if (entry.ref === 'demo') return DEMO_SRC;
    var id = clipIdOf(entry);
    return id ? CLIP_API + '/clip/' + id : null;
  }

  function newEntry(fields) {
    return {
      ref: fields.ref || null,
      name: fields.name || '',
      file: fields.file || null,
      // Whether deleting this clip will ask for a password. Learned from the
      // upload's own reply, or from the clip's headers on a restored playlist.
      locked: Boolean(fields.locked),
      tx: null
    };
  }

  function playIndex(i, autostart) {
    if (i < 0 || i >= queue.length) return;
    current = i;
    var entry = queue[i];
    renderQueue();
    if (entry.file) {
      loadFile(entry.file, autostart);
    } else {
      var src = srcOf(entry);
      if (!src) return;
      loadUrl(src, entry.name || 'Shared track', entry.ref === 'demo' ? 'demo' : 'clip', autostart);
    }
  }

  // The name a track is finally known by: from the file, from the clip's stored
  // metadata, or from the upload's reply. Addressed by entry rather than by index,
  // because the answer can arrive after the listener has moved on.
  function renameEntry(entry, name) {
    if (!entry || !name || entry.name === name) return;
    entry.name = name;
    if (entry === queue[current]) {
      audioName = name;
      if (audioBuffer) el['aud-name'].textContent = name;
    }
    renderQueue();
  }

  function addTracks(entries, playFirst) {
    if (!entries.length) return;
    var room = MAX_QUEUE - queue.length;
    if (room <= 0) {
      el['aud-share-status'].textContent = 'A playlist holds ' + MAX_QUEUE + ' tracks.';
      return;
    }
    var dropped = entries.length - room;
    var added = entries.slice(0, room);
    var at = queue.length;
    queue = queue.concat(added);
    resetShare();
    if (dropped > 0) {
      el['aud-share-status'].textContent = 'A playlist holds ' + MAX_QUEUE +
        ' tracks, so ' + dropped + ' did not fit.';
    }
    if (playFirst || current < 0) playIndex(at, playFirst && playing);
    else renderQueue();
  }

  function removeAt(i) {
    if (i < 0 || i >= queue.length) return;
    var wasCurrent = i === current;
    var wasPlaying = playing;
    queue.splice(i, 1);
    resetShare();

    if (!queue.length) {
      current = -1;
      resetToEmpty();
      return;
    }
    if (wasCurrent) {
      // Whatever slid into this slot, or the new last track if the end went.
      playIndex(Math.min(i, queue.length - 1), wasPlaying);
      return;
    }
    if (i < current) current -= 1;
    renderQueue();
  }

  function moveAt(i, delta) {
    var to = i + delta;
    if (i < 0 || i >= queue.length || to < 0 || to >= queue.length) return;
    var held = queue[i];
    queue[i] = queue[to];
    queue[to] = held;
    if (current === i) current = to;
    else if (current === to) current = i;
    resetShare();
    renderQueue();
  }

  function resetToEmpty() {
    stopSource();
    bgRelease();
    audioBuffer = null;
    offsetSec = 0;
    // Tearing the track down settles any debt the door left owing on it.
    pausedByHide = false;
    setPlaying(false);
    txReset();
    loadToken++;
    el['aud-drop'].classList.remove('hidden');
    ['aud-player', 'aud-shape', 'aud-share', 'aud-queue'].forEach(function(id) {
      el[id].classList.add('hidden');
    });
    el['aud-shared-note'].classList.add('hidden');
    renderQueue();
  }

  function tagFor(entry) {
    if (entry.ref === 'demo') return 'demo';
    if (clipIdOf(entry)) return 'shared';
    return 'on this device';
  }

  // Built with the DOM rather than a template string: a row carries a filename
  // the visitor chose, and that is not text to hand to innerHTML.
  function queueRow(entry, i) {
    var li = document.createElement('li');
    li.className = 'aud-q-item' + (i === current ? ' is-current' : '');

    var pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'aud-q-pick';
    pick.addEventListener('click', function() { playIndex(i, playing); });

    var n = document.createElement('span');
    n.className = 'aud-q-n';
    n.textContent = String(i + 1);
    var name = document.createElement('span');
    name.className = 'aud-q-name';
    name.textContent = entry.name || 'Untitled track';
    var tag = document.createElement('span');
    tag.className = 'aud-q-tag';
    tag.textContent = tagFor(entry);
    pick.appendChild(n);
    pick.appendChild(name);
    pick.appendChild(tag);

    var tools = document.createElement('span');
    tools.className = 'aud-q-tools';
    [
      { label: 'Move "' + (entry.name || 'track') + '" up', glyph: '↑', run: function() { moveAt(i, -1); }, off: i === 0 },
      { label: 'Move "' + (entry.name || 'track') + '" down', glyph: '↓', run: function() { moveAt(i, 1); }, off: i === queue.length - 1 },
      { label: 'Remove "' + (entry.name || 'track') + '"', glyph: '×', run: function() { removeAt(i); }, off: false }
    ].forEach(function(spec) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'aud-q-btn';
      b.textContent = spec.glyph;
      b.setAttribute('aria-label', spec.label);
      b.disabled = spec.off;
      b.addEventListener('click', spec.run);
      tools.appendChild(b);
    });

    li.appendChild(pick);
    li.appendChild(tools);
    return li;
  }

  function renderQueue() {
    var list = el['aud-q-list'];
    list.textContent = '';
    queue.forEach(function(entry, i) { list.appendChild(queueRow(entry, i)); });

    el['aud-q-count'].textContent = queue.length
      ? queue.length + (queue.length === 1 ? ' track' : ' tracks') + ' of ' + MAX_QUEUE
      : '';

    var many = queue.length > 1;
    el['aud-prev'].classList.toggle('hidden', !many);
    el['aud-next'].classList.toggle('hidden', !many);
    el['aud-prev'].disabled = current <= 0;
    el['aud-next'].disabled = current < 0 || current >= queue.length - 1;

    // Offered whenever the queue holds something that is actually in the bucket,
    // which includes a playlist someone else shared: the link is the permission,
    // so the recipient gets the same button the sharer has.
    syncDanger();
  }

  // A clip knows its own name, so a restored playlist can label every row before
  // any of them is played. One HEAD per track, and the Worker answers those from
  // metadata without reading the audio.
  function labelClips() {
    queue.forEach(function(entry, i) {
      var id = clipIdOf(entry);
      if (!id) return;
      // The same HEAD answers both questions, so it is worth making even for a
      // track that already has a name: whether the delete button is going to ask
      // for a password is not something to discover by pressing it.
      if (!entry.name) entry.name = 'Shared track ' + (i + 1);
      fetch(CLIP_API + '/clip/' + id, { method: 'HEAD' }).then(function(r) {
        if (!r.ok) return;
        var sent = r.headers.get('X-Clip-Name');
        if (sent) renameEntry(entry, decodeURIComponent(sent));
        if (r.headers.get('X-Clip-Locked')) {
          entry.locked = true;
          syncDanger();
        }
      }).catch(function() {});
    });
    renderQueue();
  }

  el['aud-prev'].addEventListener('click', function() {
    if (current > 0) playIndex(current - 1, playing);
  });

  el['aud-next'].addEventListener('click', function() {
    if (current >= 0 && current < queue.length - 1) playIndex(current + 1, playing);
  });

  el['aud-q-through'].addEventListener('change', function() {
    playThrough = el['aud-q-through'].checked;
  });

  el['aud-q-demo'].addEventListener('click', function() {
