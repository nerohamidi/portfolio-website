      return resp.json().catch(function() { return {}; }).then(function(data) {
        if (!resp.ok) throw new Error(data.error || 'Upload failed.');
        return data;
      });
    });
  }

  function resetShare() {
    el['aud-share-out'].classList.add('hidden');
    el['aud-share-status'].textContent = '';
  }

  // --- deleting from the bucket ---
  //
  // The clip id in a share link is the whole permission. It is 128 random bits, so
  // it cannot be arrived at by guessing, and anyone the link reached can take the
  // tracks down. That is deliberate, and the note beside the button says so: a link
  // handed on is a link that can delete.

  var delArmed = false;
  // The preview card wrapping the current link, if one was made or arrived in a
  // link. Deleting takes it down with the audio: a card that outlived its tracks
  // would keep advertising a playlist that is not there.
  var shareId = null;

  function anyLocked() {
    for (var i = 0; i < queue.length; i++) {
      if (clipIdOf(queue[i]) && queue[i].locked) return true;
    }
    return false;
  }

  function syncDanger() {
    var any = uploadedIds().length > 0 || Boolean(shareId);
    el['aud-danger'].classList.toggle('hidden', !any);

    // Shown before the button is pressed rather than after it is refused: being
    // told a password is needed by a failure is a worse way to learn it.
    var locked = anyLocked() || Boolean(sharePassword());
    el['aud-del-pass'].classList.toggle('hidden', !locked);

    syncLockField();
    if (!any) disarmDelete();
  }

  // A lock is fixed when the clip is written, so the field closes as soon as
  // anything in the queue is up. Letting it be typed afterwards would promise a
  // protection the next delete would not honour — and letting it be *changed*
  // afterwards would let whoever holds the link lock the uploader out of their
  // own clip, which is worse than the open delete it was meant to fix.
  function syncLockField() {
    var uploaded = uploadedIds().length > 0;
    el['aud-share-pass'].disabled = uploaded;
    if (!uploaded) {
      el['aud-lock-hint'].textContent = 'Without one, anyone holding the link can take the tracks ' +
        'down. Set it before you make the link \u2014 it cannot be added afterwards, and it cannot ' +
        'be recovered. Either way everything expires after ' + clipTtlDays + ' days.';
    } else if (anyLocked()) {
      el['aud-lock-hint'].textContent = 'These tracks are password protected. Deleting them asks ' +
        'for it, and nothing can change it now they are up.';
    } else {
      el['aud-lock-hint'].textContent = 'These tracks are already uploaded, so a password can no ' +
        'longer be attached to them. Delete them and share again to set one.';
    }
  }

  function disarmDelete() {
    delArmed = false;
    el['aud-del-btn'].textContent = 'Delete from the cloud';
    el['aud-del-btn'].classList.remove('is-armed');
  }

  // Answers with why, not just whether: a delete refused for want of a password
  // is the one failure the page can do something about, and it has to be told
  // apart from a clip that is simply gone.
  function deleteAt(url, pass) {
    var headers = {};
    if (pass) headers['X-Clip-Lock'] = pass;
    return fetch(url, { method: 'DELETE', headers: headers }).then(function(resp) {
      // A clip that is already gone counts as done. Someone else may have deleted
      // it from the same link, and reporting that as a failure would only invite a
      // pointless retry.
      if (resp.ok || resp.status === 404) return { ok: true };
      var locked = resp.status === 401 || resp.status === 403;
      return resp.json().catch(function() { return {}; }).then(function(data) {
        return { ok: false, locked: locked, error: data.error || '' };
      });
    }).catch(function() { return { ok: false, locked: false, error: '' }; });
  }

  function deleteClip(id, pass) {
    return deleteAt(CLIP_API + '/clip/' + id, pass).then(function(r) {
      r.id = id;
      return r;
    });
  }

  el['aud-del-btn'].addEventListener('click', function() {
    var ids = uploadedIds();
    if (!ids.length && !shareId) return;

    // Two presses rather than a confirm() dialog, which blocks the page and cannot
    // be styled. The button says what the second press does.
    if (!delArmed) {
      delArmed = true;
      el['aud-del-btn'].textContent = ids.length
        ? 'Really delete ' + ids.length + (ids.length === 1 ? ' track?' : ' tracks?')
        : 'Really delete this link?';
      el['aud-del-btn'].classList.add('is-armed');
      el['aud-del-note'].textContent = 'This cannot be undone. Press again to confirm.';
      return;
    }

    // Whoever made the link typed the password in the share panel a moment ago;
    // asking them to type it a second time to undo their own work is friction for
    // nothing. A recipient has only the field beside the button.
    var pass = el['aud-del-pass'].value || sharePassword();

    el['aud-del-btn'].disabled = true;
    el['aud-del-btn'].textContent = 'Deleting\u2026';

    var jobs = ids.map(function(id) { return deleteClip(id, pass); });
    // The card goes with the tracks, and asks for the same password.
    var card = shareId;
    if (card) jobs.push(deleteAt(CLIP_API + '/share/' + card, pass));

    Promise.all(jobs).then(function(results) {
      var clips = results.slice(0, ids.length);
      var cardResult = card ? results[results.length - 1] : null;
      var gone = clips.filter(function(r) { return r.ok; }).length;
      var refused = results.filter(function(r) { return r.locked; });

      el['aud-del-btn'].disabled = false;
      disarmDelete();

      // Nothing moved, and the password is the whole reason. Refs are kept: the
      // tracks are demonstrably still up, and the link still opens them.
      if (refused.length && !gone) {
        el['aud-del-pass'].classList.remove('hidden');
        el['aud-del-pass'].focus();
        el['aud-share-status'].textContent = refused[0].error || 'That link is password protected.';
        el['aud-del-note'].textContent = pass
          ? 'That password does not match. Everything is still up.'
          : 'Enter the password that was set when this link was made.';
        return;
      }

      // Refs are dropped for everything that is no longer there, whether it was
      // deleted just now or was already gone. A ref that no longer resolves would
      // otherwise be written into the next share link and hand out a track that
      // is not there. A clip that refused the password keeps its ref, because it
      // is still up and its link still works.
      var kept = {};
      clips.forEach(function(r) { if (!r.ok && r.locked) kept[r.id] = true; });
      queue.forEach(function(entry) {
        var id = clipIdOf(entry);
        if (id && !kept[id]) { entry.ref = null; entry.file = null; entry.locked = false; }
      });
      if (!cardResult || cardResult.ok) shareId = null;

      resetShare();
      renderQueue();

      el['aud-share-status'].textContent = !ids.length
        ? 'That link is dead now.'
        : (gone === ids.length
          ? (ids.length === 1 ? 'Deleted. That link is dead now.' : 'Deleted all ' + gone + '. Those links are dead now.')
          : 'Deleted ' + gone + ' of ' + ids.length + '. Try again for the rest.');
      el['aud-del-note'].textContent =
        'The tracks are still loaded here, and can be shared again.';
    });
  });

  function showLink(url, hash) {
    el['aud-share-link'].value = url;
    el['aud-share-out'].classList.remove('hidden');
    el['aud-share-link'].focus();
    el['aud-share-link'].select();
    // The hash, not the card's URL: the address bar should keep showing the state
    // this page is actually in, which is also what makes a reload survive.
    history.replaceState(null, '', '#' + hash);
  }

  var clipTtlDays = 30;

  // The link a share hands over.
  //
  // With no title and no note it is this page's own URL with the state in its
  // hash: nothing is stored, nothing expires beyond the clips themselves.
  //
  // With either, it is a card on the Worker instead. A fragment is never sent to
  // a server, so a static page cannot put the sender's words into its own meta
  // tags, and a plain link therefore previews in iMessage or Slack as whatever
  // the page says about itself and nothing more. The card is a real document with
  // og:title and og:description on it that forwards straight on to the same hash,
  // so the preview is the only thing it adds.
  //
  // If the card cannot be made, the plain link is handed over instead. Losing the
  // preview is worth saying; it is not worth withholding a working link over.
  function finishShare(okText) {
    var hash = encodeState();
    var plain = location.origin + location.pathname + '#' + hash;
    var title = shareTitle();
    var note = shareNote();

    if (!title && !note) {
      shareId = null;
      showLink(plain, hash);
      el['aud-share-status'].textContent = okText;
      syncDanger();
      return;
    }

    el['aud-share-status'].textContent = 'Making the preview card\u2026';

    var headers = { 'Content-Type': 'application/json' };
    var pass = sharePassword();
    if (pass) headers['X-Clip-Lock'] = pass;

    fetch(CLIP_API + '/share', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ hash: hash, title: title, note: note })
    }).then(function(resp) {
      return resp.json().catch(function() { return {}; }).then(function(data) {
        if (!resp.ok || !data.url) throw new Error(data.error || 'Could not make the preview card.');
        return data;
      });
    }).then(function(data) {
      shareId = data.id;
      showLink(data.url, hash);
      el['aud-share-status'].textContent = okText + ' It previews with your title and note.';
      syncDanger();
    }).catch(function(err) {
      shareId = null;
      showLink(plain, hash);
      el['aud-share-status'].textContent = (err.message || 'Could not make the preview card.') +
        ' The link below still works, without the preview.';
      syncDanger();
    });
  }

  // One at a time. The upload route is rate limited per minute, and a browser
  // firing ten parallel uploads is exactly the shape that limit exists to stop.
  function uploadRest(pending, at) {
    if (at >= pending.length) {
      el['aud-share-btn'].disabled = false;
      renderQueue();
      finishShare('Ready. This link works for ' + clipTtlDays + ' days.');
      return;
    }

    el['aud-share-status'].textContent = pending.length > 1
      ? 'Uploading ' + (at + 1) + ' of ' + pending.length + '\u2026'
      : 'Uploading your track\u2026';

    uploadClip(pending[at].file).then(function(data) {
      pending[at].ref = 'clip:' + data.id;
      pending[at].file = null;
      pending[at].locked = Boolean(data.locked);
      if (data.expiresInDays) clipTtlDays = data.expiresInDays;
      if (data.name) renameEntry(pending[at], data.name);
      renderQueue();
      uploadRest(pending, at + 1);
    }).catch(function(err) {
      el['aud-share-btn'].disabled = false;
      renderQueue();
      // Whatever went up already keeps its ref, so a retry only sends the rest.
      el['aud-share-status'].textContent = (err.message || 'Upload failed.') +
        (at ? ' The ' + at + ' before it are already uploaded.' : '');
    });
  }

  el['aud-share-btn'].addEventListener('click', function() {
    var pending = queue.filter(function(entry) { return entry.file && !entry.ref; });

    if (!pending.length) {
      if (!queue.length) return;
      finishShare(queue.length > 1
        ? 'Anyone who opens this gets all ' + queue.length + ' tracks with your settings.'
        : (queue[0].ref === 'demo'
          ? 'Anyone who opens this hears the demo with your settings.'
          : 'Link copied to the box below.'));
      return;
    }

    el['aud-share-btn'].disabled = true;
    uploadRest(pending, 0);
  });

  el['aud-share-copy'].addEventListener('click', function() {
    el['aud-share-link'].select();
    function ok() { el['aud-share-status'].textContent = 'Copied.'; }
    function fallback() { try { document.execCommand('copy'); ok(); } catch (e) {} }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el['aud-share-link'].value).then(ok, fallback);
    } else {
      fallback();
    }
  });

  // --- boot ------------------------------------------------------------------

  el['aud-vol-val'].textContent = Math.round(parseFloat(el['aud-volume'].value) * 100) + '%';
  (function restoreBackground() {
    var saved = null;
    try { saved = window.localStorage.getItem(BG_STORE); } catch (e) {}
    // On unless it has been turned off, which is the answer that needs no
    // explaining: audio that stops because you looked at another tab is the
    // surprise, not audio that carries on.
    setBackground(saved !== '0', false);
  })();
  // The crossovers are stated in hertz and land on the slider, rather than the
  // other way round: 200 and 6 k are where they belong, and where on the travel
  // that happens to be is the log axis's business.
  split.f1Pos = freqToSlider(SPLIT_F1);
  split.f2Pos = freqToSlider(SPLIT_F2);
  buildStems();
  nameStems();
  syncSplitLabels();
  syncSplitUi();
  el['aud-sep-width-val'].textContent = '\u00b1' + sepWidth().toFixed(1) + ' dB';
  el['aud-sep-voice-val'].textContent = sepVoice().toFixed(2) + '\u00d7';
  // The math panel starts closed on every visit. It is not remembered, and it
  // is not carried in a link.
  mathOn = false;
  el['aud-math-on'].checked = false;
  // One call puts every effect control on the master rack's numbers, which is
  // also what draws the chain strip and the stem rows for the first time.
  syncRackUi();
  renderStems();
  playThrough = el['aud-q-through'].checked;

  (function restoreMode() {
    var saved = null;
    try { saved = window.localStorage.getItem(MODE_STORE); } catch (e) {}
    // Simple until someone asks for the desk. A first visit is far more often
    // someone opening a link than someone building one, and the switch out of it
    // is the one control that shows in both modes.
    setMode(saved !== 'p', false);
  })();

  try {
    var savedKey = window.sessionStorage.getItem(KEY_STORE);
    if (savedKey) {
      el['aud-key'].value = savedKey;
      // Opened rather than left collapsed, so it is obvious a key is in play and
      // uploads are not being held to the usual ceiling.
      el['aud-key'].parentNode.open = true;
    }
  } catch (e) {}

  // The delete password field beside the button follows the one in the share
  // panel, so someone who has just set a password sees where it will be asked for.
  el['aud-share-pass'].addEventListener('input', syncDanger);

  el['aud-key'].addEventListener('input', function() {
    var v = el['aud-key'].value.trim();
    try {
      if (v) window.sessionStorage.setItem(KEY_STORE, v);
      else window.sessionStorage.removeItem(KEY_STORE);
    } catch (e) {}
  });

  renderQueue();
  txSyncControls();

  if (location.hash.length > 1) {
    // A hand-edited hash should never take the page down with it.
    try { applyState(decodeState(location.hash)); }
    catch (err) { if (window.console) console.warn('Could not read the shared state:', err); }
  }

  sizeCanvas();
  draw();
})();
</script>
